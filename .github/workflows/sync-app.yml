#!/usr/bin/env bash
# When a release is published (or manually dispatched), this workflow downloads
# app.html from the latest release and commits it to main so GitHub Pages serves
# it same-origin (no CORS issues).
name: Sync app bundle from release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download app.html from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'app.html' --output app.html
          test -s app.html
          echo "downloaded $(wc -c < app.html) bytes"
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "app.html already up to date"
          else
            git commit -m "chore: sync app.html from latest release"
            git push
          fi
