{id:"q2-stat-4", ch:"m-stat", d:2, ty:"NUM", q:"For the distribution 0-10 (f = 6), 10-20 (f = 8), 20-30 (f = 10), 30-40 (f = 12), 40-50 (f = 6), find the median.", o:[], a:-1, ans:"27", concept:"Median of grouped data using cumulative frequencies and the median-class formula", mis:"Careless mistake", h1:"Cumulative frequencies will tell you where the middle of the data lies.", h2:"Find n/2, locate the median class from the cumulative frequency table, then apply Median = l + ((n/2 - cf) / f) × h.", h3:"n/2 = 21; the cumulative frequency just before the median class is 14, and the median class starts at l = 20.", sol:["Σf = n = 6 + 8 + 10 + 12 + 6 = 42, so n/2 = 21", "Cumulative frequencies: 6, 14, 24, 36, 42; the first CF ≥ 21 is 24, so the median class is 20-30", "Here l = 20, cf (cumulative frequency of the class before) = 14, f = 10, h = 10", "Median = l + ((n/2 - cf) / f) × h = 20 + ((21 - 14) / 10) × 10 = 20 + 7 = 27", "Check: 27 lies inside the median class 20-30, as it must."], exp:"In the median formula, cf is always the cumulative frequency of the class BEFORE the median class.", board:true},

{id:"q2-stat-5", ch:"m-stat", d:2, ty:"MCQ", q:"For a moderately skewed distribution, the mean is 12 and the mode is 15. The median of the distribution is:", o:["13","13.5","14","11"], a:0, concept:"Empirical relation between mean, median and mode", mis:"Formula mistake", h1:"There is an empirical shortcut connecting these three averages.", h2:"Use the empirical relation 3 Median = Mode + 2 Mean.", h3:"Substitute mode = 15 and mean = 12 into 3 Median = Mode + 2 Mean, then solve for the median.", sol:["Empirical relation: 3 Median = Mode + 2 Mean", "3 Median = 15 + 2 × 12 = 15 + 24 = 39", "Median = 39 / 3 = 13", "Check: for moderately skewed data the median lies between the mean 12 and the mode 15, and 13 does."], exp:"3 Median = Mode + 2 Mean - the median always sits closer to the mean than to the mode.", board:true},

// ============ m-prob : Probability (5) ============
{id:"q2-prob-1", ch:"m-prob", d:2, ty:"MCQ", q:"Two dice are thrown together. The probability that the sum of the numbers on the two dice is 8 is:", o:["5/36","7/36","5/18","1/6"], a:0, concept:"Two-dice sample space and counting favourable ordered pairs", mis:"Calculation mistake", h1:"List the sample space systematically as ordered pairs.", h2:"Total outcomes = 36; count the ordered pairs (x, y) with x + y = 8.", h3:"Start listing pairs: (2,6) and (6,2) both count, but (4,4) appears only once.", sol:["Total outcomes for two dice = 6 × 6 = 36", "Pairs with sum 8: (2,6), (3,5), (4,4), (5,3), (6,2) - that is 5 outcomes", "P(sum = 8) = 5/36", "Check: counting (4,4) twice or merging (2,6) with (6,2) would wrongly give 6 or 4 outcomes."], exp:"With two dice, ordered pairs matter: (2,6) and (6,2) are different outcomes, but (4,4) is a single one.", board:true},

{id:"q2-prob-2", ch:"m-prob", d:3, ty:"MCQ", q:"One card is drawn at random from a well-shuffled deck of 52 cards. The probability that the card drawn is neither a king nor a heart is:", o:["9/13","1/13","3/4","10/13"], a:0, concept:"Complement rule with inclusion-exclusion for the union of card events (king or heart)", mis:"Logic mistake", h1:"'Neither ... nor' means removing both sets of cards from the deck.", h2:"Use the complement: P(neither) = 1 - P(king or heart), with P(king or heart) = 4/52 + 13/52 - 1/52.", h3:"Combine the fractions to get P(king or heart) = 16/52; the required probability is 1 minus this.", sol:["P(king) = 4/52, P(heart) = 13/52, P(king of hearts) = 1/52", "P(king or heart) = 4/52 + 13/52 - 1/52 = 16/52 (the overlapping card is subtracted once)", "P(neither king nor heart) = 1 - 16/52 = 36/52 = 9/13", "Check: cards removed = 4 kings + 12 non-king hearts = 16, leaving 52 - 16 = 36 favourable cards out of 52."], exp:"The king of hearts lies in both sets - inclusion-exclusion removes the overlap exactly once.", board:true},

{id:"q2-prob-3", ch:"m-prob", d:3, ty:"MCQ", q:"Two dice are thrown together. The probability of getting at least one six is:", o:["11/36","1/6","1/3","25/36"], a:0, concept:"Complement rule for 'at least one' events", mis:"Method-selection mistake", h1:"'At least one' questions reward thinking about what does NOT happen.", h2:"Use the complement rule: P(at least one 6) = 1 - P(no six on either die).", h3:"P(no six on one die) = 5/6; multiply for the two independent dice.", sol:["P(no six on one die) = 5/6", "Dice are independent: P(no six on both) = 5/6 × 5/6 = 25/36", "P(at least one six) = 1 - 25/36 = 11/36", "Check: direct count of pairs containing a 6 gives 6 + 6 - 1 = 11 outcomes, i.e. 11/36."], exp:"For 'at least one', compute 1 - P(none) - it replaces messy counting with one multiplication.", board:true},

{id:"q2-prob-4", ch:"m-prob", d:1, ty:"NUM", q:"A bag contains 5 red, 8 white and 7 black balls. A ball is drawn at random from the bag. Find the probability that the ball drawn is not black.", o:[], a:-1, ans:"13/20", concept:"Classical probability of a complementary colour event from a bag", mis:"Reading mistake", h1:"How many balls are in the bag altogether?", h2:"P(not black) = (number of balls that are not black) / (total number of balls).", h3:"First find the total number of balls, then count the red and white ones together.", sol:["Total balls = 5 + 8 + 7 = 20", "Balls that are not black = 5 red + 8 white = 13", "P(not black) = 13/20", "Check: P(black) = 7/20 and 13/20 + 7/20 = 1, so the answer is a valid probability."], exp:"'Not black' covers every other colour in the bag - add red and white before dividing by the total.", board:true},

{id:"q2-prob-5", ch:"m-prob", d:3, ty:"SA", q:"Two dice are rolled once. Find the probability that the sum of the numbers appearing on the two dice is a prime number. Also state the number of favourable outcomes.", o:[], a:-1, ans:"15 favourable outcomes; probability = 15/36 = 5/12", concept:"Two-dice probability with a number-property condition (prime sums)", mis:"Concept mistake", h1:"First decide which sums between 2 and 12 are prime.", h2:"For each prime sum, count its ordered pairs; remember a sum s has (s - 1) pairs for s up to 7.", h3:"The prime sums are 2, 3, 5, 7, 11 - count the ordered pairs for each and add them.", sol:["Possible sums run from 2 to 12; the prime sums are 2, 3, 5, 7, 11", "Number of ordered pairs for each prime sum: 2 → 1, 3 → 2, 5 → 4, 7 → 6, 11 → 2", "Favourable outcomes = 1 + 2 + 4 + 6 + 2 = 15", "P(prime sum) = 15/36 = 5/12", "Check: 1 is not prime, and the non-prime sums 4, 6, 8, 9, 10, 12 account for the other 21 outcomes (15 + 21 = 36)."], exp:"1 is not prime, and a sum s (up to 7) can be made in exactly s - 1 ways with two dice.", board:true},

// ============ m-circ : Circles (4) ============
{id:"q2-circ-1", ch:"m-circ", d:2, ty:"MCQ", q:"Two concentric circles have radii 5 cm and 3 cm. A chord of the larger circle touches the smaller circle. The length of the chord is:", o:["8 cm","6 cm","10 cm","4 cm"], a:0, concept:"Radius-perpendicular-to-tangent property applied to a chord of a concentric circle", mis:"Concept mistake", h1:"Draw the radius of the smaller circle to the point where the chord touches it, and join the common centre to the chord.", h2:"The tangent is perpendicular to the radius at the point of contact, so a right triangle is formed - use Pythagoras.", h3:"Use the larger radius 5 as the hypotenuse and the smaller radius 3 as the perpendicular distance from the centre to the chord.", sol:["Let the chord touch the smaller circle at T, and let O be the common centre", "Radius OT ⊥ chord, so OT = 3 cm is the perpendicular distance from O to the chord", "Half-chord = √(5² - 3²) = √(25 - 9) = √16 = 4 cm", "Chord length = 2 × 4 = 8 cm", "Check: the right triangle formed has sides 3, 4, 5 - the classic Pythagorean triple."], exp:"Radius-to-tangent perpendicularity turns every tangent problem into a right-triangle problem.", board:true},

{id:"q2-circ-2", ch:"m-circ", d:2, ty:"MCQ", q:"Two tangents PQ and PR are drawn from an external point P to a circle with centre O, touching the circle at Q and R. If ∠QPR = 60°, then ∠QOR equals:", o:["120°","60°","90°","150°"], a:0, concept:"Relation between the angle between two tangents and the angle subtended at the centre", mis:"Logic mistake", h1:"The quadrilateral OQPR hides two right angles.", h2:"Radius ⊥ tangent at the point of contact, so ∠OQP = ∠ORP = 90°; the angles of a quadrilateral sum to 360°.", h3:"Add the two right angles and the given 60°, then subtract the total from 360°.", sol:["Radius ⊥ tangent: ∠OQP = 90° and ∠ORP = 90°", "Angles of quadrilateral OQPR sum to 360°", "∠QOR = 360° - 90° - 90° - 60° = 120°", "Check: ∠QOR + ∠QPR = 120° + 60° = 180°, the standard supplementary pair for two tangents."], exp:"Angle between two tangents + angle at the centre = 180°, always.", board:true},

{id:"q2-circ-3", ch:"m-circ", d:3, ty:"NUM", q:"The sides of a triangle are 10 cm, 24 cm and 26 cm. A circle is inscribed in this triangle. Find the radius of the inscribed circle.", o:[], a:-1, ans:"4 cm", concept:"Inradius of a right triangle via Area = r × semi-perimeter", mis:"Method-selection mistake", h1:"The incenter is equidistant from all three sides - connect the triangle's area to that distance.", h2:"Use Area of triangle = r × s, where s is the semi-perimeter; first confirm the triangle is right-angled using the converse of the Pythagorean theorem.", h3:"First confirm the triangle is right-angled, then compute Area = ½ × 10 × 24 and s = (10 + 24 + 26)/2.", sol:["10² + 24² = 100 + 576 = 676 = 26², so the triangle is right-angled", "Area = ½ × 10 × 24 = 120 cm²", "Semi-perimeter s = (10 + 24 + 26)/2 = 30 cm", "Area = r × s gives r = 120/30 = 4 cm", "Check: for a right triangle, r = (a + b - c)/2 = (10 + 24 - 26)/2 = 4 cm - same answer."], exp:"Area = r × semi-perimeter cracks every inscribed-circle radius problem in one line.", board:true},

{id:"q2-circ-4", ch:"m-circ", d:3, ty:"MCQ", q:"A quadrilateral ABCD circumscribes a circle touching its sides AB, BC, CD and DA at P, Q, R and S respectively. If AB = 9 cm, BC = 12 cm and CD = 15 cm, then AD equals:", o:["12 cm","15 cm","18 cm","10 cm"], a:0, concept:"Equal tangent segments from the same external point in a circumscribing quadrilateral", mis:"Concept mistake", h1:"From each vertex of the quadrilateral, the two tangent segments to the circle are equal.", h2:"Write each side as a sum of two tangent segments; equal tangents from the same external point cancel in pairs when you add opposite sides.", h3:"Show that AB + CD = BC + AD, then substitute the three known side lengths.", sol:["Tangents from the same point are equal: AP = AS, BP = BQ, CQ = CR, DR = DS", "AB + CD = (AP + PB) + (CR + RD) and BC + AD = (BQ + QC) + (DS + SA)", "Substituting the equal tangent pairs shows AB + CD = BC + AD", "AD = AB + CD - BC = 9 + 15 - 12 = 12 cm", "Check: opposite sums match - AB + CD = 24 cm and BC + AD = 12 + 12 = 24 cm."], exp:"In any quadrilateral circumscribing a circle, the sums of opposite sides are equal.", board:true},

// ============ m-surf : Surface Areas & Volumes (5) ============
{id:"q2-surf-1", ch:"m-surf", d:2, ty:"MCQ", q:"A copper sphere of radius 6 cm is melted and drawn into a cylindrical wire of radius 0.2 cm. The length of the wire so obtained is:", o:["72 m","7.2 m","36 m","720 m"], a:0, concept:"Volume conservation when recasting a sphere into a cylindrical wire", mis:"Unit mistake", h1:"No metal is lost or gained when the sphere is recast.", h2:"Equate the volumes: (4/3)π(6)³ = π(0.2)² × L, and solve for L.", h3:"Solve for L in centimetres first, then convert to metres at the very end.", sol:["Volume of sphere = (4/3)πr³ = (4/3)π(6)³ = 288π cm³", "Wire is a cylinder of radius 0.2 cm: V = π(0.2)²L = 0.04πL cm³", "Melting conserves volume: 0.04πL = 288π", "L = 288/0.04 = 7200 cm = 72 m", "Check: 7200 cm ÷ 100 = 72 m - the unit conversion is the final step, not the first."], exp:"Recasting conserves volume; keep everything in cm and convert to m only at the end.", board:true},

{id:"q2-surf-2", ch:"m-surf", d:2, ty:"MCQ", q:"A toy is in the form of a cone mounted on a hemisphere, both of radius 3.5 cm. The total height of the toy is 15.5 cm. The total surface area of the toy is:", o:["214.5 cm²","176 cm²","154 cm²","68.25 cm²"], a:0, concept:"Surface area of a cone-on-hemisphere combination solid", mis:"Formula mistake", h1:"Decide which curved surfaces of the toy are actually exposed.", h2:"TSA = πrl + 2πr²; get the cone's slant height from l = √(h² + r²) with h = 15.5 - 3.5.", h3:"The cone's height is 15.5 - 3.5 = 12 cm, so l = √(12² + 3.5²); then apply TSA = πrl + 2πr².", sol:["Radius r = 3.5 cm; height of the cone = 15.5 - 3.5 = 12 cm", "Slant height l = √(12² + 3.5²) = √(144 + 12.25) = √156.25 = 12.5 cm", "TSA = CSA of cone + CSA of hemisphere = πrl + 2πr²", "= (22/7)(3.5 × 12.5) + 2 × (22/7)(3.5)² = (22/7)(43.75) + (22/7)(24.5)", "= (22/7)(68.25) = 214.5 cm²", "Check: 68.25 × 22/7 = 214.5, and only the two curved surfaces are exposed - no flat circle exists on this toy."], exp:"For a cone-on-hemisphere toy, TSA = πrl + 2πr² - the flat circle where they join is hidden inside.", board:true},

{id:"q2-surf-3", ch:"m-surf", d:3, ty:"NUM", q:"A solid metallic cone of base radius 6 cm and height 24 cm is melted and recast into a solid sphere. Find the radius of the sphere.", o:[], a:-1, ans:"6 cm", concept:"Volume conservation when recasting a cone into a sphere", mis:"Concept mistake", h1:"Melting keeps the volume fixed.", h2:"Equate the volumes: (1/3)π(6)²(24) = (4/3)πR³, and cancel π.", h3:"Set the cone volume (1/3)π(6)²(24) equal to (4/3)πR³ and cancel π from both sides.", sol:["Volume of cone = (1/3)πr²h = (1/3)π × 36 × 24 = 288π cm³", "Volume of sphere = (4/3)πR³; conservation gives (4/3)πR³ = 288π", "R³ = 288 × 3/4 = 216", "R = 6 cm, since 6³ = 216", "Check: (4/3)π(6)³ = 288π, which matches the cone's volume exactly."], exp:"Cone melted into a sphere: R³ = r²h/4 - friendly numbers often give R equal to a familiar cube.", board:true},

{id:"q2-surf-4", ch:"m-surf", d:2, ty:"MCQ", q:"The radii of two spheres are in the ratio 3 : 2. The ratio of their volumes is:", o:["27 : 8","9 : 4","3 : 2","9 : 8"], a:0, concept:"Scaling of volumes with the cube of the linear ratio", mis:"Concept mistake", h1:"Think about how volume scales when every length is scaled by the same factor.", h2:"Volume of a sphere is (4/3)πr³, so the ratio of volumes is the cube of the ratio of radii.", h3:"Cancel the common factor (4/3)π first, then cube each part of the ratio 3 : 2.", sol:["Volumes: (4/3)π(3)³ and (4/3)π(2)³", "The constant factor (4/3)π cancels", "Ratio = 3³ : 2³ = 27 : 8", "Check: (3/2)³ = 27/8, so the volume ratio is 27 : 8 (surface areas would be 9 : 4)."], exp:"Lengths scale linearly, areas scale squared, volumes scale cubed.", board:true},

{id:"q2-surf-5", ch:"m-surf", d:4, ty:"SA", q:"A right circular cylinder of radius 60 cm and height 180 cm is full of water. A solid iron piece consisting of a right circular cone of radius 60 cm and height 120 cm standing on a hemisphere of radius 60 cm is placed in it so that it touches the bottom of the cylinder. Find the volume of water left in the cylinder. (Use π = 3.14)", o:[], a:-1, ans:"360000π cm³ = 1130400 cm³ = 1.1304 m³ (using π = 3.14)", concept:"Volume of displaced water equals the volume of the submerged composite solid", mis:"Logic mistake", h1:"The water that remains is the cylinder's volume minus what the solid pushes aside.", h2:"Volume left = πr²h (cylinder) - [(1/3)πr²h (cone) + (2/3)πr³ (hemisphere)], with r = 60 cm for all three parts.", h3:"Compute the cylinder volume π(60)²(180) first; the solid's cone and hemisphere come next, all as multiples of π.", sol:["Cylinder: V = πr²h = π × 60² × 180 = 648000π cm³", "Cone: V = (1/3)π(60)²(120) = (1/3) × 3600 × 120 × π = 144000π cm³", "Hemisphere: V = (2/3)π(60)³ = (2/3) × 216000π = 144000π cm³", "Water left = 648000π - (144000π + 144000π) = 360000π cm³", "= 360000 × 3.14 = 1130400 cm³ = 1.1304 m³", "Check: the solid occupies 288000π cm³, exactly 4/9 of the cylinder's 648000π cm³."], exp:"Displaced-water problems are conservation-of-volume problems in disguise: water left = cylinder - submerged solid.", board:true},

// ============ m-arca : Areas Related to Circles (4) ============
{id:"q2-arca-1", ch:"m-arca", d:2, ty:"MCQ", q:"The area of a sector of a circle of radius 21 cm with central angle 150° is:", o:["577.5 cm²","1155 cm²","288.75 cm²","5.775 cm²"], a:0, concept:"Area of a circular sector as a fraction of the circle", mis:"Calculation mistake", h1:"A sector is a fixed fraction of the full circle.", h2:"Use Area = (θ/360) × πr².", h3:"Simplify the fraction 150/360 first, then multiply by πr² = (22/7) × 21².", sol:["Area of sector = (θ/360) × πr²", "θ/360 = 150/360 = 5/12", "πr² = (22/7) × 21² = (22/7) × 441 = 1386 cm²", "Area = (5/12) × 1386 = 6930/12 = 577.5 cm²", "Check: 577.5 cm² is less than the full circle area 1386 cm², as it must be."], exp:"Sector area = (θ/360) of the circle - reduce the angle fraction before multiplying.", board:true},

{id:"q2-arca-2", ch:"m-arca", d:2, ty:"NUM", q:"Find the length of an arc which subtends an angle of 60° at the centre of a circle of radius 10.5 cm.", o:[], a:-1, ans:"11 cm", concept:"Arc length as a fraction of the circumference", mis:"Formula mistake", h1:"The arc is a fraction of the whole circumference.", h2:"Use Arc length = (θ/360) × 2πr.", h3:"First find the circumference 2πr with r = 10.5 cm, then take the fraction 60/360 of it.", sol:["Arc length = (θ/360) × 2πr", "2πr = 2 × (22/7) × 10.5 = 66 cm", "θ/360 = 60/360 = 1/6", "Arc = 66 × 1/6 = 11 cm", "Check: 60° is one-sixth of a full turn, and 11 × 6 = 66 = the circumference."], exp:"Arc length scales the circumference by θ/360 - never the area formula.", board:true},

{id:"q2-arca-3", ch:"m-arca", d:2, ty:"MCQ", q:"In a circle of radius 7 cm, a chord subtends an angle of 90° at the centre. The area of the corresponding minor segment is:", o:["14 cm²","38.5 cm²","24.5 cm²","154 cm²"], a:0, concept:"Area of a minor segment (sector minus triangle) in the 90° special case", mis:"Concept mistake", h1:"A segment is what remains when a triangle is removed from a sector.", h2:"Segment = sector area - area of the isosceles triangle formed by the two radii and the chord.", h3:"The sector is one-quarter of πr²; the triangle has area ½ × 7 × 7. Subtract in the right order.", sol:["Sector area = (90/360) × πr² = (1/4) × (22/7) × 49 = 38.5 cm²", "Triangle formed by the two radii and the chord: area = ½ × 7 × 7 = 24.5 cm²", "Segment = sector - triangle = 38.5 - 24.5 = 14 cm²", "Check: 14 < 38.5, and the segment is indeed the smaller piece left after removing the triangle."], exp:"For a 90° segment: area = (π/4)r² - r²/2 - subtract the triangle from the sector, never the reverse.", board:true},

{id:"q2-arca-4", ch:"m-arca", d:3, ty:"NUM", q:"A square sheet of side 14 cm has four quadrants of radius 7 cm cut out from it, one at each corner. Find the area of the remaining sheet.", o:[], a:-1, ans:"42 cm²", concept:"Composite areas: four quadrants inside a square", mis:"Method-selection mistake", h1:"Put the four corner pieces together in your mind.", h2:"The four quadrants of radius 7 cm together form one full circle; remaining area = square - circle.", h3:"The four quadrants of radius 7 cm make one full circle of area (22/7) × 7²; subtract this from the square's area.", sol:["Area of square = 14 × 14 = 196 cm²", "Four quadrants of radius 7 cm = one full circle of area (22/7) × 7² = 154 cm²", "Remaining area = 196 - 154 = 42 cm²", "Check: each quadrant has area (1/4)(22/7)(49) = 38.5 cm², and 4 × 38.5 = 154 cm²."], exp:"Four quadrants of the same radius always assemble into exactly one circle.", board:true},

// ============ m-atrig : Some Applications of Trigonometry (4) ============
{id:"q2-atrig-1", ch:"m-atrig", d:2, ty:"MCQ", q:"The angle of elevation of the top of a tower from a point on the ground, 30 m from the foot of the tower, is 60°. The height of the tower is:", o:["30√3 m","10√3 m","30 m","60 m"], a:0, concept:"Using tan of the angle of elevation to relate height and base distance", mis:"Formula mistake", h1:"Draw the right triangle: base along the ground, tower vertical, line of sight as hypotenuse.", h2:"Use tan(angle of elevation) = height / base distance, with tan 60° = √3.", h3:"Write tan 60° = h/30 with tan 60° = √3, and solve for h.", sol:["Let the height be h; base distance = 30 m", "tan 60° = h/30 ⇒ √3 = h/30", "h = 30√3 ≈ 51.96 m", "Check: since 60° > 45°, the height must exceed the base distance, and 51.96 > 30."], exp:"Angle of elevation is measured from the horizontal at the observer's eye up to the object.", board:true},

{id:"q2-atrig-2", ch:"m-atrig", d:3, ty:"MCQ", q:"From a point A on the ground, the angle of elevation of the top of a tower is 30°. On walking 20 m towards the tower to a point B, the angle of elevation becomes 60°. The height of the tower is:", o:["10√3 m","20√3 m","10 m","20 m"], a:0, concept:"Two-position elevation problem solved with a common height variable", mis:"Method-selection mistake", h1:"Let the height be h and express the two horizontal distances from the tower's foot.", h2:"Distance from far point = h/tan 30° = h√3; distance from near point = h/tan 60° = h/√3; their difference is 20 m.", h3:"Write x = h/√3 (from the 60° triangle) and x + 20 = h√3 (from the 30° triangle), then eliminate x.", sol:["Let height = h; let the foot-to-B distance be x, so the foot-to-A distance is x + 20", "From B: tan 60° = h/x ⇒ x = h/√3", "From A: tan 30° = h/(x + 20) ⇒ x + 20 = h√3", "Subtract: 20 = h√3 - h/√3 = 2h/√3 ⇒ h = 20√3/2 = 10√3 ≈ 17.32 m", "Check: x = (10√3)/√3 = 10, and x + 20 = 30 = h√3 = 10√3 × √3 - consistent."], exp:"Two-position tower problems: subtract the two 'distance = h/tan θ' expressions to eliminate the height.", board:true},

{id:"q2-atrig-3", ch:"m-atrig", d:2, ty:"NUM", q:"From the top of a tower 60 m high, the angle of depression of a car on the road is 30°. Find the distance of the car from the foot of the tower.", o:[], a:-1, ans:"60√3 m ≈ 103.92 m", concept:"Angle of depression as an alternate interior angle of elevation", mis:"Concept mistake", h1:"The angle of depression is measured from the horizontal at the top of the tower.", h2:"By alternate interior angles, the angle of elevation of the tower's top from the car is also 30°; use tan 30° = 60/d.", h3:"Use tan 30° = 60/d with tan 30° = 1/√3, and solve for d.", sol:["Angle of depression from the top = angle of elevation of the top from the car (alternate interior angles) = 30°", "tan 30° = 60/d, where d is the car's distance from the foot of the tower", "1/√3 = 60/d ⇒ d = 60√3", "d ≈ 103.92 m", "Check: since 30° < 45°, the distance must exceed the height 60 m, and 103.92 > 60."], exp:"Angle of depression from the top equals angle of elevation from the bottom - alternate angles with the horizontal.", board:true},

{id:"q2-atrig-4", ch:"m-atrig", d:3, ty:"SA", q:"From the top of a building 7 m high, the angle of elevation of the top of a cable tower is 60° and the angle of depression of its foot is 45°. Find the height of the tower.", o:[], a:-1, ans:"7(1 + √3) m ≈ 19.12 m", concept:"Splitting a figure into depression and elevation triangles that share a horizontal distance", mis:"Logic mistake", h1:"The building and the tower stand on the same horizontal ground - two right triangles share the same horizontal distance.", h2:"The 45° depression triangle gives the horizontal distance; the 60° elevation triangle then gives the tower's extra height above the building.", h3:"From the 45° triangle the horizontal distance equals the building's height; the extra height above the building is that distance times tan 60°.", sol:["Let the horizontal distance between the building and the tower be d, and the tower's height be H", "Angle of depression of the foot = 45°: tan 45° = 7/d ⇒ d = 7 m", "Angle of elevation of the top = 60°: extra height above the building = d × tan 60° = 7√3 ≈ 12.12 m", "H = 7 + 7√3 = 7(1 + √3) ≈ 19.12 m", "Check: 7√3 ≈ 12.12, and 7 + 12.12 = 19.12 m - the tower is about 2.7 times the building's height, consistent with a steep 60° elevation."], exp:"Depression to the foot pins the horizontal distance; elevation to the top then supplies the extra height.", board:true},

// ============ m-coord : Coordinate Geometry (4) ============
{id:"q2-coord-1", ch:"m-coord", d:2, ty:"MCQ", q:"The point which divides the line segment joining A(-2, 3) and B(3, -7) internally in the ratio 2 : 3 is:", o:["(0, -1)","(1, -3)","(0, 1)","(-1, 0)"], a:0, concept:"Internal section formula in a given ratio", mis:"Calculation mistake", h1:"The section formula is a weighted average of the endpoints' coordinates.", h2:"Use P = ((mx₂ + nx₁)/(m + n), (my₂ + ny₁)/(m + n)) with m : n = 2 : 3.", h3:"Apply the formula with x₁ = -2, y₁ = 3, x₂ = 3, y₂ = -7, m = 2, n = 3 - watch every sign.", sol:["Section formula: P = ((mx₂ + nx₁)/(m+n), (my₂ + ny₁)/(m+n)) with m : n = 2 : 3", "x = (2×3 + 3×(-2))/5 = (6 - 6)/5 = 0", "y = (2×(-7) + 3×3)/5 = (-14 + 9)/5 = -5/5 = -1", "P = (0, -1)", "Check: x = 0 lies between -2 and 3, and y = -1 lies between -7 and 3, so P is on the segment."], exp:"In the section formula, the weight m pairs with the SECOND point's coordinate and n with the first.", board:true},

{id:"q2-coord-2", ch:"m-coord", d:2, ty:"MCQ", q:"If the points (8, 1), (k, -1) and (2, 3) are collinear, then k equals:", o:["14","10","12","16"], a:0, concept:"Collinearity test via triangle area = 0", mis:"Method-selection mistake", h1:"Three points on one line means the triangle they form has zero area.", h2:"Set (1/2)|x₁(y₂ - y₃) + x₂(y₃ - y₁) + x₃(y₁ - y₂)| = 0.", h3:"Set up the area expression (1/2)|8(-1 - 3) + k(3 - 1) + 2(1 - (-1))| and equate it to zero.", sol:["Area of triangle with vertices (8, 1), (k, -1), (2, 3) must be 0 for collinearity", "(1/2)|8(-1 - 3) + k(3 - 1) + 2(1 - (-1))| = (1/2)|-32 + 2k + 4|", "Collinear ⇒ |2k - 28| = 0", "2k = 28 ⇒ k = 14", "Check: slope from (8, 1) to (14, -1) = -2/6 = -1/3, same as the slope from (8, 1) to (2, 3) = 2/(-6) = -1/3."], exp:"Collinearity ⇔ triangle area = 0 - no distance formulas needed.", board:true},

{id:"q2-coord-3", ch:"m-coord", d:3, ty:"MCQ", q:"The vertices of a triangle are A(3, 0), B(6, 4) and C(-1, 3). The triangle is:", o:["Right-angled and isosceles","Equilateral","Scalene and right-angled","Isosceles but not right-angled"], a:0, concept:"Classifying a triangle from side lengths and the Pythagorean check", mis:"Logic mistake", h1:"Find all three sides using the distance formula first.", h2:"Compute AB, BC and CA; then test both equality of sides and the Pythagorean relation among their squares.", h3:"Compute AB², BC² and CA² first - see which two match, then test whether their sum equals the third.", sol:["AB = √((6-3)² + (4-0)²) = √(9 + 16) = √25 = 5", "CA = √((3-(-1))² + (0-3)²) = √(16 + 9) = √25 = 5", "BC = √((6-(-1))² + (4-3)²) = √(49 + 1) = √50 = 5√2", "AB = CA ⇒ isosceles; AB² + CA² = 25 + 25 = 50 = BC² ⇒ right angle at A", "Check: the triangle is right-angled and isosceles, with the right angle at A(3, 0)."], exp:"Always test sides for equality AND squares for the Pythagorean relation before naming the triangle.", board:true},

{id:"q2-coord-4", ch:"m-coord", d:2, ty:"NUM", q:"Find the ratio in which the x-axis divides the line segment joining the points (2, -3) and (5, 6).", o:[], a:-1, ans:"1 : 2 (internally)", concept:"Using the section formula with an unknown ratio and a known point on an axis", mis:"Formula mistake", h1:"Every point on the x-axis has y-coordinate 0.", h2:"Let the ratio be k : 1 and set the y-coordinate from the section formula equal to 0.", h3:"Write the y-coordinate as (6k - 3)/(k + 1) using the section formula, then set it equal to 0.", sol:["Let the ratio be k : 1; the dividing point lies on the x-axis, so its y-coordinate is 0", "y = (k×6 + 1×(-3))/(k + 1) = (6k - 3)/(k + 1) = 0", "6k - 3 = 0 ⇒ k = 1/2", "Ratio = (1/2) : 1 = 1 : 2 (internal division)", "Check: dividing (2, -3) and (5, 6) in the ratio 1 : 2 gives x = (1×5 + 2×2)/3 = 3 and y = (1×6 + 2×(-3))/3 = 0, i.e. the point (3, 0) on the x-axis."], exp:"Axis-division problems: set the axis coordinate to zero and solve for k in the ratio k : 1.", board:true},

// ============ m-ap : Arithmetic Progressions (5) ============
{id:"q2-ap-1", ch:"m-ap", d:2, ty:"MCQ", q:"If the nth term of an AP is given by aₙ = 7 - 4n, then the common difference of the AP is:", o:["-4","4","7","3"], a:0, concept:"Common difference from a linear nth term expression", mis:"Concept mistake", h1:"Compare two consecutive terms of the sequence.", h2:"Use d = aₙ₊₁ - aₙ for any n.", h3:"Compute a₁ = 7 - 4(1) and a₂ = 7 - 4(2), then take their difference.", sol:["a₁ = 7 - 4(1) = 3", "a₂ = 7 - 4(2) = -1", "d = a₂ - a₁ = -1 - 3 = -4", "Check: a₃ = 7 - 12 = -5, and a₃ - a₂ = -5 - (-1) = -4 as well."], exp:"In aₙ = pn + q, the common difference is simply p - the coefficient of n.", board:true},

{id:"q2-ap-2", ch:"m-ap", d:2, ty:"MCQ", q:"Which term of the AP 5, 11, 17, ... is 131?", o:["22","21","23","20"], a:0, concept:"Finding the term number n from aₙ = a + (n-1)d", mis:"Calculation mistake", h1:"Use the nth term form of the sequence.", h2:"Set a + (n - 1)d = 131 with a = 5 and d = 6.", h3:"Solve 5 + 6(n - 1) = 131 step by step.", sol:["a = 5, d = 11 - 5 = 6", "aₙ = a + (n-1)d: 131 = 5 + 6(n - 1)", "126 = 6(n - 1) ⇒ n - 1 = 21", "n = 22", "Check: a₂₂ = 5 + 21 × 6 = 5 + 126 = 131."], exp:"After dividing by d, remember the equation gives n - 1, not n - add the 1 back.", board:true},

{id:"q2-ap-3", ch:"m-ap", d:2, ty:"MCQ", q:"Three numbers are in AP. Their sum is 24 and their product is 440. The numbers are:", o:["5, 8, 11","6, 8, 10","4, 8, 12","7, 8, 9"], a:0, concept:"Symmetric (a - d, a, a + d) representation for three terms in AP", mis:"Method-selection mistake", h1:"The sum condition suggests a symmetric representation of the three terms.", h2:"Take the numbers as a - d, a, a + d; then 3a = 24 and (a - d)a(a + d) = 440.", h3:"3a = 24 gives the middle number; substitute it into the product equation to form an equation in d.", sol:["Let the numbers be a - d, a, a + d", "Sum: (a - d) + a + (a + d) = 3a = 24 ⇒ a = 8", "Product: (a - d)a(a + d) = a(a² - d²) = 8(64 - d²) = 440", "64 - d² = 55 ⇒ d² = 9 ⇒ d = 3", "Numbers: 5, 8, 11. Check: 5 + 8 + 11 = 24 and 5 × 8 × 11 = 440."], exp:"For three terms in AP, choose a - d, a, a + d - the sum immediately gives the middle term.", board:true},

{icon:"👑", t:"Why does gold resist every common acid, yet dissolve in aqua regia?", ch:"c-metal", body:[
"Observation: Gold ornaments come out of concentrated hydrochloric acid or concentrated nitric acid untouched — the same acids that eat through most metals — yet a 3:1 mixture of the two, called aqua regia or royal water, dissolves gold.",
"Concept: Gold lies near the bottom of the metal reactivity series, so no single common acid can oxidise it; aqua regia works because its two acids attack the metal in complementary ways at once.",
"Mechanism: Nitric acid acts as the oxidising agent, pulling electrons from gold atoms to form Au³⁺ ions, while hydrochloric acid supplies Cl⁻ ions that immediately bind those Au³⁺ ions into a stable complex (AuCl₄⁻); continuously removing gold ions from the equilibrium drives the dissolution forward until the metal is gone.",
"Evidence: Neither acid can do the job alone — one oxidises only feebly and the other not at all — and aqua regia's power is famous in history: the Nobel medals of German physicists were hidden from the Nazis by dissolving them in aqua regia, and the gold was recovered after the war.",
"Application: Aqua regia is still used to refine gold and recover it from electronic scrap, while gold's inertness is exactly why it is preferred for jewellery and for corrosion-proof electrical contacts."
]},
{icon:"🌡️", t:"Why does an iron nail float on mercury but sink in water?", ch:"c-metal", body:[
"Observation: Drop an iron nail in a trough of mercury and it bobs on the surface; drop the same nail in water and it sinks straight to the bottom.",
"Concept: Whether an object floats is decided by comparing its density with the liquid's — a body floats only if it is less dense than the fluid it is placed in.",
"Mechanism: Mercury is extraordinarily dense (13.6 g/cm³), much denser than iron (about 7.8 g/cm³), so by Archimedes' principle the nail has to submerge only a small fraction of its volume to displace its own weight of mercury, and it floats high. Water is far less dense than iron (1 g/cm³), so even a fully submerged nail displaces less water than its own weight and sinks.",
"Evidence: Iron ships float in water by the same logic in reverse — their hollow shape spreads the metal over such a large volume that the ship's average density drops below that of water.",
"Application: This quick float-or-sink test is used to sort metals and alloys by density, and mercury's high density once made it ideal for barometers and thermometers, though its toxicity has now phased out most of those uses."
]},
{icon:"🧼", t:"Why does soap clean better in warm water than in cold?", ch:"c-carbon", body:[
"Observation: Greasy utensils washed in warm soapy water come out clean quickly, while the same wash in cold water leaves a slippery film of oil behind.",
"Concept: Soap cleans by trapping oily dirt inside clusters called micelles, and both the softening of the grease and the working of the soap itself improve with temperature.",
"Mechanism: Warm water melts and loosens the greasy film so it breaks into droplets that soap molecules can surround — their hydrocarbon tails dissolve into the oil while their ionic heads stay in the water — and the resulting micelles carry the dirt away, staying suspended in the rinse water. Soap also dissolves more completely in warm water, leaving more free molecules available to attack the dirt.",
"Evidence: Try washing butter off a plate with ice-cold soapy water and then with warm water: the softened butter lifts away within seconds in the warm wash, while the cold one leaves a greasy smear that only long scrubbing removes.",
"Application: The same micelle chemistry explains why detergents were developed — their synthetic molecules form micelles just like soap but do not react with the Ca²⁺ and Mg²⁺ ions of hard water to form insoluble scum, so they clean even in cold, hard water."
]},
{icon:"🕯️", t:"Why does a candle flame blacken a steel spoon held just above it?", ch:"c-carbon", body:[
"Observation: Hold a cold steel spoon just over a candle's yellow flame and a black, sooty deposit forms on it within seconds.",
"Concept: A candle's luminous yellow zone is fuel-rich — it contains unburnt carbon particles glowing hot — and anything cooler placed in their path quenches their combustion.",
"Mechanism: The candle wax, a hydrocarbon, melts, vaporises and burns; in the inner luminous zone the supply of oxygen is limited, so combustion is incomplete and tiny carbon particles form and glow yellow. The cold spoon cools these particles below their ignition temperature before they can burn to carbon dioxide, so the solid carbon deposits on the metal as black soot.",
"Evidence: The spoon blackens only when held in or above the yellow region — held near the dark zone of unburnt vapour at the flame's base, it stays comparatively clean — showing that the soot comes specifically from the incompletely burning region.",
"Application: The same soot is lampblack (carbon black), used in inks, shoe polish and tyre rubber, and a sooty flame anywhere — from an LPG stove to a car engine — is the visible sign of incomplete, wasteful combustion; a well-adjusted burner burns with a clean blue flame."
]},
{icon:"🌸", t:"Why does the smell of perfume spread across a room by itself?", ch:"b-life", body:[
"Observation: Open a perfume bottle in one corner of a room and, within moments, people on the far side can smell it, even in perfectly still air.",
"Concept: Gas molecules are in constant random motion, and they naturally spread from a region where they are concentrated to regions where they are not — a process called diffusion.",
"Mechanism: Perfume molecules evaporate and zip around at hundreds of metres per second, colliding with air molecules about a billion times a second; each collision sends them off in a new random direction, yet the overall crowd of perfume particles spreads steadily outward from the bottle, because nothing pushes them back into the bottle once they leave.",
"Evidence: The same diffusion, across the wafer-thin walls of the lungs' alveoli and the capillaries wrapped around them, is what moves oxygen into the blood and carbon dioxide out of it — the reason the tiniest blood vessels lie pressed right against the air sacs.",
"Application: Diffusion is fastest in gases, slower in liquids and slowest in solids, and it speeds up with temperature — which is why we smell hot food from across a room much sooner than cold food."
]},
{icon:"🛡️", t:"Why doesn't the stomach digest itself?", ch:"b-life", body:[
"Observation: The stomach produces hydrochloric acid strong enough to kill germs and activate protein-digesting enzymes, yet its own wall stays intact for a lifetime.",
"Concept: The stomach is protected by a combination of physical armour — a thick mucus coating — and a chemical trick: its powerful enzyme is secreted in an inactive form.",
"Mechanism: Mucus-secreting cells coat the stomach lining with alkaline mucus that physically blocks acid and enzymes from reaching the living cells; the protein-digesting enzyme pepsin is made and stored as an inactive precursor, pepsinogen, and is switched on only after release into the stomach cavity where food is present; acid secretion is itself stimulated by the arrival of food, not maintained continuously.",
"Evidence: When the defence fails — for example when the bacterium Helicobacter pylori damages the mucus layer — acid attacks the lining and an ulcer forms, proving the protection is essential rather than incidental.",
"Application: This is why excessive acid secretion or long use of certain painkillers causes acidity and gastritis, and why antacids — mild bases like milk of magnesia — relieve the burning by simply neutralising the excess acid."
]},
{icon:"🧅", t:"Why does chopping onions make us cry?", ch:"b-ctrl", body:[
"Observation: A few cuts into an onion and our eyes sting and water, even though nothing at all has physically touched them.",
"Concept: Cutting ruptures onion cells and triggers a chemical reaction that releases a volatile, eye-irritating sulphur compound; tear production is a reflex response to that irritant.",
"Mechanism: Enzymes released from the cut cells convert the onion's sulphur compounds into a volatile irritant (propanethial S-oxide); it evaporates, diffuses through the air and reaches the eyes, where it stimulates nerve endings; the nervous system responds reflexively by ordering the lacrimal glands to flood the eyes with tears to wash the irritant away.",
"Evidence: Chilling the onion in the refrigerator beforehand makes you cry noticeably less — the lower temperature slows both the enzyme reaction and the evaporation of the irritant — and cutting under running water dissolves the compound before it can reach the air.",
"Application: The same irritant chemistry is the plant's defence against animals in the wild: the onion never evolved to be cut, and its tear-gas is why most pests avoid it — something cooks work around with cold onions, sharp knives (which damage fewer cells) and running water."
]},
{icon:"🩹", t:"Why do wounds heal more slowly in people with diabetes?", ch:"b-ctrl", body:[
"Observation: A small cut that closes within a week in most people can take weeks to heal in someone with poorly controlled diabetes.",
"Concept: Healing needs a steady supply of oxygen, nutrients and immune cells delivered by the blood — and the insulin problem that defines diabetes quietly damages exactly that supply.",
"Mechanism: Insulin from the pancreas normally helps body cells take up glucose; when it is lacking or ineffective, glucose stays high in the blood, which over time damages the small blood vessels supplying the skin and hampers the working of white blood cells. Without well-perfused tissue and effective immune cells, the ordered sequence of clotting, defence and repair that closes a wound simply stalls.",
"Evidence: Slow-healing wounds, recurring skin infections and tingling, numb feet are classic warning signs doctors use to detect undiagnosed diabetes — which is why diabetics are counselled on daily foot care.",
"Application: This is why keeping blood sugar under control matters far beyond feeling well day-to-day, and why insulin injections, first used in 1921, transformed type-1 diabetes from a fatal disease into a manageable one."
]},
{icon:"👶", t:"Why are some twins identical while others look no more alike than ordinary siblings?", ch:"b-repro", body:[
"Observation: Some twin pairs are so alike they can fool their own parents, while other twins look and behave like any two siblings born years apart.",
"Concept: Identical twins arise from a single fertilised egg, whereas non-identical (fraternal) twins arise from two separately fertilised eggs.",
"Mechanism: If one zygote — a single sperm fused with a single egg — accidentally splits into two cell masses early in development, each mass develops into a complete baby with the very same set of genes, producing identical twins. If instead two eggs are released in one cycle and each is fertilised by a different sperm, two genetically distinct zygotes develop side by side — siblings who merely share a womb and a birthday.",
"Evidence: Identical twins match on virtually every genetic test, while fraternal twins share only about half their variable genes — exactly the same relatedness as any ordinary brother and sister.",
"Application: Because identical twins share genes but often differ in habits and environments, twin pairs are scientists' favourite natural experiment for separating the effects of heredity from those of upbringing — the classic nature-versus-nurture question."
]},
{icon:"🧬", t:"Why do we resemble our parents, yet never look exactly like them?", ch:"b-hered", body:[
"Observation: Children often have a parent's eyes, nose or height, but no child (except an identical twin) is a photocopy of either parent — and siblings differ from one another too.",
"Concept: Each parent passes on only a random half of their genes through their gametes, sexual reproduction mixes two such halves, and small copying variations add further differences.",
"Mechanism: During gamete formation the chromosome pairs are split up so that each sperm or egg receives a random selection of the parent's genes rather than a fixed set, and fertilisation then combines one sperm and one egg out of millions of possible pairings; on top of this, DNA copying during gamete formation is not perfect, so small variations arise that make even the inherited genes slightly different from the parent's own.",
"Evidence: The number of possible gene combinations in a child is so enormous that no two offspring of the same parents (other than identical twins) are genetically alike — this endless shuffling is the direct source of the variation on which natural selection acts.",
"Application: This variation is the engine of evolution and of breeding: if offspring were exact copies of parents, there would be no differences for nature to select from and no way to develop new crop varieties or better cattle breeds."
]},
{icon:"👂", t:"Why do some people have attached earlobes even when neither parent does?", ch:"b-hered", body:[
"Observation: In any classroom, some students have earlobes that hang free below the point of attachment and others have lobes joined directly to the side of the head — and attached lobes can appear in children of two free-lobed parents.",
"Concept: Earlobe type is treated classically as a Mendelian trait in which free lobes behave as dominant and attached lobes as recessive.",
"Mechanism: Every person carries two versions (alleles) of the gene, one inherited from each parent; a child shows attached lobes only when both alleles received are for attachment (ee). Parents with free lobes can still be carriers (Ee), because the dominant free-lobe allele masks the recessive one — so when both parents happen to pass on their recessive allele, the child (ee) shows attached lobes.",
"Evidence: Mendel's pea crosses predicted exactly this outcome: crossing two plants that each showed the dominant trait could produce offspring with the recessive trait, in about a 3:1 ratio of dominant to recessive over many offspring — a pattern that has held for such traits ever since.",
"Application: The same dominant-recessive logic underlies genetic counselling today, from estimating the chance that a child inherits a condition like sickle-cell trait to reading family pedigrees for inherited diseases."
]},
{icon:"🌍", t:"Why does an ozone hole open over Antarctica every spring?", ch:"b-env", body:[
"Observation: Each southern spring (September to November), the ozone layer over Antarctica thins dramatically — even though the ozone-destroying CFCs were released mostly in the northern hemisphere.",
"Concept: Ozone (O₃) is destroyed by reactive chlorine atoms released from CFCs, but the chemistry needs two extra ingredients that only the extreme polar winter supplies — intense cold and then returning sunlight.",
"Mechanism: During the sunless Antarctic winter, temperatures below about −78 °C allow polar stratospheric clouds of ice crystals to form; on the surfaces of these crystals, stable chlorine reservoirs are converted into active forms, and when sunlight returns in spring these release chlorine radicals which catalytically destroy ozone — one chlorine atom can break down many thousands of O₃ molecules before being locked away again — while the circular polar vortex wind traps the depleted air over the pole.",
"Evidence: Satellite and balloon measurements since the mid-1980s record the yearly springtime collapse of ozone over Antarctica; the entire global ozone layer is so dilute that if compressed to sea-level pressure it would form a shell only about 3 mm thick, so even local losses matter enormously.",
"Application: This is why the 1987 Montreal Protocol phased out CFCs worldwide, and why the hole is now slowly healing — often cited as the clearest example of a global environmental threat reversed by coordinated action."
]},
{icon:"🔗", t:"Why do food chains rarely have more than four or five steps?", ch:"b-env", body:[
"Observation: In any ecosystem — forest, grassland or pond — chains like grass → deer → tiger exist, but you never find a chain with ten or twelve links.",
"Concept: Energy flow through a food chain obeys the ten per cent law: only about 10% of the energy at one trophic level is passed on to the next level.",
"Mechanism: At every step, most of the energy an organism takes in is spent on its own life processes — largely respiration, which leaves the body as heat — and some is never eaten or never assimilated, so the energy available to the next level is roughly one-tenth of the previous one. After four or five such reductions, the energy remaining is only a tiny fraction (about one ten-thousandth) of what the plants captured, far too little to support yet another breeding population of predators.",
"Evidence: This is why one tiger needs the produce of a large territory of grass and dozens of deer to survive, why top carnivores are always rare, and why predators are the first to disappear when a habitat shrinks.",
"Application: The same arithmetic explains why producing grain-fed meat needs far more land and water than producing grain for direct human consumption — humans deliberately keep food chains short in agriculture."
]}
