        { "ex": "Two dice: P(at least one 6). Step 1 - the complement is 'no 6': die 1 has 5 non-six values, die 2 has 5, so 5 × 5 = 25 cells give no six, P(no 6) = 25/36. Step 2 - P(at least one 6) = 1 − 25/36 = 11/36. Verification by direct count: cells with a six = row 6 (6 cells) + column 6 (6 cells) − the double-counted corner (6,6) = 11 cells, and 11 + 25 = 36. Note 11/36 ≈ 0.306 is strictly less than the naive 1/6 + 1/6 = 1/3 ≈ 0.333, because (6,6) was counted twice in the naive sum. Second example: three coins tossed, P(at least one head). Complement = all tails, which is 1 of the 8 equally likely outcomes (TTT is unique), so P = 1 − 1/8 = 7/8. Direct check: of HHH, HHT, HTH, ..., TTT only TTT has no head - 7 outcomes with at least one head. ✓" },
        { "f": "P(at least one) = 1 − P(none) ; example: P(at least one 6 with two dice) = 1 − 25/36 = 11/36" },
        { "rw": "Quality engineers compute 'probability of zero defects in a batch' and subtract from 1 to get the defect-risk figure; network designers compute the probability that every component survives and subtract - reliability maths is complement maths." },
        { "mis": "The signature error is 1/6 + 1/6 = 1/3 for at least one six on two dice (or 2 × 1/6). Correction: the two events share the outcome (6,6), so the sum double-counts it; the true value is 11/36. If a direct count is ever in doubt, the complement route avoids the overlap entirely - that is its entire purpose." },
        { "exam": "'At least one' is the favourite 2-mark pattern (two dice: at least one six, at least one doublet; two or three coins: at least one head). The marking scheme expects the complement identified explicitly - write P(no six) = 25/36 first - before 1 − 25/36 = 11/36; a bare correct number with no complement step can forfeit the method mark. Case-study MCQs also test recognising when the complement trick applies." },
        { "qc": { "q": "Two dice are rolled once. P(at least one 6) equals:", "o": ["1/3", "11/36", "1/6", "25/36"], "a": 1 } }
      ]
    }
  ],
  "m-circ": [
    {
      "t": "Why the Tangent Must Be Perpendicular to the Radius",
      "s": [
        { "d": "A tangent to a circle is a line that meets it at exactly one point, called the point of contact; the radius drawn to the point of contact is always perpendicular to the tangent." },
        { "why": "Proof idea (by contradiction, using 'shortest distance'). Let the tangent touch the circle with centre O at P, and let Q be any other point of the tangent line. Since the line meets the circle only at P, the point Q lies outside the circle, so OQ > r = OP. Hence OP is strictly the shortest of all segments drawn from O to points of the line - and the shortest segment from a point to a line is exactly the perpendicular one. Therefore OP ⊥ tangent. Flip it around for intuition: if OP were slanted, the foot M of the true perpendicular from O to the line would satisfy OM < OP = r, putting M inside the circle - but a line passing through an interior point must cut the circle twice, making it a secant, not a tangent. Perpendicularity is not an extra assumption; it is forced by the single-touch property. The converse also holds: a line drawn through the end P of a radius, perpendicular to it, is a tangent, because any other point Q of that line makes triangle OPQ right-angled at P with hypotenuse OQ > OP = r, so Q is outside and the line meets the circle only at P." },
        { "how": [
          "Set up: circle with centre O and radius r; tangent line at point P; pick any other point Q on the tangent and join OQ.",
          "Note Q is outside the circle (a tangent touches at exactly one point), so OQ > r = OP - true for every Q ≠ P on the line.",
          "Conclude OP is the shortest segment from O to the line, and the shortest segment from a point to a line is the perpendicular - so OP ⊥ tangent.",
          "For the converse: given the line through P perpendicular to OP, every other point Q on it gives right triangle OPQ with hypotenuse OQ > r, so the line is a tangent.",
          "Use the right angle: in numerical problems, triangle OPT (T the external point) is right-angled at P, so tangent length = √(OT² − r²)."
        ] },
        { "terms": { "Tangent": "A line that intersects the circle at exactly one point - the point of contact.", "Secant": "A line that cuts the circle at two points; what a tangent becomes if you push it inward.", "Point of contact": "The single common point of the tangent line and the circle.", "Hypotenuse": "In a right triangle, the side opposite the 90° angle - always the longest side, which is why OQ > OP in the proof." } },
        { "ex": "Take the circle x² + y² = 25 (centre O at the origin, radius 5) and the tangent at the point P(3, 4), which lies on the circle since 3² + 4² = 9 + 16 = 25. The tangent line at P is 3x + 4y = 25. Check perpendicularity by slopes: the radius OP has slope 4/3 (rise 4, run 3); the tangent 3x + 4y = 25 has slope −3/4; product (4/3) × (−3/4) = −1, so they are perpendicular. ✓ Check that the line touches once: every point on the tangent other than P must be outside the circle. Take Q(7, 1) on the tangent (3×7 + 4×1 = 21 + 4 = 25 ✓): its distance from O is √(49 + 1) = √50 ≈ 7.07 > 5, so Q is outside - the line really is a tangent, not a secant. Bonus application of the right angle: from an external point T with OT = 13, the tangent length is √(13² − 5²) = √(169 − 25) = √144 = 12, and 5-12-13 is a verified Pythagorean triple (25 + 144 = 169)." },
        { "f": "OP ⊥ tangent at the point of contact ; tangent length from external point T = √(OT² − r²)" },
        { "rw": "A bicycle wheel rolling on flat ground touches the road at one point, and the spoke to that point stands vertical - the road is the tangent and the spoke the radius; engineers design belt-and-pulley drives so the belt leaves each pulley along the tangent, perpendicular to the spoke at the contact point." },
        { "mis": "Students treat the perpendicularity as a diagram coincidence or say 'the tangent is perpendicular to the circle' (a line cannot be perpendicular to a curve). Correction: the perpendicularity is a theorem - it follows from the tangent touching at exactly one point, via the shortest-distance argument - and it is always the radius at the contact point that is perpendicular to the tangent line. A second slip is forgetting the converse is equally true and examinable." },
        { "exam": "The theorem and its converse appear as 2-3 mark 'prove' questions, but more often they hide inside numerical problems: given radius and the distance of an external point, find the tangent length via Pythagoras. The examiner expects the reason line 'radius ⊥ tangent at the point of contact' written next to the right angle - in CBSE marking, the reason carries its own mark even when the arithmetic is perfect. The 5-12-13 and 3-4-5 triangles are the standard numbers used." },
        { "qc": { "q": "A line lies at a distance of exactly 7 cm from the centre of a circle of radius 7 cm. The line is:", "o": ["a secant cutting the circle at two points", "a tangent to the circle", "a chord of the circle", "a diameter of the circle"], "a": 1 } }
      ]
    },
    {
      "t": "Two Tangents from an External Point - Equal Lengths via ΔOQP ≅ ΔORP",
      "s": [
        { "d": "From a point P outside a circle, exactly two tangents can be drawn, touching at Q and R; they are equal in length (PQ = PR), and the joining line OP bisects the angle between them as well as the angle between the two radii." },
        { "why": "Construction: join the centre O to both contact points and to P. In triangles OQP and ORP: ∠OQP = ∠ORP = 90° (radius ⊥ tangent at the contact point - the previous topic's theorem), OQ = OR (both radii of the same circle), and OP = OP (common side, the hypotenuse of both right triangles). Right angle, hypotenuse, one side - so ΔOQP ≅ ΔORP by RHS congruence. By CPCT: PQ = PR, ∠OPQ = ∠RPO (OP bisects the angle at P between the tangents), and ∠QOP = ∠POR (OP bisects the central angle too). Why exactly two tangents: a contact point X must satisfy OX ⊥ PX, so X must see the segment OP at a right angle - and the locus of such points is the circle with OP as diameter (angle in a semicircle is 90°). That auxiliary circle cuts the original circle in exactly two points, Q and R." },
        { "how": [
          "Draw the figure: external point P, contact points Q and R, centre O; join OQ, OR, OP, PQ, PR.",
          "Mark the two right angles at Q and R (radius ⊥ tangent) and the equal radii OQ = OR.",
          "State the congruence: ΔOQP ≅ ΔORP by RHS - right angles at Q and R, common hypotenuse OP, equal sides OQ = OR.",
          "Conclude by CPCT: PQ = PR, and OP bisects ∠QPR and ∠QOR.",
          "For a polygon circumscribing a circle, split each side into the two tangent segments from its vertex and pair them to get: sums of opposite sides are equal."
        ] },
        { "terms": { "RHS congruence": "Two right triangles are congruent if their hypotenuses and one pair of corresponding sides are equal.", "CPCT": "Corresponding Parts of Congruent Triangles - the rule that lets you conclude PQ = PR from the congruence.", "Circumscribing polygon": "A polygon whose every side touches the circle; the circle is inscribed in it.", "Auxiliary circle on OP": "The circle with OP as diameter; every point on it sees OP at 90° - it locates the two contact points." } },
        { "ex": "Part 1 - lengths. Circle of radius 5, external point T with OT = 13. Each tangent is the leg of a right triangle with hypotenuse 13 and other leg 5: tangent = √(13² − 5²) = √144 = 12. So both tangents are 12 - and notice the equality of the two tangents comes from congruence, not from computing both; the computation merely measures them. Part 2 - circumscribing quadrilateral. ABCD circumscribes a circle with AB = 6, BC = 8, CD = 5; find AD. Let the tangent segments from vertices A, B, C, D be x, y, z, w. Then AB = x + y = 6, BC = y + z = 8, CD = z + w = 5, AD = w + x. Adding the 1st and 3rd: x + y + z + w = 6 + 5 = 11. Adding the 2nd and 4th must give the same total: y + z + w + x = 8 + AD. So AD = 11 − 8 = 3. Verify with a consistent split: choose y = 4, then x = 2 (x + y = 6), z = 4 (y + z = 8), w = 1 (z + w = 5), and indeed w + x = 3 = AD. ✓ (Any other y gives the same AD - the answer is invariant.)" },
        { "f": "Tangent lengths: PQ = PR = √(OP² − r²) ; circumscribing quadrilateral: AB + CD = BC + AD" },
        { "rw": "A ribbon pulled tight around a circular pillar from one point forms two equal tangent segments; tent ropes anchored at one peg and pulled taut against a circular dome touch it at two equal distances - surveyors use exactly this equal-tangent geometry." },
        { "mis": "The classic reasoning failure is 'proving' PQ = PR by SSS using PQ and PR as corresponding sides - that assumes what is to be proved. Correction: the equality must flow from RHS congruence, where the known equal parts are the radii and the common hypotenuse; only after the congruence does CPCT deliver PQ = PR. A second misconception: treating the length formula √(OP² − r²) as a separate memorised fact rather than Pythagoras applied to the right angle from the tangent-radius theorem." },
        { "exam": "Three recurring 3-mark patterns: (i) prove tangents from an external point are equal (expect the full chain: right angles from radius ⊥ tangent, then RHS, then CPCT); (ii) a quadrilateral circumscribing a circle with one side missing - always solve via AB + CD = BC + AD and verify by splitting into tangent segments; (iii) bisector results like ∠OPQ = ∠OPR. Numerical variants dress the same logic in kites with 3-4-5 or 5-12-13 triangles." },
        { "qc": { "q": "In the proof that tangents from an external point are equal, ΔOQP ≅ ΔORP by which criterion?", "o": ["SSS", "SAS", "RHS", "ASA"], "a": 2 } }
      ]
    }
  ],
  "m-surf": [
    {
      "t": "Melting and Recasting - Volume Is the Thing That Survives",
      "s": [
        { "d": "When a solid is melted or recast into a different shape, the quantity of material - and therefore the volume - stays exactly the same; equating the original volume to the new volume solves for the unknown dimension, while the surface area changes freely." },
        { "why": "Melting rearranges the boundary but destroys no material. Volume measures 'how much stuff' and is indifferent to shape; surface area measures the boundary, which is precisely what gets rearranged. So a sphere of volume (4/3)πr³ becomes a wire (a thin cylinder) of length L with πr_wire² × L = the same volume - and because the wire's cross-section is tiny, the same material stretches into an enormous length. The flip side is instructive: spreading the same volume thin creates far more boundary, which is why the wire's surface area can be twenty times the sphere's even though the volume is identical. Recognising which quantity the question conserves is the entire game." },
        { "how": [
          "Write the volume formula of the ORIGINAL solid and compute it exactly, keeping π symbolic (it will cancel).",
          "Write the volume formula of the NEW solid with the unknown dimension (usually length, height or radius).",
          "Set original volume = new volume and solve for the unknown.",
          "Fix units before substituting: convert diameters to radii (halve them) and cm to m where needed (1 m = 100 cm, so 1 m³ = 10⁶ cm³).",
          "Sanity-check: compare the two volumes numerically (they must match), and only discuss surface area if asked - it will differ, and that is expected."
        ] },
        { "terms": { "Volume conservation": "Recasting or melting changes shape but not the amount of material, so V_old = V_new.", "Recasting": "Reshaping a solid into another form - sphere into wire, cone into cylinder, one sphere into many small spheres.", "Wire modelled as a cylinder": "A long thin cylinder: length L, radius r (from the given diameter), volume πr²L.", "Invariance": "A quantity unchanged by a transformation - volume under recasting; contrast with surface area, which is not invariant." } },
        { "ex": "A metallic sphere of radius 6 cm is melted and drawn into a wire of diameter 0.4 cm. Find the length of the wire. Step 1 - sphere volume: (4/3)π(6)³ = (4/3)π × 216 = 288π cm³. Step 2 - wire radius: 0.4/2 = 0.2 cm; cross-section area = π(0.2)² = 0.04π cm². Step 3 - equate: 0.04π × L = 288π ⇒ L = 288/0.04 = 7200 cm = 72 m (π cancels cleanly). Verification: wire volume = 0.04π × 7200 = 288π cm³ - identical. ✓ Surface-area contrast (why SA is NOT conserved): sphere SA = 4π(6)² = 144π ≈ 452 cm²; wire SA = 2π(0.2)(7200) = 2880π ≈ 9048 cm² - exactly 20 times more boundary from the same metal (2880π/144π = 20)." },
        { "f": "Sphere V = (4/3)πr³ ; Cylinder V = πr²h ; Cone V = (1/3)πr²h ; Hemisphere V = (2/3)πr³ ; recasting rule: V_old = V_new" },
        { "rw": "Steel billets are rolled into kilometres of wire and rods; goldsmiths melt old bangles into a new design - the receipt guarantees the weight (volume) carried over, never the shape; candle-makers remould stubs into fresh candles." },
        { "mis": "Two traps cause most lost marks: (a) conserving surface area instead of volume (setting the sphere's 4πr² equal to the wire's 2πrh); (b) using the diameter as the radius - in the wire problem 0.4 must become 0.2 before writing πr²L. Correction habit: write both volume formulas first, substitute second, and circle every place a diameter appears." },
        { "exam": "Standard 3-mark question: 'a sphere/cone/hemisphere is melted into a wire/cylinder/sphere - find the length/radius/height', with water-pouring variants (cone full of water emptied into a cylinder). Marks are layered: correct formula and volume of the original (1), the correct conservation equation (1), the answer with unit conversion like cm → m (1). The reverse form gives the final object and asks for the original radius - the same equation solved backwards." },
        { "qc": { "q": "A solid sphere is melted and recast into a long cylindrical wire. Which quantity necessarily stays the same?", "o": ["Surface area", "Volume", "Both surface area and volume", "Neither"], "a": 1 } }
      ]
    },
    {
      "t": "TSA of Combination Solids - Subtract What You Cannot See",
      "s": [
        { "d": "The total surface area of a combined solid (capsule, cone on a cylinder, joined cubes) is the sum of the exposed curved and flat parts only; every face where two components are glued together is internal and must be subtracted from both pieces." },
        { "why": "Surface area counts the boundary exposed to air - it is what paint would cover. When a hemisphere sits on a cylinder, the cylinder's top circle and the hemisphere's flat circular base are in perfect contact: neither sees air, so both contribute zero; only the cylinder's curved surface and the hemisphere's curved surface count. The clearest proof of the principle is two cubes of edge a joined face to face: separately they have 2 × 6a² = 12a², but the two glued faces (2 × a²) vanish, leaving 10a² - and indeed the joined shape is a cuboid 2a × a × a whose TSA is 2(2a·a + a·a + 2a·a) = 2(2a² + a² + 2a²) = 10a². Two routes, one answer: the hidden-face logic is exactly the same as recomputing the new solid from scratch." },
        { "how": [
          "Name the component solids and locate every junction: which curved or flat surface is glued to which.",
          "For each component write only what remains exposed: CSA of curved parts, plus flat faces that are genuinely open to air.",
          "Strike off the hidden interfaces - junction faces cancel in pairs (the cylinder's top circle and the hemisphere's flat disc both disappear).",
          "Compute with π = 22/7 or 3.14 as the question directs; keep the units squared.",
          "Cross-check by an alternative decomposition wherever possible (joined cubes as a single cuboid; a capsule as cylinder + two hemispheres)."
        ] },
        { "terms": { "CSA / LSA": "Curved (lateral) surface area - the boundary without flat faces: cylinder 2πrh, cone πrl, sphere 4πr², hemisphere 2πr².", "Hidden / internal face": "The contact area between two joined solids - part of nobody's exposed surface.", "Junction": "The shared surface where two components meet; subtract it from both sides.", "Capsule": "A cylinder with a hemisphere on each end: TSA = 2πrh + 4πr², since all four flat circles are hidden in pairs." } },
        { "ex": "A capsule-shaped medicine is a cylinder of radius 7 cm and height 10 cm with a hemisphere of radius 7 cm on each end. Hidden faces: the cylinder's two end circles are glued to the two hemispheres' flat discs - all four vanish in pairs. Exposed surface = CSA of cylinder + 2 × CSA of hemisphere = 2πrh + 2 × 2πr² = 2 × (22/7) × 7 × 10 + 4 × (22/7) × 49 = 440 + 616 = 1056 cm². Second verification with joined cubes: two cubes of edge 5 cm joined face to face: separate TSA = 2 × 6 × 25 = 300 cm²; hidden faces = 2 × 25 = 50; answer 250 cm². Recompute as the cuboid 10 × 5 × 5: TSA = 2(10×5 + 5×5 + 10×5) = 2(50 + 25 + 50) = 2 × 125 = 250 cm². ✓ Both methods agree exactly." },
        { "f": "Capsule TSA = 2πrh + 4πr² ; hemisphere-on-cylinder (open vessel) CSA = 2πrh + 2πr² ; cone-on-cylinder TSA = πrl + 2πrh + πr² ; two joined cubes: 10a²" },
        { "rw": "Pharma capsules, dome-topped water tanks (sheet metal ordered = CSA of the dome + tank wall), and ice-cream cones (cone + hemisphere scoop) are priced and painted on exposed surface - never on the buried circles." },
        { "mis": "The classic error is writing the cylinder's full TSA 2πr(h + r) out of habit - that top circle is buried under the hemisphere. Correction: at every junction, remove the glued face from BOTH components (the cylinder's top circle and the hemisphere's flat disc are two different faces that both disappear). The mirror-image error is subtracting a bottom that is actually exposed - decide whether the solid sits on the ground (bottom hidden) or is a vessel/toy whose base is visible." },
        { "exam": "A 3-mark standard: find the CSA or TSA of a combination - cone on a cylinder, hemisphere on a cylinder, or a capsule. The examiner's mark is essentially for junction handling: including a buried circle costs the answer mark even with perfect formulas. The 2-mark/MCQ variant is two joined cubes (answer 10a²). Show the formula, substitute with 22/7 when the radius is a multiple of 7, and state units² at the end." },
        { "qc": { "q": "A hemisphere sits exactly on top of a cylinder of the same radius. Which part of the cylinder's surface is NOT exposed?", "o": ["The curved surface", "The bottom circle", "The top circle", "Nothing is hidden"], "a": 2 } }
      ]
    }
  ],
  "m-arca": [
    {
      "t": "Where (θ/360) × πr² Comes From - Sectors as Fractions of a Circle",
      "s": [
        { "d": "A sector is a pizza-slice of a circle bounded by two radii and an arc; its area is the fraction θ/360 of the whole circle: Area = (θ/360) × πr², and its arc length is the same fraction of the circumference: l = (θ/360) × 2πr." },
        { "why": "A full rotation of 360° sweeps the entire circle, area πr², circumference 2πr. The circle is perfectly symmetric, so rotation is perfectly uniform: every one of the 360 degrees of sweep contributes exactly an equal share of area and of arc - no degree is special. One degree therefore earns (1/360) of πr², and θ degrees earn (θ/360) × πr². The same fraction appears in three places, which is the strongest form of the idea: arc : circumference = sector area : circle area = θ : 360. Check it on the clean cases: 90° is a quarter turn, so a 90° sector is exactly 1/4 of the circle; 180° is a semicircle, exactly 1/2; 120° is 1/3. The formula is not a memorised spell - it is proportional reasoning applied to rotation." },
        { "how": [
          "Read off r and θ (the central angle, in degrees).",
          "Reduce the fraction θ/360 to lowest terms before touching π: 90° → 1/4, 120° → 1/3, 60° → 1/6, 45° → 1/8.",
          "Sector area = fraction × πr²; arc length = fraction × 2πr; use 22/7 or 3.14 as directed.",
          "Cross-check with the equivalent formula sector area = (1/2) × l × r - the two routes must agree.",
          "For the major sector, either use central angle (360 − θ) or take circle area minus the minor sector."
        ] },
        { "terms": { "Sector": "The region between two radii and their included arc.", "Arc": "The portion of the circumference cut off between the two radii.", "Central angle θ": "The angle the two radii make at the centre; it fixes the fraction of the circle you own.", "Major / minor sector": "The larger and smaller of the two sectors a pair of radii creates; their angles sum to 360°." } },
        { "ex": "A sector of radius 21 cm has central angle 120° (take π = 22/7). Fraction: 120/360 = 1/3. Whole circle: (22/7) × 21² = (22/7) × 441 = 22 × 63 = 1386 cm². Sector area = 1386 × (1/3) = 462 cm². Arc length = (1/3) × 2 × (22/7) × 21 = (1/3) × 132 = 44 cm. Verification: the alternative formula gives sector area = (1/2) × l × r = (1/2) × 44 × 21 = 462 cm² - identical. ✓ All three routes (fraction of circle, arc-based, half × l × r) agree, which is the signature of a correct calculation." },
        { "f": "Sector area = (θ/360) × πr² = (1/2) l r ; arc length l = (θ/360) × 2πr ; perimeter of sector = l + 2r" },
        { "rw": "A pizzeria prices a 45° slice as exactly 1/8 of the whole pie; a windshield wiper sweeps roughly a 120° sector of the glass; the area a clock hand covers between 2 and 3 o'clock is a 30° sector - all priced, engineered and drawn on this fraction." },
        { "mis": "Treating θ/360 as a magic constant to plug into, and the twin error of using an inscribed angle as if it were the central angle (only the centre angle sets the fraction). Also common: forgetting that for the major sector you must use 360 − θ. Correction: always say the sentence 'my angle is this fraction of a full turn' before substituting, and mark θ at the centre in your figure." },
        { "exam": "Direct 1-3 mark questions on sector area or arc length, plus the favourite trap: perimeter of a sector = l + 2r (the two radii are part of the boundary - forgetting them is the single most common MCQ error). Examiners expect the fraction reduction shown and π handled per instruction (22/7 when r is a multiple of 7). Composite figures (shaded region between two sectors) appear for 5-mark questions." },
        { "qc": { "q": "A sector has central angle 60°. Its area is what fraction of the whole circle?", "o": ["1/2", "1/4", "1/6", "1/3"], "a": 2 } }
      ]
    },
    {
      "t": "Segment Area = Sector Minus Triangle (and the 90° Shortcut)",
      "s": [
        { "d": "A segment is the region between a chord and its arc; its area equals the sector OAB (bounded by the two radii OA, OB and the arc) minus the triangle OAB (bounded by the chord AB): Segment = sector − triangle." },
        { "why": "Draw chord AB and join it to the centre O. The sector OAB is exactly partitioned, with no overlap and no gap, into two regions: triangle OAB (centre + chord) and the segment (chord + arc). So segment = sector − triangle. The sector is known from the fraction formula; the triangle needs the two special cases the board loves: for θ = 90°, triangle OAB is right-angled and isosceles with legs r, giving area (1/2)r²; for θ = 60°, OA = OB = AB = r (equilateral), giving (√3/4)r². These yield the memorable special results: the 90° segment has area (1/4)πr² − (1/2)r² = r²(π − 2)/4, and the 60° segment has area r²(π/6 − √3/4). For the major segment, take the whole circle minus the minor segment - do not reassemble it from the major sector, which requires adding the triangle back." },
        { "how": [
          "Identify θ, the angle the chord AB subtends at the centre; sketch sector OAB and triangle OAB.",
          "Sector area = (θ/360) × πr².",
          "Triangle OAB: θ = 90° → (1/2)r·r = r²/2 ; θ = 60° → equilateral, (√3/4)r² ; other angles → drop the perpendicular from O to AB and use (1/2) × base × height with trigonometry.",
          "Segment = sector − triangle; keep π and √ symbolic until the final substitution.",
          "For the major segment: major segment = circle area − minor segment.",
          "Verify: the segment must be smaller than the sector, and for θ = 90° the shortcut r²(π−2)/4 must reproduce the two-step answer."
        ] },
        { "terms": { "Chord": "A line segment joining two points on the circle.", "Segment": "The region bounded by a chord and its arc.", "Minor / major segment": "The smaller and larger pieces; the minor segment corresponds to the minor arc (central angle less than 180°).", "Partition": "Splitting a region into non-overlapping pieces that cover it exactly - here, triangle + segment = sector." } },
        { "ex": "A chord subtends 90° at the centre of a circle of radius 10 cm (π = 3.14). Sector OAB = (90/360) × 3.14 × 100 = 78.5 cm². Triangle OAB is right-angled at O with legs OA = OB = 10, so its area = (1/2) × 10 × 10 = 50 cm². Minor segment = 78.5 − 50 = 28.5 cm². Verification via the derived shortcut: r²(π − 2)/4 = 100 × (3.14 − 2)/4 = 100 × 1.14/4 = 28.5 cm² - identical. ✓ Second case for the 60° result: r = 6 cm, θ = 60°. Sector = (1/6) × 3.14 × 36 = 18.84 cm²; triangle = (√3/4) × 36 = 9√3 ≈ 9 × 1.732 = 15.59 cm²; segment = 18.84 − 15.59 = 3.25 cm² (the shortcut r²(π/6 − √3/4) = 36 × (0.523 − 0.433) = 36 × 0.090 = 3.24 ≈ 3.25 confirms it, allowing rounding)." },
        { "f": "Segment = sector − ΔOAB ; θ = 90°: segment = r²(π − 2)/4 ; θ = 60°: segment = r²(π/6 − √3/4)" },
        { "rw": "The glass in an arched window above a door is exactly a segment - the sill is the chord, the arch the arc; so is the cross-section of liquid in a horizontal cylindrical tank above the chord line, which engineers compute as sector minus triangle." },
        { "mis": "The most common error is subtracting the triangle from the whole circle instead of from the sector (the triangle sits inside the sector, not the circle), and mixing up major and minor segments. Correction: shade the wanted region on a labelled figure before computing anything - if your shaded region is the sliver between chord and arc, it is sector minus triangle; if it is nearly the whole circle, compute the minor piece first and subtract from πr²." },
        { "exam": "Standard 3-mark: find the minor segment given r and θ ∈ {90°, 60°, 120°}. Expected steps: sector by the fraction formula, triangle area with the special-case justification stated (isosceles right / equilateral), subtraction, decimal with π = 3.14. The same machinery hides inside 5-mark composite designs (flower beds, washers, shaded regions between circles), where recognising 'this sliver is a segment' is the main skill tested." },
        { "qc": { "q": "For a chord subtending 90° at the centre with radius r, the area of ΔOAB is:", "o": ["(√3/4)r²", "r²/2", "πr²/4", "r²"], "a": 1 } }
      ]
    }
  ],
  "m-atrig": [
    {
      "t": "Angle of Elevation vs Depression - and Why They Are Equal",
      "s": [
        { "d": "The angle of elevation is measured upward from the observer's horizontal line to the line of sight on a higher object; the angle of depression is measured downward from the horizontal to a lower object - and when A looks down at B, the depression angle equals the elevation angle with which B looks up at A." },
        { "why": "The equality is plain geometry: the horizontal line through the observer's eye and the horizontal ground/sea line are parallel (both are level), and the line of sight is a transversal cutting them. The depression angle (at A, between A's horizontal and AB) and the elevation angle (at B, between the ground and BA) are alternate interior angles between parallels - hence equal. This transfer is the workhorse of every problem: a depression given at the top becomes an elevation inside the triangle at the bottom, where the tangent ratio lives. Two details students miss: both angles are measured from the horizontal (never from the vertical), and the triangle's height is the vertical distance from the object's base to the observer's EYE - hence the standing-on-ground problems add the eye height (about 1.5 m) to the computed height." },
        { "how": [
          "Draw the figure: object, observer, a dashed horizontal through the eye, and the line of sight; mark the given angle at the eye, measured from the horizontal.",
          "Transfer depression to elevation using alternate angles (state the reason - it carries marks), so the right triangle has its angle at the base.",
          "Identify the sides: opposite = height difference, adjacent = horizontal distance, hypotenuse = rope, ladder or slant distance.",
          "Pick the ratio - tan for height/distance problems (most common), sin or cos when the hypotenuse is given or wanted.",
          "Substitute the standard values tan 30° = 1/√3 ≈ 0.577, tan 45° = 1, tan 60° = √3 ≈ 1.732; solve; verify by substituting the answer back into the ratio and checking the direction of change (bigger angle ⇒ bigger height at the same distance)."
        ] },
        { "terms": { "Line of sight": "The straight segment from the observer's eye to the point viewed.", "Horizontal line": "The level line through the observer's eye - the baseline from which both angles are measured.", "Angle of elevation": "The angle above the horizontal between it and the line of sight.", "Angle of depression": "The angle below the horizontal between it and the line of sight; lives at the observer, not at the object.", "Alternate interior angles": "Equal angles on opposite sides of a transversal cutting two parallel lines - the reason elevation = depression." } },
        { "ex": "From the top of a lighthouse 75 m above sea level, the angle of depression of a ship is 45°. Find the ship's distance from the foot of the lighthouse. Step 1 - transfer: the horizontal at the top is parallel to the sea line, so the angle of elevation of the top from the ship = 45° (alternate angles). Step 2 - triangle: height 75 m (opposite), distance d (adjacent), angle 45° at the ship. Step 3 - tan 45° = 75/d ⇒ 1 = 75/d ⇒ d = 75 m. Verification: when the angle is 45°, opposite = adjacent (tan 45° = 1), so the triangle is isosceles-right and distance must equal height - 75 = 75. ✓ Direction check: if the depression had been 30° instead, d = 75/tan 30° = 75√3 ≈ 129.9 m - a smaller angle means the ship is farther, exactly as intuition demands." },
        { "f": "tan θ = opposite/adjacent = (height)/(horizontal distance) ; depression from A to B = elevation from B to A (alternate angles between parallels)" },
        { "rw": "Pilots fly standard glide slopes defined by depression angles toward the runway; sailors have long fixed their distance from shore by measuring the depression angle of a cliff-top landmark of known height - the same two-parallel-lines picture." },
        { "mis": "Two signature slips: marking the depression angle at the object (the ship) instead of at the observer's eye, and measuring it from the vertical instead of the horizontal. Correction: the angle of depression is always AT the observer, BETWEEN his horizontal and his line of sight. A second slip: using the tower's full height when the observer's eye is 1.5 m above ground - add the eye height only for a standing observer, not when the observer is already at a specified point like a tower top." },
        { "exam": "Heights and distances carries about 4-8 marks, as a 2-3 mark standard question or as a case study (tower/cliff/lighthouse with a ship or car, sometimes two observers). The reason line 'alternate interior angles, the horizontal at the eye being parallel to the ground' must be written when converting a depression - it carries a mark of its own. In case-study sets, watch for the 1.5 m eye height and answers rounded as directed (e.g. √3 = 1.732)." },
        { "qc": { "q": "A boy on a cliff looks down at a boat at an angle of depression of 30°. What is the angle of elevation of the boy (at the cliff top) from the boat?", "o": ["30°", "60°", "150°", "Cannot be determined"], "a": 0 } }
      ]
    },
    {
      "t": "The Standard 30°/45°/60° Setups and the Two-Triangle Pattern",
      "s": [
        { "d": "Board problems in this chapter are built almost exclusively on 30°, 45° and 60°; the two-triangle pattern uses one shared quantity (the object's height) appearing in two right triangles observed from two points, so two expressions for the same height are equated and solved." },
        { "why": "Why only these angles: their tangents - 1/√3, 1, √3 - keep the algebra exact and calculator-free, which is why examiners choose them. The two-triangle pattern: an observer at the nearer point B sees a larger elevation angle than the one at A (closer to the object, same height ⇒ steeper sight-line). The height h is the SAME physical quantity in both triangles: h = x·tan(60°) from the near point (x = distance from B to the foot) and h = (x + d)·tan(30°) from the far point (d = the walked distance AB). Two equations, two unknowns (h and x) - equating them eliminates h and solves x, then back-substitution gives h. The shared height is the hinge: recognise which side is common and the problem reduces to linear algebra. The same skeleton covers the two-objects-on-opposite-sides variant, where the shared quantity is the tower's height between two triangles on opposite sides." },
        { "how": [
          "Draw ONE figure containing both observation points A (far) and B (near) and the foot C of the object; let the unknown BC = x.",
          "Write h from the near triangle (larger angle): h = x·tan 60° = x√3.",
          "Write h from the far triangle (smaller angle): h = (x + d)·tan 30° = (x + d)/√3, where d is the distance moved.",
          "Equate the two expressions for the SAME height and solve for x, then back-substitute to get h.",
          "Verify both ways: recompute tan of each angle from your h and distances (they must reproduce 1/√3 and √3), and check the angle ordering (nearer point shows the larger angle)."
        ] },
        { "terms": { "tan": "Ratio of the side opposite the angle to the side adjacent in a right triangle.", "Elevation ordering": "30° < 45° < 60° with tangents 0.577 < 1 < 1.732 - walking toward the object raises the angle.", "Two-triangle pattern": "Two right triangles sharing one side (the height, or the distance between observers); each triangle contributes one equation.", "Shared quantity": "The same physical length appearing in both triangles - the hinge you equate." } },
        { "ex": "From a point A on the ground, the angle of elevation of the top of a tower is 30°. On moving 20 m straight toward the tower to B, the elevation becomes 60°. Find the height. Let BC = x (B nearer the foot C). Near triangle (at B): tan 60° = h/x ⇒ h = x√3. Far triangle (at A): tan 30° = h/(x + 20) ⇒ h = (x + 20)/√3. Equate: x√3 = (x + 20)/√3 ⇒ multiply both sides by √3: 3x = x + 20 ⇒ 2x = 20 ⇒ x = 10 m. Back-substitute: h = 10√3 ≈ 17.32 m. Verification: from A the distance is 30 m and tan = h/30 = 17.32/30 ≈ 0.577 = 1/√3 = tan 30°. ✓ From B: h/10 = 17.32/10 ≈ 1.732 = √3 = tan 60°. ✓ Both triangles confirm the same height, and the nearer point shows the larger angle, as geometry demands." },
        { "f": "tan 30° = 1/√3 ≈ 0.577 ; tan 45° = 1 ; tan 60° = √3 ≈ 1.732 ; sin 30° = cos 60° = 1/2 ; sin 60° = cos 30° = √3/2 ; sin 45° = cos 45° = 1/√2 ≈ 0.707" },
        { "rw": "You can estimate a tree's height with nothing but your stride and this pattern: note where its top sits at 45° (height equals your distance), then at 30° (height = distance/√3) - surveyors measured Himalayan peaks from the plains on exactly this triangulation logic." },
        { "mis": "The killer slip is placing the walked distance in the wrong triangle - using x where x + 20 belongs (the far observer sees the WHOLE distance from his own feet to the object; only the near one sees x). Correction: label every length on the figure before writing any ratio; the gap AB = 20 m is added to x, never used alone. The second error is solving for x and forgetting to back-substitute for h - the question asks for the height, and x is only a stepping stone." },
        { "exam": "This is the guaranteed long application question (3-5 marks, frequently the paper's final question or a case study): the moving observer (30° to 60°), two objects flanking a tower, or a tower on a road with two cars. Presentation earns marks: labelled figure (1), both tan statements (2), the equating and solution (1), final answer in exact √3 form plus the decimal with units (1). Keep the √3 form until the last line - examiners award the exact-value mark separately from the decimal." },
        { "qc": { "q": "In the moving-observer problem, the elevation rises from 30° to 60° after walking d metres toward the tower. The final distance from the tower's foot is:", "o": ["d", "d/2", "2d", "d√3"], "a": 1 } }
      ]
    }
  ],
  "s-eco": [
    {
      "t": "Why GDP Shares and Employment Shares Don't Match",
      "s": [
        { "d": "In India, the primary sector employs nearly half of all workers but produces well under a fifth of GDP, while the tertiary sector produces over half of GDP with under a third of workers; the gap is the signature of low productivity in agriculture and of disguised unemployment." },
        { "why": "GDP counts value produced; employment counts people. When a sector holds many workers but a small output share, output per worker (productivity) is low. Agriculture: tiny family landholdings worked by everyone in the household - six people on a plot that three could farm. Removing three would not lower output at all: that is disguised unemployment (a form of underemployment), and it is invisible in employment statistics because everyone records as 'working'. Services (IT, banking, telecom): few workers, high value added each. Historically, as economies develop, GDP share shifts primary → secondary → tertiary, because food demand saturates while demand for manufactures and then services keeps growing; but workers cannot move instantly - farming families lack the skills, education and capital that industry and modern services demand, and manufacturing in India has not expanded enough to absorb them. So employment share lags GDP share, and the mismatch persists." },
        { "how": [
          "Compare each sector's share of GDP with its share of employment, and compute relative productivity: if X% of workers produce Y% of GDP, output per worker is (Y/X) times the national average.",
          "For the low-productivity sector ask the removal test: would output fall if some workers left? If no, they are disguised-unemployed.",
          "Trace why the surplus workers stay: land ownership patterns, seasonal farm work, no skills or education for industry and modern services.",
          "Ask what would close the gap: irrigation and agricultural productivity, manufacturing jobs, education and health infrastructure (which themselves count as tertiary).",
          "Test the reverse case for understanding: a sector with a high GDP share and a low employment share (software) is capital-and-knowledge-intensive, not a social failure - direction of mismatch matters."
        ] },
        { "terms": { "GDP": "The market value of all final goods and services produced in a country in a year - it measures output, not livelihoods.", "Disguised unemployment": "More workers than the work needs, so some workers' marginal contribution is effectively zero; remove them and output is unchanged.", "Underemployment": "Working below one's skills or capacity - a trained weaver pulling a rickshaw, or a farm worker idle for eight months a year.", "Productivity": "Output per worker; the ratio behind every GDP-vs-employment mismatch.", "Tertiary sector": "Services - trade, transport, communication, finance, IT, education, health; India's largest GDP contributor." } },
        { "ex": "A village illustration of the arithmetic. Ten farmers jointly produce rice worth ₹10 lakh a year; two software professionals in the same district produce ₹60 lakh. Total: 12 workers, ₹70 lakh of output. Farmers: 10/12 ≈ 83% of the workers, but 10/70 ≈ 14% of the output; the two professionals: 17% of workers, 86% of output. Output per farmer = 10,00,000/10 = ₹1 lakh; per professional = 60,00,000/2 = ₹30 lakh - a 30:1 productivity gap. Now the disguised-unemployment test: the family plot genuinely needs only 6 pairs of hands in the peak season, so 4 of the 10 add nothing. Remove them: rice is still ₹10 lakh, proving those 4 were 'employed' on paper but surplus in reality. This is exactly the national picture in miniature: agriculture's employment share is about double its output share (roughly 46% of workers against under 20% of GDP), while services flip the ratio." },
        { "rw": "MGNREGA guarantees 100 days of paid work to rural households precisely because the farm sector cannot absorb its own workforce year-round; cityward migration is this mismatch in motion - a disguised-unemployed farm worker becoming a productive construction worker." },
        { "mis": "The damaging conclusion 'agriculture is unimportant since its GDP share is small.' Correction: GDP share measures output, not contribution to livelihoods - agriculture employs the most people, and its LOW share signals a problem to fix (too many people on too little land and technology), not irrelevance. The second misconception is 'tertiary = IT jobs'; most tertiary employment is informal small trade, transport and eating joints, while the GDP share is carried disproportionately by finance, IT and real estate." },
        { "exam": "Recurring 3-5 mark questions: define disguised unemployment with an example; 'why does the tertiary sector dominate GDP but not employment?'; tabular comparisons of the three sectors on GDP and employment. Examiners reward the reasoning chain (productivity → disguised unemployment → why workers cannot shift → what would change it), a concrete numeric illustration, and the correct direction of the mismatch. Vague statements like 'agriculture is backward' score zero - say instead what output per worker means and why it is low." },
        { "qc": { "q": "Five members of a family work on their small farm, but the work of three would be enough. The extra two are an example of:", "o": ["Seasonal unemployment", "Disguised unemployment", "Structural unemployment", "Full employment"], "a": 1 } }
      ]
    },
    {
      "t": "Formal vs Informal Credit - and Why SHGs Matter",
      "s": [
        { "d": "Credit comes from formal sources (banks and cooperatives - supervised by the RBI, cheaper, but demanding collateral and documentation) and informal sources (moneylenders, traders, employers, relatives - unregulated, instant, but expensive); Self-Help Groups bring poor borrowers into the formal system by replacing individual collateral with group savings and group guarantee." },
        { "why": "Why the poor stay informal: a bank lending ₹20,000 wants three things - collateral (an asset it can seize on default), documentation (identity and income proof), and a repayment capacity that generates confidence. A landless labourer has none of these, and banks also find it costly to service lakhs of tiny loans. The moneylender asks for none of it - he knows the borrower personally and lends instantly - but his rates (commonly 3-5% PER MONTH) build a debt trap where the family's entire surplus goes to interest, forcing fresh borrowing just to survive. Why SHGs break the deadlock: 15-20 members (usually women) save a small fixed amount monthly, building a common pool they first lend among themselves; after six months to a year of regular savings and on-time internal repayment, a bank lends to the GROUP - the group's savings and mutual guarantee stand in for collateral (social collateral), because a member who defaults loses standing with her neighbours, the one enforcement mechanism that always works in a village. Members get timely, cheap credit for self-employment, and the group itself becomes a school of financial discipline and collective voice." },
        { "how": [
          "For any loan in the question, identify the terms of credit: interest rate, collateral demanded, documentation, repayment mode.",
          "Classify the lender: bank or cooperative = formal (RBI-supervised, capped, cheaper); moneylender, trader, landlord or relative = informal (rate unregulated).",
          "Do the debt-trap arithmetic: convert monthly informal rates to yearly (5% per month = 60% per year) and compare the interest burden with the borrower's monthly surplus.",
          "For SHG questions, narrate the chain in order: small monthly savings → internal lending → bank loan to the group against its savings and guarantee → on-lending to members → timely repayment building the group's credit record.",
          "Conclude with the evaluation: the fix is inclusion (SHGs, Kisan Credit Cards, basic bank accounts), because banning moneylenders without providing access just pushes borrowers to worse terms."
        ] },
        { "terms": { "Terms of credit": "The full package a lender demands: interest rate, collateral, documentation and repayment schedule.", "Collateral": "An asset pledged against a loan - land title, gold, tools - forfeited if the borrower defaults.", "Debt trap": "A cycle in which interest obligations exceed the borrower's surplus, forcing new loans to service old ones.", "SHG": "Self-Help Group: typically 15-20 members (mostly women) who pool savings and access bank credit jointly, with the group standing as guarantor.", "Social collateral": "The group's mutual knowledge and peer pressure that substitutes for physical collateral in micro-credit." } },
        { "ex": "Debt-trap arithmetic. A farmer borrows ₹20,000 from a moneylender at 5% per month (simple interest). Monthly interest = 20,000 × 0.05 = ₹1,000; yearly = 12 × 1,000 = ₹12,000 - that is 60% of the principal in a year. The same ₹20,000 from a bank at 12% per year costs 20,000 × 0.12 = ₹2,400 a year = ₹200 a month. If the family's monthly surplus after living costs is ₹1,500: the moneylender's interest eats 1,000/1,500 = two-thirds of it, leaving almost nothing to repay the principal - the classic trap; the bank's ₹200 leaves ₹1,300 with which the loan can be closed in roughly 15-16 months (20,000/1,300 ≈ 15.4). SHG arithmetic: 12 members × ₹100 per month × 6 months = ₹7,200 pool; a bank may then lend the group a multiple of its savings - say four times, ₹28,800 - against the group's savings plus guarantee, and no member has mortgaged her utensils or land." },
        { "rw": "Muhammad Yunus's Grameen Bank in Bangladesh pioneered lending to groups of poor women and won the Nobel Peace Prize for it; India's SHG-bank linkage programme now reaches crores of rural women - micro-finance is built on the discovery that the poor repay, and that peer guarantee outperforms pawned gold." },
        { "mis": "'Moneylenders are evil, so ban them and the problem ends.' Correction: they survive because formal credit EXCLUDES the poor - no collateral, no paperwork, high servicing cost of tiny loans. A ban without access pushes borrowers to hidden, worse terms; the durable fix is inclusion through SHGs and simple bank products. The mirror error is 'banks are always cheaper so everyone should just use banks' - true per rupee, but access, not price, is the binding constraint for a landless borrower." },
        { "exam": "Guaranteed 4-5 mark zone: 'explain with an example how SHGs help borrowers who have no collateral'; 'compare formal and informal sources of credit' (a table on lenders, rates, collateral, supervision scores full marks); 'define terms of credit with an example'. Examiners look for: the RBI's supervisory role named for formal credit, a numeric sense of informal rates (3-5% per month), the savings → internal lending → group bank-loan mechanism in the correct order, and a closing line linking cheap timely credit to productive investment and poverty reduction." },
        { "qc": { "q": "The biggest reason poor households depend on moneylenders is that:", "o": ["moneylenders charge lower interest", "banks demand collateral and documents the poor lack", "moneylenders are regulated by the RBI", "banks refuse to lend in villages at any interest rate"], "a": 1 } }
      ]
    },
    {
      "t": "What Globalisation Actually Changes for a Small Producer",
      "s": [
        { "d": "Globalisation is the integration of markets across countries through freer movement of goods, services, investments and technology; for a small producer it cuts both ways - a bigger market to sell in, and bigger competitors to survive against." },
        { "why": "When trade barriers (tariffs, quotas) fall, production flows to where it is cheapest and best, MNCs place plants and orders wherever costs are low, and consumers everywhere gain choice, quality and lower prices. The same wave hits producers unevenly: a small Indian toy- or battery-maker now competes on his own street with imports produced at massive scale - he cannot match the price or the finish, loses the local shopkeeper's order, and shuts down or shifts trades. But globalisation also creates producers: garment units in Tiruppur, software and BPO firms, spice and marine exporters - businesses whose entire existence depends on foreign orders and inputs. The outcome for any single producer depends on one question: can he meet global prices and standards? If yes, his market just grew from one district to dozens of countries; if no, even his home market is no longer safe. That is why the debate is about FAIR globalisation - labour standards, protection for small producers while they upgrade, negotiated trade rules - not about stopping integration, which no country can anyway." },
        { "how": [
          "Identify the channel acting on the producer: import competition, export access, foreign investment (new plants and jobs), or outsourcing (new service work).",
          "Ask the survival question: can this producer match the import's price and quality at his scale? If yes, he gains markets; if no, he loses even local buyers.",
          "For consumers, expect gains: more choice, better quality, lower prices.",
          "For workers, expect a split: new jobs in export and IT-enabled sectors, lost jobs in import-competing small units.",
          "Evaluate like an examiner: conclude with both sides plus the 'fair globalisation' policy angle rather than a one-sided verdict."
        ] },
        { "terms": { "MNC": "A company that owns or controls production in more than one country, locating plants and suppliers where costs are lowest.", "FDI": "Foreign direct investment - buying or building productive assets (factories, offices) in another country.", "Trade barrier": "A tax (tariff) or quantity limit (quota) on imports; liberalisation means removing these.", "Liberalisation": "Freeing trade and investment from government restrictions so goods and capital move across borders.", "Outsourcing": "Hiring outside firms, often abroad, to run services like customer support, accounting or design." } },
        { "ex": "The arithmetic of scale - why the small unit loses. A small toy workshop has fixed costs (rent, moulds, machine EMIs) of ₹5,00,000 a month and makes 5,000 toys; fixed cost per toy = 5,00,000/5,000 = ₹100. A foreign mega-plant with the same ₹5,00,000 fixed cost spreads it over 5,00,000 toys: ₹1 per toy. Same factory economics, 100× the scale - so the import lands at ₹150 where the small unit needs ₹200, and shopkeepers switch. The other side of the same wave: a Tiruppur knitwear exporter wins a European retailer's order for 1,00,000 shirts at ₹300 each - 1,00,000 × 300 = ₹3,00,00,000, i.e. ₹3 crore of annual business that the domestic market alone could never have generated for him. Both stories are true simultaneously; which one you live in depends on whether you can meet the global price and standard." },
        { "rw": "The 'Make in India vs cheap imports' debate, your ₹299 imported earphones sitting beside a closed local electronics unit, and the Flipkart/Walmart supply chains that let one karigar sell nationwide - all are the same mechanism of integration with winners and losers." },
        { "mis": "'Globalisation is purely good' or 'purely bad'. Correction: it redistributes - consumers and globally competitive producers and their workers gain; uncompetitive small producers and their workers lose. The exam expects the duality stated with examples. A second error: 'MNCs only sell in India' - MNCs also produce here, sourcing components locally (Maruti's vendor network, phone assembly), so the MNC effect on jobs and suppliers runs through both the market and the factory." },
        { "exam": "Classic 5-marker: 'What is globalisation? How does it affect (a) small producers (b) consumers (c) workers in India?' Full marks need: the definition (integration of markets via trade, investment, technology), MNC logic of cheap production locations, the competition side (toys, batteries, capacitors shutting down) and the opportunity side (garments, IT-BPO, gems and jewellery), and a fair-globalisation conclusion. Case-study MCQs test the channels - FDI vs trade vs outsourcing - and who gains/loses in a given scenario." },
        { "qc": { "q": "A small Indian battery maker closes after cheap imports flood the market, while an Indian garment exporter's order book booms. Both are effects of:", "o": ["Inflation", "Globalisation", "Disguised unemployment", "The debt trap"], "a": 1 } }
      ]
    }
  ],
  "s-civ": [
    {
      "t": "Why Share Power? Belgium's Accommodation vs Sri Lanka's Majoritarianism",
      "s": [
        { "d": "Power sharing means distributing power among communities, regions and levels of government so that no single group can take decisions unilaterally; Belgium resolved its linguistic divide by accommodation and stayed united, while Sri Lanka's majoritarian policies deepened grievance into a decades-long civil war." },
        { "why": "The reasoning: in a diverse society, if the majority treats the state as its private property - its language alone official, its community preferred in jobs and education - then minorities lose faith that the state belongs to them. Policy loses legitimacy for them, and grievance stops being about policy and becomes existential: leave, or fight. This is why power sharing is desirable on two grounds. The prudential reason (it is wise): sharing reduces the risk of conflict and keeps the state stable - even the majority is safer with peace than with dominance. The moral reason (it is right): in a democracy, power must flow from all the people; people who live under a government and are affected by its decisions deserve a voice in them, and mere numerical majority does not cancel that. Belgium and Sri Lanka are history's closest thing to a controlled experiment: both multilingual, both facing a majority-minority split - Belgium chose power sharing, Sri Lanka chose majoritarianism, and the outcomes diverged exactly as the theory predicts. Belgium's structure had a twist forcing accommodation: Dutch-speakers were the national majority (about 59% to 40% French-speakers, plus a small German-speaking group), but in the capital Brussels the French were 80% - each community was a minority somewhere, so unilateral rule would have broken the country." },
        { "how": [
          "Map the structure: which community is the majority and the minority nationally, and where each is regionally concentrated or locally dominant.",
          "Ask what the majority did with state power: accommodate (share cabinet, special majorities, community governments) or dominate (single official language, preferential policies).",
          "Trace the minority's response: participation within the system (Belgium) or escalating demands → radicalisation → armed conflict (Sri Lanka).",
          "State the two reasons power sharing is desirable - prudential (stability) and moral (democratic legitimacy) - and use them to explain both countries.",
          "For comparisons, structure the answer in parallel: background → policy choice → minority response → outcome, one paragraph per country."
        ] },
        { "terms": { "Majoritarianism": "A vision of democracy in which the numerical majority's community runs the state as its own, ignoring minority claims.", "Prudential reason": "Power sharing is wise: it reduces the chance of conflict and instability, benefiting even the majority.", "Moral reason": "Power sharing is the spirit of democracy itself: the people affected by power deserve a share in it, not just the largest bloc.", "Community government": "Belgium's third tier - elected by one linguistic community and controlling culture, education and language policy.", "Civil war": "Sustained armed conflict within a country; Sri Lanka's ran from 1983 until the LTTE's defeat in 2009." } },
        { "ex": "The counterfactual test - run Sri Lanka's key move through the power-sharing logic. The move: the 1956 Act making Sinhala the only official language, in a country where Sinhala speakers were roughly three-fourths of the population but Tamil speakers were a large, concentrated minority with their own language, schools and professional class. Who gained? Sinhala speakers - access to state jobs, higher education and administration in their mother tongue. Who lost? Tamil speakers - effectively locked out of state employment and university seats (the preferential policies compounded it), reading every sign of the state as a message that they were second-class. Predicted consequence by the model: loss of legitimacy → demands for recognition →, when ignored, demands for autonomy → radicalisation → war. That is precisely what followed: peaceful protests first, then the Tamil parties' federal demands, then the LTTE's armed campaign and the 1983-2009 civil war. The alternative path, chosen by Belgium between 1970 and 1993 - equal ministerial weight for both communities in the central government (neither can decide alone), special laws needing majorities from both linguistic groups, separate community governments for culture and education, and a power-sharing arrangement in bilingual Brussels - kept every grievance inside politics. Same starting problem, opposite methods, opposite outcomes: that is the evidence for the theory." },
        { "rw": "India's own design - linguistic states, reserved constituencies, coalition governments, and the three-language policy - is the same logic applied at scale; any organisation splitting a shared bill of power (co-founders with veto rights) is doing a Belgium, not a Sri Lanka." },
        { "mis": "The seductive misconception: 'majority rule IS democracy, so majoritarianism is just democracy in action.' Correction: democracy is majority rule WITH minority voice and rights; when the state adopts one community's language or religion as the state's own, the minority's citizenship is downgraded, and the system stops being a democracy for a part of its people - Sri Lanka is the cautionary exhibit. The mirror error: 'Belgium's system is perfect.' It is slow and complex - the honest claim is that power sharing manages conflict, it does not erase disagreement." },
        { "exam": "Two guaranteed zones: 'Why is power sharing desirable?' (prudential vs moral - 3 marks, students who give only one reason lose a third of the marks) and the Belgium-Sri Lanka comparison (5 marks or a source-based case set). Examiners expect the specific evidence: the 59/40 linguistic split and Brussels' 80-20 reversal, the 1956 'Sinhala only' act, preferential policies, the civil war and its 2009 end, and Belgium's four-part accommodation. A reasoning chain (why exclusion produces conflict, why sharing produces stability) scores over a date-list; write answers as argument-with-evidence, not a timeline." },
        { "qc": { "q": "The prudential reason for power sharing is that it:", "o": ["is morally required by democracy", "is wise, because it reduces the risk of conflict", "is commanded by Belgium's constitution", "makes elections unnecessary"], "a": 1 } }
      ]
    },
    {
      "t": "Why India Built a Three-Tier Federation with Local Government at the Bottom",
      "s": [
        { "d": "Indian federalism divides powers between the Union and the States through three Lists (Union, State, Concurrent), and - since the 73rd and 74th Amendments of 1992 - adds a constitutionally protected third tier of local government: panchayats in rural areas and municipalities in urban areas." },
        { "why": "Why federalism at all: India is continental in scale and kaleidoscopic in diversity - a single central government cannot know or respond to conditions in every linguistic region; dividing subjects between Union (defence, currency, foreign affairs), States (police, agriculture, health) and a shared list lets each level govern what it is best placed to govern, while a strong centre holds the union together. Why a third tier: even a state capital sits far from the village. Local problems - which pond to de-silt, which road first, whether the school teacher attends - need local information, and local officials answer to the people who face the problem daily. Local government also deepens democracy itself: in the Gram Sabha (the meeting of all adult voters of the village), citizens question their sarpanch face to face - participation stops being a five-yearly trip to the ballot box. Historically, panchayats existed but were advisory, weak and irregularly convened, so in 1992 the Constitution was amended to make local self-government compulsory and real: elections every five years through an independent State Election Commission (so state governments cannot indefinitely postpone them), reservation of seats for SC/ST in proportion to population and one-third of all seats (half in many states) for women, and a State Finance Commission to share state revenue with local bodies - because a panchayat without funds is decoration." },
        { "how": [
          "Match a subject to its tier: currency and defence → Union List; police and agriculture → State List; marriage, education, forests → Concurrent; village wells, local roads, market yards → local bodies.",
          "Justify the tier with the two tests: information (who knows the facts on the ground?) and accountability (whose career depends on the affected people's satisfaction?).",
          "For constitutional questions, deploy the 73rd/74th machinery in order: constitutional status → five-yearly elections via State Election Commission → reservations → State Finance Commission for funds.",
          "Analyse limits honestly: local bodies still struggle with the three Fs - funds, functions and functionaries - often dependent on state governments for money and staff.",
          "Use the Gram Sabha in answers as the living example of participatory (direct) democracy, not just another institution."
        ] },
        { "terms": { "Federalism": "Power shared between a central authority and constituent units, each supreme in its own sphere; in India, three levels of government.", "Gram Sabha": "The assembly of all adult voters of a village panchayat area - the direct-democracy base that audits the elected panchayat's work and accounts.", "73rd / 74th Amendments": "The 1992 constitutional amendments (in force from 1993) giving constitutional status to rural (73rd) and urban (74th) local government.", "Decentralisation": "Shifting decision-making from the centre and state capitals down to the local level, where people can participate directly.", "Three Lists": "Union, State and Concurrent Lists dividing legislative subjects between the two upper tiers of the federation." } },
        { "ex": "The tier-assignment drill - decide the right level with reasons. (1) Printing currency: Union - a single monetary authority is non-negotiable for one economy (imagine 28 state rupees). (2) State police: State - law and order varies with local conditions and must answer to the state's elected government. (3) Repairing a village pond: local - the Gram Sabha alone knows which pond, whose fields flood, and can check the material actually delivered; a distant officer knows none of this and his promotion does not depend on the villagers' satisfaction. (4) A highway crossing five districts: State - beyond any single panchayat's scope and funds, needing coordination. (5) Marriage and divorce law: Concurrent - a national framework with room for state-level variation, like personal law reforms. The test each answer passes: information and accountability both sit at the chosen level. And the machinery works: when the panchayat misuses MGNREGA funds, it is the Gram Sabha's social audit that catches it - the 73rd Amendment's design in action, with the State Election Commission guaranteeing the sarpanch can be voted out every five years, not serve at a state government's pleasure." },
        { "rw": "Your ward committee fixing the streetlights, the resident who catches a padded contractor bill at a Gram Sabha meeting, and the sarpanch who is your neighbour rather than a distant IAS officer - decentralisation is the layer of government you can actually argue with. Roughly one-third of panchayat seats are now held by women (several states raised it to half), changing who sits in decision-making rooms." },
        { "mis": "The misconception that India is purely two-tier, or that local government is a favour the state can withdraw. Correction: since 1993 local government is constitutional, with guaranteed five-year elections run by an independent State Election Commission - a state cannot simply suspend panchayats as it could before. The second error is confusing the Gram Sabha (ALL adult villagers, meets and audits) with the Gram Panchayat (the elected representatives who execute); the Sabha is the watchdog, the Panchayat the worker - exam answers that swap them lose the concept mark." },
        { "exam": "Frequent questions: 'Why did India adopt a federal structure?' (diversity, scale, unity with autonomy), 'How does decentralisation deepen democracy?' (participation, accountability, women's representation), and case-based sets on the 73rd Amendment's features. Scoring moves: name the specific machinery (five-year term, State Election Commission, SC/ST and women's reservations, State Finance Commission, 29 subjects in the Eleventh Schedule), use the Gram Sabha as your participatory-democracy example, and mention the three Fs (funds, functions, functionaries) as the honest limitation - evaluative points earn the top band." },
        { "qc": { "q": "The 73rd Amendment (1992) of the Indian Constitution deals with:", "o": ["urban local government", "rural local government (panchayats)", "relations between the Union and the States", "the judiciary"], "a": 1 } }
      ]
    },
    {
      "t": "Communalism vs Secularism as Constitutional Practice",
      "s": [
        { "d": "Communalism is the belief that people of one religion form a single political community with common interests opposed to those of other religions - and the politics built on that belief; Indian secularism is the constitutional practice in which the state has no religion of its own, guarantees every citizen equal religious freedom, and maintains a principled distance from all religions, sometimes intervening within religion for equality and reform." },
        { "why": "Why communalism corrodes democracy: it collapses a citizen's many identities - class, region, language, gender, occupation - into one label, then tells people that their interests are set by that label and that other communities are rivals. Voters stop judging policy (schools, jobs, prices) and start defending 'the community'; parties learn that fear wins votes; ordinary disputes between neighbours acquire religious meaning, and riots or partition-scale violence become possible. India's own partition in 1947 - the subcontinent split along a religious line amid catastrophic violence - is the founding reason the framers wrote secularism into the Constitution. The Indian model differs from the French strict separation: rather than a wall between state and religion, the state keeps a principled distance - it endorses no religion, funds no religion preferentially, and cannot promote any religion through taxes, yet it CAN reach inside religious practice to cure discrimination (abolishing untouchability, throwing temples open to all). Why intervention is allowed: the state's higher loyalty is to equal citizenship; when a religious custom violates someone's equal rights, the Constitution sides with the citizen." },
        { "how": [
          "Spot communalist claims with the test: does the argument assume the nation belongs to one religion, or that citizens' rights should depend on their religion? If yes, it is communal politics, whatever its packaging.",
          "Run the constitutional test on any state action: no official religion; equal freedom to profess, practise and propagate (Article 25); no religious instruction in government schools; no taxes to promote any religion; no discrimination on grounds of religion.",
          "Distinguish personal faith from communalism: being devout is a private matter; communalism is the POLITICAL use of religion to mobilise a bloc against others.",
          "Analyse borderline cases with the principled-distance lens: the state funding all communities' institutions on the same criteria is secular; banning an inegalitarian practice inside one religion for equality is Indian secularism, not an attack on it.",
          "For long answers, close with the historical evidence: partition-era violence and subsequent riots show what communalism does; the Constitution's design is the standing alternative."
        ] },
        { "terms": { "Communalism": "The idea that followers of a religion share common secular-political interests fundamentally opposed to those of other religions - and the politics that mobilises on it.", "Secularism (Indian model)": "No official state religion + equal respect and freedom for all religions + principled intervention inside religion when equality demands it.", "Communal politics": "Mobilising voters around religious identity and fear rather than policy; vote banks built on community labels.", "Freedom of religion (Article 25)": "Every citizen may profess, practise and propagate any religion, subject to public order, morality and health.", "Principled distance": "The state neither endorses religion nor blindly stays out; it engages all religions equally and intervenes only on the ground of equal citizenship." } },
        { "ex": "The three-scenario constitutional test. Scenario A: a government declares one religion the state religion and funds only its institutions. Verdict: unconstitutional - fails at the first clause (no official religion) and at non-discrimination; this is the majoritarian-communal direction the Constitution forecloses. Scenario B: a government funds educational and welfare institutions run by different religious communities under the same criteria and audits them alike. Verdict: secular - equal respect means treating communities even-handedly, not pretending religion does not exist. Scenario C: a government bans untouchability and enforces temple entry for Dalits, overriding a discriminatory custom. Verdict: Indian secularism in action - principled distance; the state has entered the religious domain precisely because the custom violated equal citizenship (Articles 15 and 17 trump custom). Contrast for precision: a party campaigning 'vote for us because we are the party of religion X, the others are against your community' is communal politics by definition - it asks you to vote as a member of a religious bloc rather than as a citizen judging policy, and it is the mobilisation that Scenarios A-C are designed to withstand. Gandhi's personal religiosity, on the other hand, fails the communalism test on every clause - it was private faith, not bloc mobilisation - showing that the dividing line is political use, not belief." },
        { "rw": "Reading a manifesto that asks for votes on religion alone, versus one that debates jobs, schools and prices - the difference between the two is the whole chapter; a school admitting students of every faith on identical criteria practises, in miniature, what Article 25-28 demand of the state." },
        { "mis": "Two mirror-image misconceptions. First: 'secularism means the state is irreligious or anti-religion.' Correction: the Indian state protects and funds-equally religious practice; what it refuses is to adopt one religion as its own. Second: 'any expression of religious identity is communalism.' Correction: a person's private belief or festival is not communal; communalism begins when religion is converted into political identity - 'our community versus theirs' - and rights are claimed on that basis. Examiners penalise both conflations." },
        { "exam": "Standard 5-mark: 'What is communalism? Explain the features that make India a secular state.' Full-credit structure: define communalism as a political (not personal) phenomenon, list the constitutional features (no official religion; freedom to profess, practise, propagate; no religious instruction in government schools; no taxes to promote any religion; non-discrimination on religious grounds), then add the Indian-model twist - principled intervention for reform, with untouchability/temple entry as the example - which separates a top-band answer from a textbook-recitation one. MCQs test feature recognition and the communalism definition, especially the 'political use of religion' clause." },
        { "qc": { "q": "Which of the following is a feature of Indian secularism?", "o": ["The state has an official religion", "Religious instruction is compulsory in government schools", "The state has no religion and treats all citizens equally regardless of religion", "Religious communities may not practise in public"], "a": 2 } }
      ]
    }
  ]
};
</script>

<script>
const EXP_QUESTIONS_A = [

// ============ m-stat : Statistics (5) ============
{id:"q2-stat-1", ch:"m-stat", d:2, ty:"MCQ", q:"The marks obtained by 50 students in a test are grouped as: 0-10 (f = 5), 10-20 (f = 8), 20-30 (f = 12), 30-40 (f = 15), 40-50 (f = 10). The mean marks of the students is:", o:["28.4","27.6","29.2","30.0"], a:0, concept:"Mean of grouped data by the direct method (class marks and frequencies)", mis:"Calculation mistake", h1:"You need one representative value for each class interval first.", h2:"Use the direct method: mean = Σfx / Σf, where x is the class mark (midpoint) of each class.", h3:"Write the class marks 5, 15, 25, 35, 45, then compute Σfx and Σf.", sol:["Class marks: x = 5, 15, 25, 35, 45", "Σf = 5 + 8 + 12 + 15 + 10 = 50", "Σfx = 5×5 + 8×15 + 12×25 + 15×35 + 10×45 = 25 + 120 + 300 + 525 + 450 = 1420", "Mean = Σfx / Σf = 1420 / 50 = 28.4", "Check: Σf = 50 matches the given total of 50 students."], exp:"In grouped data, the class mark stands in for every value in its class, so the mean is always Σfx over Σf.", board:true},

{id:"q2-stat-2", ch:"m-stat", d:2, ty:"MCQ", q:"For the distribution 0-20 (f = 6), 20-40 (f = 10), 40-60 (f = 12), 60-80 (f = 6), 80-100 (f = 6), the mode of the data is:", o:["45","46","44","52"], a:0, concept:"Mode of grouped data using the modal-class interpolation formula", mis:"Formula mistake", h1:"First locate the class with the highest frequency.", h2:"Apply Mode = l + ((f1 - f0) / (2f1 - f0 - f2)) × h using the modal class 40-60.", h3:"Substitute l = 40, h = 20, f1 = 12, f0 = 10, f2 = 6 carefully into the formula.", sol:["Highest frequency is 12, so the modal class is 40-60: l = 40, h = 20, f1 = 12, f0 = 10, f2 = 6", "Mode = l + ((f1 - f0) / (2f1 - f0 - f2)) × h = 40 + ((12 - 10) / (24 - 10 - 6)) × 20", "Fraction = 2 / 8 = 0.25", "Mode = 40 + 0.25 × 20 = 45", "Check: the mode must lie inside the modal class 40-60, and 45 does."], exp:"The mode formula only needs the modal frequency and the frequencies immediately on either side of it.", board:true},

{id:"q2-stat-3", ch:"m-stat", d:3, ty:"MCQ", q:"For a distribution of 36 students, the 'less than' ogive and the 'more than' ogive are drawn on the same axes and intersect at the point P(24, 18). The median of the distribution is:", o:["24","18","42","Cannot be determined"], a:0, concept:"Median as the x-coordinate of the intersection of the less-than and more-than ogives", mis:"Reading mistake", h1:"Think about what the crossing point of the two ogives represents for the data.", h2:"At the intersection the 'less than' and 'more than' curves agree, and that value of the variable is the median.", h3:"Ask yourself which coordinate of P is a value of the variable and which is a frequency, then read the variable's value.", sol:["Total students n = 36, so half the observations lie at cumulative frequency n/2 = 18", "At the intersection point, the 'less than' and 'more than' curves give the same value of the variable", "The y-coordinate 18 confirms that both curves meet exactly at n/2 = 36/2 = 18", "Median = x-coordinate of the intersection point = 24", "Check: the y-coordinate 18 equals n/2 = 18, so the reading is consistent."], exp:"Median = x-coordinate of the crossing point of the two ogives; the y-coordinate is just n/2.", board:true},
