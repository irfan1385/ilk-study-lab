<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="description" content="ILK Study Lab — Understand deeply. Solve intelligently. Revise efficiently. Class 10 board + competitive foundation learning system.">
<title>ILK Study Lab</title>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans Devanagari", sans-serif;
  --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  /* type scale */
  --fs-xs:.72rem; --fs-sm:.82rem; --fs-base:.92rem; --fs-md:1rem; --fs-lg:1.15rem; --fs-xl:1.4rem; --fs-2xl:1.75rem;
  /* spacing */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px; --s7:40px;
  /* radius */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-full:999px;
  /* light theme */
  --bg:#f4f5fa; --bg2:#eceef6; --surface:#ffffff; --surface2:#f7f8fc; --surface3:#eef0f7;
  --text:#1b1e28; --text2:#5a5f72; --text3:#8b90a5;
  --primary:#5457c8; --primary2:#6d5bd8; --primary-soft:#eceafc; --on-primary:#ffffff;
  --success:#1e9e6a; --success-soft:#e2f6ee; --warn:#c77f1a; --warn-soft:#fdf1dd; --danger:#d64545; --danger-soft:#fdeaea;
  --border:#e3e5ef; --border2:#d5d8e6;
  --shadow:0 1px 2px rgba(24,28,50,.05),0 4px 16px rgba(24,28,50,.06);
  --shadow-lg:0 2px 4px rgba(24,28,50,.06),0 12px 32px rgba(24,28,50,.12);
  --nav-h:64px; --hdr-h:56px;
}
[data-theme="dark"]{
  --bg:#0f1118; --bg2:#141724; --surface:#191c28; --surface2:#1f2331; --surface3:#262b3b;
  --text:#e9eaf2; --text2:#a7acc2; --text3:#71768d;
  --primary:#7b7ff0; --primary2:#9a8cf5; --primary-soft:#252a48; --on-primary:#0f1118;
  --success:#3ecf9a; --success-soft:#12301f; --warn:#e8b45a; --warn-soft:#2f2513; --danger:#f07c7c; --danger-soft:#331a1a;
  --border:#262a3a; --border2:#333850;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.5);
}
/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--fs-base);line-height:1.55;min-height:100vh;transition:background .25s,color .25s}
button{font-family:inherit;font-size:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text)}
img,svg{max-width:100%}
::selection{background:var(--primary);color:var(--on-primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* ============ LAYOUT ============ */
#app{max-width:640px;margin:0 auto;min-height:100vh;position:relative}
#view{padding:calc(var(--hdr-h) + 12px) var(--s4) calc(var(--nav-h) + 28px);animation:viewIn .28s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(min-width:700px){#app{max-width:760px}}
@media(min-width:1000px){
  #app{max-width:880px}
  #bottomnav{left:50%;transform:translateX(-50%);border:1px solid var(--border);border-bottom:none}
}
/* ============ HEADER ============ */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr-h);display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);max-width:640px;margin:0 auto;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:40;border-bottom:1px solid var(--border)}
.hdr-logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:var(--fs-md);letter-spacing:-.2px}
.hdr-logo .logo-badge{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:#fff;font-size:.8rem;font-weight:800}
.hdr-title{font-weight:700;font-size:var(--fs-md);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--text2);flex-shrink:0;transition:background .15s}
.icon-btn:hover{background:var(--surface3)}
/* ============ BOTTOM NAV ============ */
#bottomnav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text3);font-size:var(--fs-xs);font-weight:600;transition:color .18s;position:relative}
.nav-item svg{width:22px;height:22px}
.nav-item.active{color:var(--primary)}
.nav-item.active::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--primary)}
/* ============ TYPOGRAPHY ============ */
h1{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.4px}
h2{font-size:var(--fs-lg);font-weight:750;letter-spacing:-.2px}
h3{font-size:var(--fs-md);font-weight:700}
.muted{color:var(--text2)}.faint{color:var(--text3)}
.small{font-size:var(--fs-sm)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:var(--s6) 0 var(--s3)}
.section-title h2{display:flex;align-items:center;gap:8px}
/* ============ CARDS ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:var(--s5)}
.card.tap{transition:transform .15s,box-shadow .15s;cursor:pointer}
.card.tap:active{transform:scale(.98)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.grid.c3{grid-template-columns:repeat(3,1fr)}}
/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--r-md);font-weight:700;font-size:var(--fs-base);background:var(--surface3);color:var(--text);transition:filter .15s,transform .1s;user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:var(--on-primary);box-shadow:0 4px 14px rgba(90,95,210,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.success{background:var(--success);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--border2)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:7px 13px;font-size:var(--fs-sm);border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:var(--s3);flex-wrap:wrap}
/* ============ CHIPS & BADGES ============ */
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--r-full);background:var(--surface3);color:var(--text2);font-size:var(--fs-xs);font-weight:700;border:1.5px solid transparent;cursor:pointer;transition:all .15s;white-space:nowrap}
.chip.sel{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:700}
.badge.board{background:var(--primary-soft);color:var(--primary)}
.badge.found{background:var(--success-soft);color:var(--success)}
.badge.easy{background:var(--success-soft);color:var(--success)}
.badge.std{background:var(--primary-soft);color:var(--primary)}
.badge.adv{background:var(--warn-soft);color:var(--warn)}
.badge.chal{background:var(--danger-soft);color:var(--danger)}
/* ============ PROGRESS ============ */
.pbar{height:8px;border-radius:var(--r-full);background:var(--surface3);overflow:hidden}
.pbar>div{height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .5s cubic-bezier(.2,.8,.3,1)}
.ring{--p:0;--sz:54px;width:var(--sz);height:var(--sz);border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface3) 0);display:grid;place-items:center;flex-shrink:0}
.ring::before{content:attr(data-val);width:calc(var(--sz) - 12px);height:calc(var(--sz) - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:800;color:var(--primary)}
/* ============ LISTS ============ */
.row{display:flex;align-items:center;gap:var(--s4);padding:var(--s4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);transition:transform .12s}
.row.tap{cursor:pointer}.row.tap:active{transform:scale(.985)}
.row .grow{flex:1;min-width:0}
.subj-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:1.3rem;flex-shrink:0}
/* ============ NOTES ============ */
.note-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5);margin-bottom:var(--s4)}
.formula{font-family:var(--mono);background:var(--surface3);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--r-sm);padding:10px 14px;margin:8px 0;font-size:.95rem;overflow-x:auto;white-space:nowrap}
.hl{background:linear-gradient(transparent 62%,rgba(90,95,210,.25) 0);font-weight:650}
.mistake-callout{background:var(--danger-soft);border-left:3px solid var(--danger);border-radius:var(--r-sm);padding:10px 14px;margin:8px 0;font-size:var(--fs-sm)}
.exam-callout{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:var(--r-sm);padding:10px 14px;margin:8px 0;font-size:var(--fs-sm)}
.why-callout{background:var(--success-soft);border-left:3px solid var(--success);border-radius:var(--r-sm);padding:10px 14px;margin:8px 0;font-size:var(--fs-sm)}
.topic-block{margin-bottom:var(--s6)}
.topic-block>h3{padding-bottom:8px;border-bottom:2px solid var(--border);margin-bottom:var(--s3);display:flex;align-items:center;gap:8px}
.tag-num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-size:var(--fs-xs);font-weight:800;flex-shrink:0}
/* ============ QUESTION ============ */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow)}
.q-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--s3)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 15px;border:1.5px solid var(--border);border-radius:var(--r-md);margin-bottom:10px;transition:all .15s;font-weight:550;cursor:pointer;background:var(--surface2)}
.opt:hover{border-color:var(--primary)}
.opt .opt-key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface3);font-weight:800;font-size:var(--fs-sm);flex-shrink:0}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .opt-key{background:var(--primary);color:var(--on-primary)}
.opt.right{border-color:var(--success);background:var(--success-soft)}
.opt.right .opt-key{background:var(--success);color:#fff}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.wrong .opt-key{background:var(--danger);color:#fff}
.hint-box{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r-md);padding:12px 15px;margin:10px 0;font-size:var(--fs-sm)}
.sol-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s4);margin-top:12px}
.sol-box .sol-step{display:flex;gap:10px;margin-bottom:8px;align-items:baseline}
.sol-box .sol-step b{color:var(--primary)}
/* ============ STATS ============ */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s4);text-align:center}
.stat .v{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:var(--fs-xs);color:var(--text3);font-weight:650;text-transform:uppercase;letter-spacing:.4px}
/* ============ MISC ============ */
.empty{padding:var(--s7) var(--s5);text-align:center;color:var(--text3)}
.empty .e-ico{font-size:2.6rem;margin-bottom:12px;opacity:.7}
.divider{height:1px;background:var(--border);margin:var(--s5) 0}
.toast{position:fixed;bottom:calc(var(--nav-h) + 20px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:var(--r-full);font-size:var(--fs-sm);font-weight:650;z-index:100;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,22,.55);z-index:60;display:grid;place-items:end center;padding:0;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{background:var(--surface);width:100%;max-width:640px;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--s6) var(--s5) calc(var(--s6) + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;animation:sheetUp .3s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.modal-handle{width:40px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto var(--s4)}
.timer-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface3);padding:6px 14px;border-radius:var(--r-full);font-weight:800;font-variant-numeric:tabular-nums}
.timer-pill.urgent{background:var(--danger-soft);color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;cursor:pointer;transition:all .15s}
.check-item.done{opacity:.55}
.check-item.done .ci-t{text-decoration:line-through}
.ci-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--border2);display:grid;place-items:center;flex-shrink:0;margin-top:1px;transition:all .15s;font-size:.75rem;color:#fff}
.check-item.done .ci-box{background:var(--success);border-color:var(--success)}
.search-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);padding:10px 14px;margin-bottom:var(--s4)}
.search-bar input{flex:1;border:none;background:none;outline:none;font-size:var(--fs-base)}
.progress-c{color:var(--primary)}
kbd{font-family:var(--mono);font-size:.78em;background:var(--surface3);padding:2px 7px;border-radius:5px;border:1px solid var(--border)}
.confetti-ico{font-size:3rem;text-align:center;margin:var(--s4) 0}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.switch{width:48px;height:28px;border-radius:var(--r-full);background:var(--surface3);position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .2s}
.switch.on{background:var(--success)}
.switch.on::after{left:23px}
input[type="range"]{accent-color:var(--primary);width:100%}
select.inp,input.inp,textarea.inp{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);padding:10px 14px;outline:none}
select.inp:focus,input.inp:focus,textarea.inp:focus{border-color:var(--primary)}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.tbl th{background:var(--surface3);padding:8px 10px;text-align:left;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.4px}
table.tbl td{padding:8px 10px;border-bottom:1px solid var(--border)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-sm);font-weight:600}
.flow .f-step{background:var(--surface3);border-radius:var(--r-full);padding:5px 13px}
.flow .f-arrow{color:var(--text3)}
.tab-row{display:flex;gap:4px;background:var(--surface3);border-radius:var(--r-md);padding:4px;margin-bottom:var(--s4)}
.tab{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-weight:700;font-size:var(--fs-sm);color:var(--text2);transition:all .18s;cursor:pointer}
.tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.flag-btn{position:absolute;top:12px;right:12px;color:var(--text3);padding:6px;border-radius:8px}
.flag-btn.on{color:#e8b45a}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>
<div id="app">
  <header id="hdr" role="banner">
    <div class="hdr-logo" id="hdrLogo" aria-label="ILK Study Lab home">
      <span class="logo-badge" aria-hidden="true">ILK</span>
    </div>
    <div class="hdr-title" id="hdrTitle">Study Lab</div>
    <button class="icon-btn" id="btnSearch" aria-label="Search" title="Search">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main id="view" role="main" aria-live="polite"></main>

  <nav id="bottomnav" role="navigation" aria-label="Main navigation">
    <button class="nav-item" data-nav="home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21V12h6v9"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-nav="learn" aria-label="Learn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Learn</span>
    </button>
    <button class="nav-item" data-nav="solve" aria-label="Solve">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <span>Solve</span>

/* ================================================================
   NOTES DATA

const NOTES = {};

/* ---------------- MATHS ---------------- */
NOTES["m-real"] = { short:[
 {h:"Core Theorems"},
 {f:"Euclid's Division Lemma: a = bq + r, 0 ≤ r < b"},
 {f:"HCF(a,b) = HCF(b, r) — the Euclidean algorithm chain"},
 {f:"HCF × LCM = product of the two numbers (two numbers only!)"},
 {f:"Fundamental Theorem of Arithmetic: every composite number factors into primes in exactly ONE way (order aside)"},
 "√2, √3, √5, √p for any prime p → irrational (prove by contradiction)",
 {x:"HCF × LCM = product does NOT hold for three numbers. Find HCF and LCM separately."},
 {h:"Decimal Expansions"},
 "Terminating ⇔ denominator (lowest form) = 2ⁿ × 5ᵐ only",
 "Non-terminating repeating (e.g. 1/3 = 0.333…) → rational",
 "Non-terminating NON-repeating (e.g. √2 = 1.4142…) → irrational",
 {e:"Board favourite: prove √2 or √3 or √5 irrational (3 marks). Always start: let √p = a/b, a,b coprime…"},
 {qc:{q:"Is 0.101001000100001… (gaps growing) rational?", o:["Yes — it repeats","No — non-terminating, non-repeating","Yes — it is finite","Cannot say"], a:1}}
], long:[
 {t:"Euclid's Division Lemma & Algorithm", s:[
  {d:"For any two positive integers a and b, there exist unique integers q (quotient) and r (remainder) with a = bq + r and 0 ≤ r < b."},
  {why:"It is just division with a guarantee. 23 ÷ 5 = 4 remainder 3 → 23 = 5×4 + 3, and 0 ≤ 3 < 5. The lemma guarantees the remainder is always smaller than the divisor — that guarantee is what forces the algorithm to END."},
  {how:["Divide the bigger number by the smaller: a = bq + r","If r = 0, the smaller number b is the HCF","If r > 0, repeat with (b, r) — because every common divisor of a and b also divides r = a − bq","Continue until remainder 0. The last non-zero divisor is the HCF."]},
  {ex:"HCF(455, 42): 455 = 42×10 + 35 → 42 = 35×1 + 7 → 35 = 7×5 + 0 → HCF = 7."},
  {mis:"Students stop when r becomes small instead of r = 0. Keep going until the remainder is exactly 0 — then read the LAST divisor."},
  {exam:"Asked as a 2–3 mark 'find HCF by Euclid's algorithm' question. Show every division step; marks are given per step."}]},
 {t:"Fundamental Theorem of Arithmetic", s:[
  {d:"Every composite number can be expressed as a product of primes, and this factorisation is unique apart from the order of factors."},
  {why:"6 = 2×3 and no other primes can ever multiply to give 6. Try all you want — primes are the 'atoms' of multiplication, and each number's recipe is unique."},
  {how:["Factorise each number into primes","HCF = product of primes common to BOTH (lowest powers)","LCM = product of all primes that appear (highest powers)"]},
  {ex:"12 = 2²×3, 18 = 2×3² → HCF = 2×3 = 6 (take lower powers), LCM = 2²×3² = 36 (take higher powers). Check: 6 × 36 = 216 = 12 × 18 ✓"},
  {mis:"Forgetting HCF × LCM = product works ONLY for exactly two numbers. For 3+ numbers compute directly."},
  {exam:"'Find HCF and LCM by prime factorisation' is a guaranteed 3-mark pattern. If the answer must satisfy 4x + 1 relation, verify before finalising."},
  {qc:[{q:"LCM(12,18) = ?", o:["36","72","6","24"], a:0},{q:"HCF × LCM = ?", o:["a−b","a+b","a×b","a/b"], a:2}]}]},
 {t:"Irrationality of √2 (proof by contradiction)", s:[
  {d:"√2 cannot be written as p/q for any integers p, q. It is irrational."},
  {why:"The proof works by assuming the opposite and exploding it. If √2 WERE rational, its square would force a contradiction with coprime-ness."},
  {how:["Assume √2 = a/b with a, b coprime (fraction fully reduced)","So 2 = a²/b² → a² = 2b²","a² is even → a is even → a = 2k","Substitute: 4k² = 2b² → b² = 2k² → b is even too","Both a and b even → they share factor 2 → NOT coprime. Contradiction!","So √2 is irrational."]},
  {mis:"Writing '√2 is irrational because its decimal never ends' — true but NOT a proof. A non-ending decimal could still repeat. The contradiction proof is what boards award marks for."},
  {exam:"This exact proof appears for √2, √3, √5, and '3 + √5' variants. Learn the skeleton once; only the algebra differs."}]}
]};

NOTES["m-poly"] = { short:[
 {h:"Zero–Coefficient Relationships"},
 {f:"Quadratic ax²+bx+c: sum of zeroes α+β = −b/a, product αβ = c/a"},
 {f:"Cubic ax³+bx²+cx+d: α+β+γ = −b/a, αβ+βγ+γα = c/a, αβγ = −d/a"},
 "Forming polynomial from zeroes: x² − (α+β)x + αβ",
 {x:"Sign errors: −b/a means the SIGN of b flips. 2x² − 5x + 3 → sum = 5/2 (positive!), product = 3/2."},
 {h:"Division Algorithm"},
 {f:"Dividend = Divisor × Quotient + Remainder  →  p(x) = g(x)·q(x) + r(x), deg r < deg g"},
 "If a polynomial has zeroes α, β then (x−α)(x−β) divides it exactly",
 {e:"2024 board MCQ: sum of zeroes of 2x² − k√2 x + 1 is √2 → −(−k√2)/2 = √2 → k = 2."},
], long:[
 {t:"Geometrical Meaning of Zeroes", s:[
  {d:"The zeroes of a polynomial p(x) are exactly the x-coordinates where its graph cuts the x-axis."},
  {why:"A zero is where p(x) = 0. On the y-axis the 'height' of the graph IS p(x). Height zero = the point sits ON the x-axis."},
  {ex:"A quadratic whose parabola never touches the x-axis has NO real zeroes — e.g. x² + 1. This is the visual version of discriminant D < 0."},
  {mis:"Counting the vertex touch point of y = x² as 'two zeroes'. It is ONE repeated zero (D = 0) — the parabola just kisses the axis."},
  {exam:"MCQs show a parabola crossing at x = 1 and x = 3 and ask the polynomial: (x−1)(x−3) = x² − 4x + 3."}]},
 {t:"Zero ⇄ Coefficient Bridge", s:[
  {d:"For ax² + bx + c with zeroes α, β: α + β = −b/a and αβ = c/a."},
  {why:"Expand a(x−α)(x−β) = a(x² − (α+β)x + αβ). Match with ax² + bx + c: the middle coefficient must be −a(α+β) and the last must be a·αβ. The relationship is forced by algebra, not memorised."},
  {how:["Identify a, b, c with correct signs","sum: −b/a, product: c/a","To BUILD a polynomial from zeroes: x² − (sum)x + product","Verify by factoring the result if time permits"]},
  {ex:"Zeroes 2 and −3 → sum = −1, product = −6 → x² − (−1)x + (−6) = x² + x − 6 ✓ (factors as (x+3)(x−2))"},
  {mis:"For cubic α+β+γ = −b/a (not b/a) — the alternating signs catch students. Biquadratic: all four symmetric sums follow the same pattern."},
  {exam:"Two classic 3-markers: (i) given polynomial, verify zeroes & relationship; (ii) find k if one zero is known — substitute the zero into p(x) = 0."}]}
]};

NOTES["m-lin"] = { short:[
 {h:"Consistency Conditions (a₁x+b₁y+c₁=0, a₂x+b₂y+c₂=0)"},
 {f:"a₁/a₂ ≠ b₁/b₂ → unique solution (intersecting lines — consistent)"},
 {f:"a₁/a₂ = b₁/b₂ ≠ c₁/c₂ → no solution (parallel — inconsistent)"},
 {f:"a₁/a₂ = b₁/b₂ = c₁/c₂ → infinitely many (coincident — dependent)"},
 {h:"Methods"},
 "Graphical: plot both lines, read intersection",
 "Substitution: express y from one equation, plug into other",
 "Elimination: multiply to make coefficients equal, then add/subtract",
 {x:"When word problems say '5 years ago / 10 years later' — change BOTH variables' ages, and keep the direction of time consistent."},
 {e:"Case-study favourite: ticket/money problems — form 2 equations from two total conditions."}
], long:[
 {t:"Why the Three Consistency Cases Must Be True", s:[
  {d:"A pair of linear equations has either exactly one, zero, or infinitely many solutions — never exactly two."},
  {why:"Two straight lines on a plane either cross once, run parallel forever, or lie exactly on top of each other. There is no fourth geometric possibility, so there is no fourth algebraic one."},
  {how:["Compute a₁/a₂, b₁/b₂, c₁/c₂","All three equal → coincident (infinite solutions)","First two equal, third different → parallel (no solution)","First two unequal → intersecting (exactly one solution)"]},
  {ex:"x + 2y = 4 and 2x + 4y = 12: ratios 1/2 = 2/4 ≠ 4/12 → parallel lines → no solution."},
  {mis:"Checking only a₁/a₂ vs b₁/b₂ and forgetting c — you MUST look at c to separate 'parallel' from 'coincident'."},
  {exam:"Frequently a 1-mark MCQ: 'the system 3x − y = 5, 6x − 2y = k has infinitely many solutions when k = ?' → ratios force k = 10."}]}
]};

NOTES["m-quad"] = { short:[
 {h:"The Toolkit"},
 {f:"ax² + bx + c = 0 (a ≠ 0) — standard form FIRST"},
 {f:"Quadratic formula: x = [−b ± √(b² − 4ac)] / 2a"},
 {f:"Discriminant D = b² − 4ac: D>0 real distinct · D=0 real equal · D<0 no real roots"},
 {x:"D < 0 means NO REAL roots — writing two complex roots in a board answer loses marks in Class 10."},
 {h:"Method Selection"},
 "Factorisation → when splitting is obvious (ac method)",
 "Formula → always works; safest under exam pressure",
 "Completing square → mostly for derivations; know the technique",
 {h:"Root–Coefficient Facts"},
 "If roots are α, β: x² − (α+β)x + αβ = 0",
 {e:"2024 MCQ: real & equal roots ⇔ b² = 4ac ⇔ c = b²/4a."},
 {x:"Word problems: 'speed' answers must be positive and realistic — reject the negative root with a stated reason."}
], long:[
 {t:"The Discriminant — a Complete X-ray of the Equation", s:[
  {d:"D = b² − 4ac predicts the nature of roots without ever solving the equation."},
  {why:"The formula x = (−b ± √D)/2a. Everything hinges on √D. Positive D → square root gives two different numbers → two roots. Zero → ±0 collapses into one value. Negative → square root of a negative number doesn't exist in reals."},
  {how:["Write in standard form, identify a, b, c WITH signs","Compute D = b² − 4ac","Classify: D>0 distinct real, D=0 equal real, D<0 none real","If asked for equal roots condition: set b² = 4ac and solve for the unknown letter"]},
  {ex:"For what k does kx² + 6x + 1 = 0 have equal roots? D = 36 − 4k = 0 → k = 9."},
  {mis:"Substituting b = −6 as 6. (−6)² = 36 either way, but (−5)² vs −5² differ — square the signed value using brackets ALWAYS."},
  {exam:"'Find k so roots are real/equal' appears almost every year — 2–3 marks. End with a one-line conclusion naming the case."},
  {qc:{q:"2x² − 4x + k = 0 has equal roots. k = ?", o:["4","2","8","−4"], a:1}}]},
 {t:"Word Problems — the Translation Discipline", s:[
  {d:"Convert each English sentence into one algebraic fact, then solve the quadratic and REJECT impossible roots."},
  {why:"Boards test modelling, not arithmetic. The marks sit in the equation you build (2–3 of the 5 marks typically), not the final number."},
  {how:["Define variables explicitly: 'let present age = x'","Translate sentence by sentence into an equation","Solve by factorisation/formula","Check BOTH roots against the physical situation (age > 0, speed > 0, side length > 0)","Reject the impossible root with a reason, state units in the answer"]},
  {ex:"Product of two consecutive positive integers = 306: x(x+1) = 306 → x² + x − 306 = 0 → (x+18)(x−17) = 0 → x = 17 (reject −18: not positive). Numbers: 17 and 18."},
  {mis:"Forgetting the rejection step — even when both roots are mathematically valid, only one fits reality. Examiners specifically look for the rejection line."},
  {exam:"Classic setups: train speed & distance, area of rectangle with border path, work-rate (pipes filling tanks), age problems."}]}
]};

NOTES["m-ap"] = { short:[
 {f:"aₙ = a + (n−1)d"},
 {f:"Sₙ = n/2 [2a + (n−1)d]  =  n/2 (a + aₙ)"},
 "d = a₂ − a₁ (constant for the whole AP)",
 "Three numbers in AP → take a−d, a, a+d (sum becomes 3a — free simplification)",
 "aₙ is linear in n; Sₙ is quadratic in n",
 {x:"n must be a positive integer — if your answer is fractional, an equation was set up wrong."},
 {e:"2024: a=7, aₙ=84, Sₙ=2093/2 → n = 23. Practise the Sₙ ⇄ aₙ substitution: Sₙ = n/2(a + aₙ)."}
], long:[
 {t:"Reading Sₙ Like a Pro", s:[
  {d:"Sₙ = n/2 [2a + (n−1)d] counts the total of the first n terms."},
  {why:"Pairing trick: write the sum forwards and backwards, add them — each pair totals (first + last) = (a + aₙ), and there are n/2 such pairs. That's exactly Sₙ = n/2(a + aₙ)."},
  {how:["Given aₙ, use Sₙ = n/2(a + aₙ)","Given Sₙ and aₙ, first find n from aₙ = a + (n−1)d","'Which term is 0?' → set aₙ = 0","'Sum of first 20 terms' → direct plug"]},
  {ex:"How many terms of 24, 21, 18, … give sum 78? 78 = n/2[48 − 3(n−1)] → 3n² − 51n + 156 = 0 → n² − 17n + 52 = 0 → n = 4 or 13 (BOTH valid — series stays positive till term 8)."},
  {mis:"Discarding a valid second n. Always check whether both roots give a physically sensible answer."},
  {exam:"Salary-savings APs and 'nth term from the end' (use last term as first, d with sign flipped) are recurring patterns."}]}
]};

NOTES["m-tri"] = { short:[
 {h:"Fast-Track Revision (from your SelfStudys bank)"},
 "Similar figures: same shape, NOT necessarily same size",
 "ΔABC ∼ ΔPQR ⇔ ∠A=∠P, ∠B=∠Q, ∠C=∠R AND AB/PQ = BC/QR = CA/RP",
 {x:"Order of letters matters: ΔABC ∼ ΔPQR is NOT ΔABC ∼ ΔQRP — the correspondence is the whole point."},
 "Equiangular triangles → ratio of corresponding sides is constant",
 {f:"BPT (Thales): DE ∥ BC in ΔABC ⇒ AD/DB = AE/EC"},
 {f:"Converse of BPT: AD/DB = AE/EC ⇒ DE ∥ BC"},
 {h:"Similarity Criteria"},
 "AA (or AAA): two angles equal → similar",
 "SSS: all three sides proportional",
 "SAS: two sides proportional AND included angle equal",
 {f:"Ratio of areas of similar triangles = k² (square of side ratio)"},
 {f:"Pythagoras: hyp² = leg₁² + leg₂²; converse flips the statement"},
 {x:"Similar is NOT congruent: congruent (≅) forces same size; similar (∼) only forces same shape."},
 {e:"Boards love: prove BPT, prove Pythagoras via similarity, and 'areas ratio' numeric questions (ratio of sides 3:4 → areas 9:16)."}
], long:[
 {t:"Why BPT Is True (the parallel logic)", s:[
  {d:"A line parallel to one side of a triangle divides the other two sides proportionally."},
  {why:"The parallel line creates two triangles sharing one angle at A, with equal corresponding angles at D/E and B/C (corresponding angles of parallel lines). The small triangle is a scaled copy of the big one — scaling multiplies BOTH sides from A by the same factor, so the ratios must match."},
  {how:["Identify the parallel pair (DE ∥ BC)","Locate the vertex where both divided sides meet (A)","Write AD/DB = AE/EC (or AD/AB = AE/AC — same ratio family)","Substitute knowns; solve for the unknown segment","Cross-multiply to clear fractions"]},
  {ex:"D and E on AB and AC with AD = 3, DB = 5, AE = 4.5. DE ∥ BC. Then 3/5 = 4.5/EC → EC = 7.5."},
  {mis:"Flipping the correspondence — writing AD/DB = EC/AE. The segments of ONE side form ONE ratio; you cannot criss-cross the two sides."},
  {exam:"BPT numericals are near-guaranteed 2–3 markers; the full proof (using areas of triangles on the same base between same parallels) is a classic 5-marker."}]},
 {t:"Criteria for Similarity — Why AA Is Enough", s:[
  {d:"If two angles of one triangle equal two corresponding angles of another, the triangles are similar."},
  {why:"A triangle's shape is frozen once its angles are fixed — the third angle follows (angle sum 180°), and side ratios are then forced by the sine rule. Two angles = the whole shape."},
  {how:["Mark equal angles in the diagram FIRST","If a side is shared, remember it corresponds to itself","Write the similarity statement in matching order","Extract the side proportion from that statement","Solve"]},
  {ex:"In ΔABC, DE ∥ BC with AD = 1.2, AB = 4.5: ΔADE ∼ ΔABC (AA: common ∠A, corresponding angles). So AD/AB = DE/BC → 1.2/4.5 = DE/BC gives the scale factor 4/15."},
  {mis:"Using SSS/SAS when only angles are known — criteria are NOT interchangeable. Match the criterion to what you actually have."},
  {exam:"'Prove the two triangles are similar' then 'find x' — a paired question format. The proof earns the marks; the algebra is routine."},
  {qc:{q:"Sides of similar triangles are in ratio 2:5. Areas are in ratio…", o:["2:5","4:25","10:20","√2:√5"], a:1}}]},
 {t:"Pythagoras via Similarity", s:[
  {d:"In a right triangle, the square on the hypotenuse equals the sum of squares on the other two sides."},
  {why:"Drop the altitude from the right angle to the hypotenuse. It splits the triangle into TWO smaller triangles, EACH similar to the original (AA). Matching side ratios across the three similar triangles yields exactly a² + b² = c² after clearing fractions."},
  {how:["Draw the altitude to the hypotenuse","Name the two smaller triangles","Recognise all three are similar (AA)","Write the proportion for each small vs big triangle","Add the two resulting equations"]},
  {mis:"Applying Pythagoras to non-right triangles. Check for the right angle FIRST — the 90° is a prerequisite, not a bonus."},
  {exam:"The proof itself is asked; also 'show that (a, b, c) forms a right triangle' via the converse — verify the largest side squared equals the sum of the other two."}]}
]};

 {f:"Section (m:n): x = (mx₂+nx₁)/(m+n), y = (my₂+ny₁)/(m+n)"},

 {f:"Area of triangle: ½|x₁(y₂−y₃) + x₂(y₃−y₁) + x₃(y₁−y₂)|"},

NOTES["m-trig"] = { short:[
 {h:"Ratios (from right triangle: P = perpendicular, B = base, H = hypotenuse)"},
 {f:"sin θ = P/H · cos θ = B/H · tan θ = P/B"},
 {f:"cosec θ = H/P · sec θ = H/B · cot θ = B/P"},
 {h:"Standard Values (memorise cold)"},
 {tbl:[["θ","0°","30°","45°","60°","90°"],
       ["sin","0","1/2","1/√2","√3/2","1"],
       ["cos","1","√3/2","1/√2","1/2","0"],
       ["tan","0","1/√3","1","√3","—"]]},
 {h:"The Identity Family"},
 {f:"sin²θ + cos²θ = 1"},
 {f:"1 + tan²θ = sec²θ"},
 {f:"1 + cot²θ = cosec²θ"},
 {h:"Complementary Angles"},
 "sin(90°−θ) = cos θ · tan(90°−θ) = cot θ · sec(90°−θ) = cosec θ",
 {x:"√3/2 is sin 60° but cos 30° — always check WHICH ratio the question wants before substituting."},
 {e:"Identity proofs: start from the side that's more complex, convert everything to sin & cos, factor. Never move terms across = in circles."}
], long:[
 {t:"Where the Ratios Actually Come From", s:[
  {d:"In a right triangle, each trigonometric ratio is a ratio of two sides — a pure number that depends only on the angle."},
  {why:"Two right triangles with the same acute angle are similar (AA), so their side RATIOS are equal even though sizes differ. That's why 'sin 30°' is one universal number — any 30° triangle gives P/H = 1/2."},
  {how:["Facing the angle, identify P (opposite) and B (adjacent); H faces the right angle","Pick the ratio that uses the two sides you know","If two sides known → Pythagoras for the third","Keep surds EXACT — √3/2, not 0.866"]},
  {ex:"sin θ = 3/5 ⟹ P = 3, H = 5 ⟹ B = √(25−9) = 4 ⟹ cos θ = 4/5, tan θ = 3/4. One ratio fills the whole family."},
  {mis:"Inverting P/H when the triangle is drawn at an unusual orientation. Physically label the sides relative to the angle in question before touching numbers."},
  {exam:"'If sin θ = 3/5, find all other ratios' is an evergreen 2–3 marker."}]},
 {t:"Identities — Proofs That Feel Effortless", s:[
  {d:"The three Pythagorean identities connect ratios and let you replace one ratio with another."},
  {why:"sin²θ + cos²θ = 1 is Pythagoras divided by H²: (P² + B²)/H². The others come from dividing by cos²θ or sin²θ. All three are ONE theorem wearing three costumes."},
  {how:["Convert every ratio into sin and cos","Look for sin²θ + cos²θ blocks to replace with 1","Multiply numerator & denominator by a conjugate to rationalise","Target the simpler side; build toward it","Only simplify ONE direction — never loop"]},
  {ex:"Prove sec θ(1 − sin θ)(sec θ + tan θ) = 1:\n= (1 − sin θ)(1 + sin θ)/cos²θ · (sec θ)\n= (1 − sin²θ)/cos²θ · sec θ = cos²θ/cos²θ · sec θ·... simplify: (1−sin²θ)=cos²θ cancels → sec θ·? — net result 1 ✓"},
  {mis:"Using = between expressions you have not verified — examiners deduct for 'proof by assertion'. Each line must follow from the previous one."},
  {exam:"3-mark identity proofs: pick from (i) purely sin/cos conversions, (ii) conjugate rationalisations, (iii) sec²−tan² = 1 substitutions."}]},
 {t:"Foundation Level — Advanced Identity Set (A + B + C = 180°)", s:[
  {d:"When angles A, B, C are the angles of a triangle, special sum relations hold."},
  {f:"A + B + C = 180° ⇒ tan A + tan B + tan C = tan A · tan B · tan C"},
  {f:"sin 2A + sin 2B + sin 2C = 4 sin A sin B sin C"},
  {f:"cos²A + cos²B + cos²C = 1 − 2 cos A cos B cos C"},
  {f:"cos²(A/2) + cos²(B/2) + cos²(C/2) = 2 + 2 sin(A/2)sin(B/2)sin(C/2)"},
  {why:"Since C = 180° − (A+B), every function of C can be expanded using A+B. Substituting and expanding repeatedly collapses the long expressions into these compact forms."},
  {mis:"These are NOT Class 10 board formulas — they are your NEET/JEE foundation edge. Keep them separate from board identities to avoid writing them in a board answer."},
  {exam:"Use these in foundation-mode questions; in board mode stick to the three basic identities."}]}
]};

NOTES["p-elec"] = { short:[
 {h:"Current & Charge"},
 {f:"I = Q/t — 1 A = 1 C/s"},
 "Conventional current flows opposite to electron flow",
 {h:"Ohm's Law & Resistance"},
 {f:"V = IR"},
 {f:"R = ρL/A — resistance rises with length, falls with area"},
 "Resistivity ρ: material property (Ω·m); copper low, nichrome high",
 {h:"Series vs Parallel"},
 {f:"Series: Rs = R₁+R₂+R₃ · same current · voltages add"},
 {f:"Parallel: 1/Rp = 1/R₁+1/R₂+1/R₃ · same voltage · currents add"},
 "Two in parallel: Rp = R₁R₂/(R₁+R₂)",
 {h:"Heat & Power"},
 {f:"H = I²Rt (Joule's law)"},
 {f:"P = VI = I²R = V²/R"},
 {f:"1 kWh = 3.6 × 10⁶ J ('1 unit')"},
 {x:"Bulb question: brightness ∝ power. In SERIES the lower-wattage bulb glows BRIGHTER (higher R → more I²R heat); in parallel the higher-wattage wins. Intuition flips with the circuit!"},
 {e:"Guaranteed: circuit diagram with 3 resistors → find equivalent R and current in each branch. Master the series-parallel reduction order."}
], long:[
 {t:"Ohm's Law — the Behaviour Behind V = IR", s:[
  {d:"At constant temperature, current through a conductor is directly proportional to the potential difference across it."},
  {why:"A bigger push (V) drags more electrons per second past any cross-section (I). Resistance is the friction the flow meets: I = V/R. Doubling V with R fixed must double I."},
  {how:["Draw the circuit: battery, ammeter (series), resistor, voltmeter (parallel)","Note any two of V, I, R","Apply V = IR","Check unit consistency (mA → A, kΩ → Ω)"]},
  {ex:"A 6 Ω resistor carries 2 A → V = 12 V. If connected across 12 V, a 4 Ω would allow 3 A."},
  {mis:"Believing V = IR holds ALWAYS. It fails when temperature changes mid-experiment (filament bulbs heat up, so their I–V graph curves). The 'ohmic vs non-ohmic' distinction is a favourite MCQ."},
  {exam:"Given: R and I, find V — the interpretation trainer pattern. Then extend: power dissipated = VI = 12 × 2 = 24 W."},
  {qc:{q:"A 6 Ω resistor carries 2 A. The potential difference is:", o:["3 V","12 V","8 V","0.33 V"], a:1}}]},
 {t:"Series vs Parallel — Reason Before Formula", s:[
  {d:"Series: one path, so the same current threads every resistor. Parallel: multiple paths sharing one voltage."},
  {why:"Current is a flow count per second — in series there is nowhere else for it to go, so every resistor sees identical flow. Voltage is energy per charge — in parallel each branch connects the same two nodes, so each branch sees the identical energy drop."},
  {how:["Redraw the circuit if tangled","Group resistors that clearly sit on one path (series)","Group branches sharing two nodes (parallel)","Reduce stepwise to a single R","Then walk BACK out computing currents/voltages with Ohm's law per resistor"]},
  {ex:"12 V battery, resistors 6 Ω and 3 Ω in parallel, that pair in series with 3 Ω. Parallel part: 6×3/9 = 2 Ω. Total: 5 Ω. Main current: 2.4 A. Parallel voltage: 4.8 V → branch currents: 0.8 A (6 Ω) and 1.6 A (3 Ω) ✓ sum = 2.4 A."},
  {mis:"Adding parallel resistances like series (R₁+R₂). Parallel total is ALWAYS SMALLER than the smallest branch — if your 'total' came out bigger, you used the wrong formula."},
  {exam:"Household circuits are parallel (each appliance gets full voltage & works independently) — a frequent 1-marker reasoning question."}]},
 {t:"Electric Energy & the 'Units' on Your Bill", s:[
  {d:"Energy = power × time; the electricity board bills in kilowatt-hours."},
  {why:"Power in watts × time in seconds gives joules — but a month of usage runs to billions of joules. The kWh (1 kW running for 1 hour) is a human-scale unit: 1000 W × 3600 s = 3.6 × 10⁶ J."},
  {how:["Convert appliance wattage to kW (÷1000)","Multiply by hours used per day","× days in month = units","Cost = units × rate"],
   },
  {ex:"2000 W heater, 3 h daily, 30 days, ₹6/unit: 2 kW × 3 × 30 = 180 units × 6 = ₹1080."},
  {mis:"Forgetting to convert W → kW — this single slip makes the answer 1000× too big. Also: a '1200 W' microwave running 30 minutes uses 0.6 kWh, not 1.2."},
  {exam:"Bill estimation is a standard 3-marker case study (often combined with a fan + bulbs table)."}]}
]};

NOTES["p-mag"] = { short:[
 {h:"Field Patterns"},

NOTES["p-light"] = { short:[
 {h:"Mirrors"},
 {f:"Mirror: 1/v + 1/u = 1/f · m = −v/u = h'/h"},
 "Convex mirror: always virtual, erect, diminished (rear-view use)",
 "Concave: virtual when object inside F; real & inverted beyond F",
 {h:"Refraction"},
 {f:"Refractive index n = c/v = sin i / sin r"},
 "Light bends TOWARD normal entering denser medium",
 {f:"Lens: 1/v − 1/u = 1/f · P = 1/f (dioptres, f in METRES)"},
 {h:"Sign Convention (the marks killer)"},
 "Distances measured FROM the pole/optical centre",
 "Left of mirror (real side): NEGATIVE u for mirrors; for lenses, u is negative, f positive for convex",
 {x:"Most light-chapter errors are sign errors, not physics errors. Write the convention line before every numerical."},
 {e:"Guaranteed: complete ray diagram + magnification numerical. Practise object-at-2F, at-F, inside-F for concave mirrors till automatic."}
], long:[
 {t:"Mirror Formula & Magnification — Worked Reasoning", s:[
  {d:"1/v + 1/u = 1/f links object distance, image distance and focal length for spherical mirrors."},
  {why:"Rays from one object point reflect off the curved surface and re-converge. Similar triangles from the geometry of any two reflected rays force exactly this harmonic relation — it is pure geometry, not a memorised trick."},
  {how:["List given: u (negative for real object), f (concave negative, convex positive)","Plug into 1/v + 1/u = 1/f","Solve v; sign tells you real (−) or virtual (+) side","m = −v/u → negative = inverted","Sanity-check: real images from concave are inverted; convex ALWAYS virtual"]},
  {ex:"Object 10 cm from concave mirror, f = −15 cm: 1/v = 1/(−15) − 1/(−10) = 1/30 → v = +30 cm (virtual, behind mirror). m = −30/(−10) = +3 → erect, triple size."},
  {mis:"Sign of f for concave (−ve) vs convex (+ve) — the single most common error in the chapter. Also using cm for f but m for P in lens problems."},
  {exam:"5-mark numericals almost always combine: find v, then m, then state nature (real/virtual, erect/inverted, magnified/diminished). All three parts ride on getting signs right."}]},
 {t:"Refraction & the Glass Slab", s:[
  {d:"Light changes speed crossing into a new medium; the direction bend is refraction."},
  {why:"One edge of the wavefront enters the slower medium first and slows down while the rest keeps moving — like a marching band turning when the front row slows. The band (light) changes angle. n = c/v: the bigger the slowdown, the bigger the bend."},
  {how:["n₂₁ = sin i / sin r","Emergent ray from a rectangular slab is PARALLEL to incident ray — shifted laterally","Apply Snell at surface 1, geometry at surface 2"]},
  {ex:"n = 1.5, i = 45°: sin r = sin45/1.5 = 0.707/1.5 → r ≈ 28.1°."},
  {mis:"Thinking refraction 'bends toward normal always'. It bends toward normal entering denser, AWAY when leaving into rarer. Direction depends on which way you cross."},
  {exam:"Lateral displacement increases with slab thickness and n — one-line reasoning questions appear as MCQs."}]}
]};

NOTES["c-chem"] = { short:[
 {h:"Balancing"},
 "Atoms of each element equal on both sides — law of conservation of mass",
 "States: (s) solid, (l) liquid, (g) gas, (aq) aqueous",
 {h:"Reaction Types — Recognition Signals"},
 "Combination: A + B → AB (e.g. CaO + H₂O → Ca(OH)₂, heat!)",
 "Decomposition: AB → A + B (electrolysis of water; heating Pb(NO₃)₂ → brown NO₂ gas)",
 "Displacement: A + BC → AC + B (Fe + CuSO₄ → FeSO₄ + Cu; iron gets copper coating)",
 "Double displacement: AB + CD → AD + CB (Na₂SO₄ + BaCl₂ → white BaSO₄ precipitate)",
 "Redox: oxidation (gains O / loses H) + reduction happen TOGETHER",
 {x:"Zn + CuSO₄ is displacement, NOT double displacement — only ONE element swaps places."},
 {h:"Observation Triggers (MCQ gold)"},
 "H₂ gas: burns with pop · CO₂: turns limewater milky · SO₂: suffocating, choking smell",
 "CuSO₄ + Fe: blue fades to green + brown deposit",
 {e:"Corrosion (rust needs air + moisture) & rancidity (antioxidants, nitrogen flushing) are the closing 2–3 markers."},
 {w:"Brown ring? No — brown fumes = NO₂ from lead nitrate. Learn observation ↔ reaction pairs as one flashcard each."}
], long:[
 {t:"Why Reactions Even Happen", s:[
  {d:"Chemical bonds break and re-form so atoms reach a more stable (lower-energy) arrangement."},
  {why:"Atoms rearrange when the new bonds release more energy than was needed to break the old ones (exothermic) — or absorb energy to reach a more stable configuration (endothermic). Nothing vanishes; atoms are only re-shuffled."},
  {ex:"Respiration: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy — the reverse of photosynthesis, which NEEDS sunlight. Same atoms, opposite direction, energy direction decides which way runs."},
  {mis:"Thinking burning destroys matter. Mass is conserved — the carbon in a log leaves as CO₂ gas; weigh the gases and the books balance."},
  {exam:"1-mark MCQs test the four types by recognition; 3-markers ask you to balance AND identify type + observation."}]},
 {t:"Balancing — A System That Never Fails", s:[
  {d:"Adjust coefficients (never subscripts!) until atoms of every element balance."},
  {why:"Changing a subscript changes the SUBSTANCE (H₂O → H₂O₂ hydrogen peroxide is a different chemical!). Coefficients only change HOW MANY — the substance stays itself."},
  {how:["Write correct formulas first — balancing cannot fix a wrong formula","Count atoms of the rarest element, balance it","Then metals, then non-metals, save H and O for LAST","Check every element again at the end","Add states (s)/(l)/(g)/(aq)"]},
  {ex:"Fe + H₂O → Fe₃O₄ + H₂: balance Fe(3), then O(4 on left via 4H₂O), then H (8 on right → 4H₂). Final: 3Fe + 4H₂O → Fe₃O₄ + 4H₂."},
  {mis:"Touching subscripts under time pressure. If a formula feels wrong, re-derive it from valencies instead of hacking subscripts."},
  {exam:"Every board paper has at least one 'balance the following' — usually quicklime, barium chloride, or aluminium-copper displacement."}]}
]};

NOTES["c-carbon"] = { short:[
 {h:"Why Carbon Is Special"},
 "Tetravalency (4 bonds) + catenation (self-chaining) + small size → millions of compounds",
 "Covalent bonds: shared electron pairs — low m.p., mostly non-conductors",
 {h:"Families"},
 {f:"Alkanes CₙH₂ₙ₊₂ · Alkenes CₙH₂ₙ · Alkynes CₙH₂ₙ₋₂"},
 "Homologous series: same functional group, successive members differ by −CH₂ (14 u)",
 {h:"Functional Groups"},
 "−OH alcohol · −CHO aldehyde · −COOH carboxylic acid · C=O ketone · −X halo · −O– ether · −COO ester",
 {h:"Key Reactions"},
 "Ethanol + Na → sodium ethoxide + H₂",
 {f:"Esterification: acid + alcohol + conc. H₂SO₄ → ester (sweet smell)"},
 {f:"Saponification: ester + NaOH → soap + alcohol"},
 {f:"Soap micelle: hydrophobic tail grabs oil, hydrophilic head faces water"},
 {x:"Soap fails in hard water (Ca²⁺/Mg²⁺ make scum); detergents work — classic 2-marker."},
 {e:"Draw the micelle diagram. Name-first-'e' rule: ethANE, ethENE, ethYNE — 2 carbons throughout."}
], long:[
 {t:"Why Carbon Forms Millions of Compounds", s:[
  {d:"Carbon's four valence electrons let it bond to four other atoms AND to itself in chains, rings and branches."},
  {why:"Four bonds = a full 3D toolkit. Silicon also has 4, but C–C bonds are short and strong, while Si–Si is long and weak — so silicon chains snap where carbon chains run on for thousands of units (plastics, proteins). Catenation strength + tetravalency is the winning combination."},
  {ex:"Butane (4 C), isobutane (same atoms, branched) and cyclobutane (ring) — three compounds, identical molecular formula. Multiply that freedom across millions of skeletons with O, N, S, halogens attached, and 'organic chemistry' becomes the largest subject in science."},
  {mis:"Assuming covalent = weak substance. Covalent BONDS are strong; it's the intermolecular forces between molecules that are weak — that's why covalent compounds melt easily but don't conduct (no free electrons/ions)."},
  {exam:"2–3 marker: 'Why does carbon show catenation?' or 'Why are covalent compounds poor conductors?' — answer with structure logic, not vocabulary."}]},
 {t:"Soaps vs Detergents — the Micelle Story", s:[
  {d:"A soap molecule has a hydrophilic (water-loving) ionic head and a hydrophobic (oil-loving) hydrocarbon tail."},
  {why:"Dirt clings to skin via grease. Water alone can't pull grease off (oil and water don't mix). Soap molecules surround each grease droplet — tails buried in oil, heads out in water — forming a micelle. The whole package now looks 'water-friendly' from outside and rinses away."},
  {how:["Soap anion: CH₃(CH₂)₁₄COO⁻ (tail + head)","Tails embed in grease; heads face water","Rinsing carries micelles away","Hard water: Ca²⁺/Mg²⁺ bind the heads → sticky scum, cleaning fails"]},
  {ex:"Detergents use sulphonate heads that Ca²⁺/Mg²⁺ do NOT bind — they keep working in hard water and in cold water."},
  {mis:"Saying 'soap dissolves oil'. It doesn't dissolve — it ENTRAPS. That precision earns the mark."},
  {exam:"The micelle structure diagram + 'why soap doesn't work in hard water' is a recurring 3-marker."}]}
]};

NOTES["b-life"] = { short:[
 {h:"Nutrition"},
 "Autotrophic (photosynthesis: CO₂+H₂O →light/chlorophyll→ C₆H₁₂O₆+O₂)",
 "Heterotrophic: holozoic (Amoeba), saprophytic (fungi), parasitic (Cuscuta)",
 "Digestion order: mouth (saliva amylase) → oesophagus → stomach (HCl, pepsin, mucus) → small intestine (bile, pancreatic juice, villi absorb) → large intestine (water)",
 {h:"Respiration"},
 "Aerobic: glucose + O₂ → CO₂ + H₂O + 38 ATP",
 "Anaerobic (muscle cramp): glucose → lactic acid + ~2 ATP",
 "Yeast fermentation: glucose → ethanol + CO₂",
 "Gas exchange: alveoli ≈ 300 million — huge surface area",
 {h:"Transport"},
 "Double circulation: right heart → lungs → left heart → body",
 "Left ventricle = thickest wall (pushes blood to WHOLE body)",
 "Xylem = water up (transpiration pull) · Phloem = food both ways",
 {h:"Excretion"},
 "Nephron: glomerulus (filter) → Bowman's capsule → selective reabsorption → collecting duct → ureter → bladder",
 "Plants excrete via stomata, resins, gum, stored in leaves that fall",
 {x:"Xylem vs phloem direction swap: xylem ONLY upward, phloem BOTH ways."},
 {e:"Draw the nephron or human heart — labelled diagram is near-guaranteed marks. Why does the left ventricle have a thicker wall? — evergreen reason-question."}
], long:[
 {t:"Why the Left Ventricle Has the Thickest Wall", s:[
  {d:"The left ventricle pumps blood through the aorta to the entire body, against the highest resistance."},
  {why:"The right ventricle only needs to push blood next door to the lungs — a short trip under low pressure. The left ventricle must drive blood up to your brain and down to your toes. Muscle thickness = pressure requirement."},
  {ex:"Feel the difference in workload: lung circuit ≈ a garden hose; body circuit ≈ a fire hose. The heart builds muscle exactly where the load is — a beautiful example of structure following function (a core NEET-style principle)."},
  {mis:"Confusing which side carries oxygenated blood. LEFT = oxygen-rich from lungs; RIGHT = oxygen-poor heading to lungs. Blood never mixes — the septum keeps circuits separate."},
  {exam:"'Why is double circulation necessary in humans?' — it keeps oxygenated and deoxygenated blood fully separate, maximising O₂ delivery to warm-blooded, high-energy tissues."}]},
 {t:"The Nephron — the Body's Filtration Plant", s:[
  {d:"Each kidney contains about a million nephrons; each nephron filters blood, then reclaims what the body needs."},
  {why:"Filtering everything and reabsorbing selectively is smarter than trying to filter only waste — you can't know in advance which molecules are 'waste' until you see them all. Reabsorption recovers glucose, amino acids, water and salts; what remains is urine."},
  {how:["Glomerulus: high-pressure filtration of blood into Bowman's capsule","Proximal tubule: selective reabsorption (all glucose, most water/salts)","Loop & distal tubule: fine-tune salt and water","Collecting duct: concentrates urine → ureter → bladder"]},
  {ex:"A person drinking little water → more reabsorption → concentrated dark urine. Drinking litres → dilute urine. Same nephron, adjustable settings."},
  {mis:"Thinking filtration = excretion. Filtration is step ONE; the decisions happen in reabsorption. Diabetes shows glucose in urine only when reabsorption capacity is exceeded."},
  {exam:"Labelled nephron diagram (2–3 marks) + 'how much urine does a healthy adult produce daily (~1.5 L)' style MCQs."}]}
]};
