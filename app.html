  else{ el.classList.add("wrong"); const p=chRec(_qcCh); p.qc.w++; }
  saveState();
  const msg=document.createElement("div"); msg.className="hint-box"; msg.style.marginTop="8px";
  msg.innerHTML = i===qc.a? "✅ Correct!" : "❌ Not quite — the answer is "+"ABCD"[qc.a]+". "+esc(qc.expl||"");
  box.appendChild(msg);
}
let _qcCh=null;
route("/notes/:ch/:mode", (a)=>{
  const c=chapOf(a.ch); if(!c){nav("/learn");return;}
  _qcCh=a.ch;
  const notes=NOTES[a.ch]||{short:[],long:[]};
  const isShort=a.mode==="short";
  if(isShort && notes.short.length) { const p=chRec(a.ch); p.notesS=true; saveState(); }
  if(!isShort){ const p=chRec(a.ch); p.notesL["overview"]=true; saveState(); }
  let body="";
  if(isShort){
    body = notes.short.length
      ? `<div style="padding-left:4px"><ul style="list-style:none">${notes.short.map(renderNoteItem).join("")}</ul></div>
         <button class="btn primary block" style="margin-top:16px" onclick="reviseNow('${a.ch}')">✅ I've revised this — mark done</button>`
      : emptyNotes();
  } else {
    body = notes.long && notes.long.length
      ? notes.long.map((blk,i)=>`<div class="topic-block">
          <h3><span class="tag-num">${i+1}</span>${esc(blk.t)}</h3>
          ${blk.s.map(sec=>{
            let h="";
            if(sec.d) h+=`<p style="margin:8px 0"><b>What is it?</b> ${sec.d}</p>`;
            if(sec.why) h+=`<div class="why-callout"><b>Why does it work?</b> ${sec.why}</div>`;
            if(sec.how) h+=`<div class="card" style="margin:10px 0;background:var(--surface2)"><b class="small">🪜 How — step by step</b><ol style="margin:8px 0 0 20px">${sec.how.map(s2=>`<li style="margin:5px 0">${s2}</li>`).join("")}</ol></div>`;
            if(sec.terms) h+=`<div style="margin:10px 0">${Object.entries(sec.terms).map(([k,v])=>`<div class="small" style="padding:5px 0"><b class="progress-c">${esc(k)}</b> — ${esc(v)}</div>`).join("")}</div>`;
            if(sec.ex) h+=`<div class="card" style="margin:10px 0"><b class="small">📌 Example</b><div style="margin-top:6px;white-space:pre-line">${sec.ex}</div></div>`;
            if(sec.rw) h+=`<p class="small muted" style="margin:8px 0"><b>🌍 Real world:</b> ${sec.rw}</p>`;
            if(sec.mis) h+=`<div class="mistake-callout"><b>⚠️ Common misconception:</b> ${sec.mis}</div>`;
            if(sec.exam) h+=`<div class="exam-callout"><b>🎓 Exam perspective:</b> ${sec.exam}</div>`;
            if(sec.f) h+=`<div class="formula">${esc(sec.f)}</div>`;
            if(sec.qc){ const qcs = Array.isArray(sec.qc)? sec.qc : [sec.qc]; h+=qcs.map(renderQuickCheck).join(""); }
            return h;}).join("")}
        </div>`).join("")
      : `<div class="card">${noDeepNotes(c)}<div style="overflow:hidden;padding-left:4px"><ul style="list-style:none">${notes.short.map(renderNoteItem).join("")}</ul></div></div>`;
  }
  $("#view").innerHTML = `
  <button class="btn ghost sm" onclick="nav('/learn/ch/${a.ch}')" style="margin-bottom:var(--s4)">← ${esc(c.name)}</button>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:var(--s4)">
    <h1>${isShort?"⚡ Short Notes":"🧠 Long Notes"}</h1>
    <span class="badge ${isShort?'std':'found'}">${isShort?"REVISION MODE":"UNDERSTANDING MODE"}</span>
  </div>
  <p class="muted small" style="margin-bottom:var(--s4)">${isShort?esc(c.name)+" — quick revision":esc(c.name)+" — built for deep understanding"}</p>
  <div class="tab-row">
    <div class="tab ${isShort?'':'active'}" onclick="nav('/notes/${a.ch}/long')">🧠 Long</div>
    <div class="tab ${isShort?'active':''}" onclick="nav('/notes/${a.ch}/short')">⚡ Short</div>
  </div>
  ${body}`;
  $("#hdrTitle").textContent=(isShort?"⚡ ":"🧠 ")+c.name;
});
function emptyNotes(){ return `<div class="empty"><div class="e-ico">📚</div>Short notes for this chapter are being written — use the textbook + concepts list for now.</div>`; }
function noDeepNotes(c){ return `<div class="exam-callout" style="margin-bottom:12px"><b>ℹ️ Deep dive in progress:</b> The full 9-part breakdown for this chapter is being expanded. Meanwhile, here are the complete revision notes with every key point:</div>`; }
function reviseNow(chId){
  const p=chRec(chId); p.rev.r++; saveState();
  scheduleRevision(chId, true);
  toast("🔄 Revision logged — next review scheduled");
}
</script>

<script>
/* ================================================================
   SOLVE — teaches HOW to solve. Guided workflow + hint ladder.
   ================================================================ */
let SOLVE = null; // active solving session
route("/solve", ()=>{
  const chs = SUBJECTS.flatMap(s=>s.chapters.map(c=>({c, s}))).filter(x=>qsFor(x.c.id).length);
  $("#view").innerHTML = `
  <div style="margin-bottom:var(--s4)"><h1>✍️ Solve</h1>
  <p class="muted">Guided problem solving — hints first, answers last.</p></div>
  <div class="card" style="margin-bottom:var(--s5);background:var(--surface2)">
    <b>How it works</b>
    <div class="flow" style="margin-top:10px">
      <span class="f-step">1 · Understand</span><span class="f-arrow">→</span>
      <span class="f-step">2 · Concept</span><span class="f-arrow">→</span>
      <span class="f-step">3 · Method</span><span class="f-arrow">→</span>
      <span class="f-step">4 · Solve</span>
    </div>
  </div>
  <div class="section-title"><h2>Pick a chapter</h2></div>
  ${chs.map(x=>`<div class="row tap" style="margin-bottom:8px" onclick="startSolve('${x.c.id}')">
    <div class="subj-icon" style="background:${x.s.color}22">${x.s.icon}</div>
    <div class="grow"><b>${esc(x.c.name)}</b><div class="small muted">${qsFor(x.c.id).length} guided questions</div></div>
    <span class="faint">→</span></div>`).join("")}
  <div class="section-title"><h2>🧠 Interpretation Trainer</h2></div>
  <button class="btn primary block" onclick="nav('/interpret')">Train 'What is the question asking?'</button>`;
  $("#hdrTitle").textContent="Solve";
});
route("/solve/:ch", ()=>{ startSolve(location.hash.split("/")[2]); });

function startSolve(chId){
  if(chId && !chapOf(chId)) chId=null;
  if(!chId){ nav("/solve"); return; }
  const qs = shuffle(qsFor(chId).map(q=>q.id));
  if(!qs.length){ toast("No questions for this chapter yet"); nav("/solve"); return; }
  SOLVE = { ch:chId, ids:qs, i:0, hints:0, correctCount:0, wrongCount:0 };
  nav("/solve/session");
}
route("/solve/session", ()=>{
  if(!SOLVE){ nav("/solve"); return; }
  const q = QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  if(!q){ solveSummary(); return; }
  const c=chapOf(SOLVE.ch), s=subjOf(SOLVE.ch);
  const revealed = SOLVE.hints;
  $("#view").innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)">
    <span class="small muted">Question ${SOLVE.i+1} of ${SOLVE.ids.length} · ${esc(c.name)}</span>
    <span class="small muted">${DIFF_DOTS[q.d]} ${DIFF_NAME[q.d]}</span>
  </div>
  <div class="pbar" style="margin-bottom:var(--s5)"><div style="width:${Math.round(100*SOLVE.i/SOLVE.ids.length)}%"></div></div>
  <div class="q-card" style="position:relative">
    <button class="flag-btn ${S.bookmarks.some(b=>b.type==="question"&&b.id===q.id)?'on':''}" onclick="toggleBookmark('question','${q.id}','${q.ch}')" aria-label="Bookmark" title="Bookmark">★</button>
    <div class="q-meta"><span class="badge board">🏫 Board</span>${q.found?'<span class="badge found">🧠 Foundation</span>':""}</div>
    <p style="font-size:var(--fs-md);font-weight:600">${esc(q.q)}</p>
    <div id="solveSteps" style="margin-top:var(--s4)"></div>
    <div class="divider"></div>
    <div id="hintArea"></div>
    <div class="btn-row" style="margin-top:var(--s3)">
      ${q.o.length? "":`<button class="btn" onclick="showSelfAssess()">I've solved it — check myself</button>`}
      ${revealed<3? `<button class="btn primary" id="hintBtn" onclick="nextHint()">💡 Hint ${revealed+1}</button>`:""}
      ${q.o.length? `<button class="btn primary" onclick="showOptions()">Choose answer</button>`:""}
      <button class="btn ghost" onclick="showSolution(true)">Skip to solution</button>
    </div>
  </div>`;
  $("#hdrTitle").textContent="Solve";
});
function nextHint(){
  const q=QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  const lvl=SOLVE.hints;
  const labels=["💡 Hint 1 — Direction","🔎 Hint 2 — Method","🧩 Hint 3 — Next step"];
  if(lvl>2) return;
  SOLVE.hints++;
  const h=[q.h1,q.h2,q.h3][lvl];
  $("#hintArea").insertAdjacentHTML("beforeend",`<div class="hint-box"><b>${labels[lvl]}</b><br>${esc(h||"Think about what's given and what's required.")}</div>`);
  if(SOLVE.hints>=3){ const b=$("#hintBtn"); if(b)b.remove(); }
}
function showSelfAssess(){
  openSheet(`
    <h3 style="margin-bottom:10px">How did it go?</h3>
    <p class="small muted" style="margin-bottom:14px">Be honest — this drives your mastery and revision schedule.</p>
    <div class="btn-row">
      <button class="btn success" onclick="selfAssess(true)">✅ I got it right</button>
      <button class="btn danger" onclick="selfAssess(false)">❌ I got it wrong</button>
    </div>`);
}
function selfAssess(ok){
  closeSheet();
  const q=QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  logAnswer(q, ok, "sv");
  SOLVE[ok?"correctCount":"wrongCount"]++;
  showSolution(ok);
}
function showOptions(){
  const q=QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  $("#solveSteps").innerHTML = `<div style="margin-top:8px">${q.o.map((o,i)=>`<button class="opt" onclick="solvePick(${i},this)"><span class="opt-key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
}
function solvePick(i, el){
  const q=QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  const ok = i===q.a;
  el.parentNode.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(j===q.a)b.classList.add("right"); });
  el.classList.add(ok?"right":"wrong");
  logAnswer(q, ok, "sv");
  SOLVE[ok?"correctCount":"wrongCount"]++;
  showSolution(ok, !ok);
}
function showSolution(correct, wasWrong){
  const q=QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  const qEl=$("#solveSteps"); if(!qEl) return;
  let html=`<div class="sol-box">
    <b>${correct?"✅ Nice work":"❌ Let's diagnose"}</b>`;
  if(!correct){
    html+=`<div class="mistake-callout" style="margin-top:8px">
      ${wasWrong? "Possible reasons: you may have used the wrong formula, made a calculation slip, or misread what's asked.":"Self-assessment logged — check the steps below against your working."}
      ${q.concept? "<br><b>Review:</b> "+esc(q.concept):""}
    </div>`;
  }
  html+=`<div style="margin-top:10px"><b>Given:</b> read the question again and list the data</div>`;
  html+=`<div class="sol-step"><b>Concept:</b><span>${esc(q.concept||"—")}</span></div>`;
  if(q.sol && q.sol.length){
    html+=`<div style="margin-top:8px"><b>Solution:</b></div>`+
      q.sol.map((s2,i)=>`<div class="sol-step"><b>${i+1}.</b><span>${esc(s2)}</span></div>`).join("");
  }
  if(q.ans || (q.a>=0 && q.o && q.o.length)){
    const ansTxt = q.o && q.o.length? "ABCD"[q.a]+") "+q.o[q.a] : q.ans;
    html+=`<div class="sol-step" style="margin-top:6px"><b>Answer:</b><span>${esc(ansTxt)}</span></div>`;
  }
  html+=`</div>
  <div class="exam-callout" style="margin-top:10px"><b>🎓 Takeaway:</b> ${esc(q.exp||"")}</div>
  <button class="btn primary block" style="margin-top:14px" onclick="nextSolveQ()">Next question →</button>`;
  $("#hintArea").innerHTML="";
  qEl.insertAdjacentHTML("beforeend", html);
}
function nextSolveQ(){
  SOLVE.i++; SOLVE.hints=0;
  nav("/solve/session");
  if(SOLVE.i>=SOLVE.ids.length){ solveSummary(); }
}
function solveSummary(){
  const c=chapOf(SOLVE.ch);
  const tot=SOLVE.correctCount+SOLVE.wrongCount;
  $("#view").innerHTML=`
  <div class="confetti-ico">${SOLVE.wrongCount===0?"🏆":"📖"}</div>
  <h1 style="text-align:center">Solving complete</h1>
  <p class="muted" style="text-align:center;margin:8px 0 20px">${esc(c.name)}</p>
  <div class="grid-3" style="margin-bottom:var(--s5)">
    <div class="stat"><div class="v">${SOLVE.correctCount}</div><div class="l">Solved</div></div>
    <div class="stat"><div class="v">${SOLVE.wrongCount}</div><div class="l">Missed</div></div>
    <div class="stat"><div class="v">${tot?Math.round(100*SOLVE.correctCount/tot):0}%</div><div class="l">Rate</div></div>
  </div>
  <button class="btn primary block" onclick="nav('/learn/ch/${SOLVE.ch}')">Back to chapter</button>
  <button class="btn ghost block" style="margin-top:10px" onclick="startSolve('${SOLVE.ch}')">Solve again (new order)</button>`;
}

/* log an answer: history + component + adaptive + streak + daily */
function logAnswer(q, correct, comp){
  S.history.push({qid:q.id, correct:!!correct, ts:Date.now(), mode:comp});
  const p=chRec(q.ch); p[comp][correct?"r":"w"]++;
  if(!correct) offerMistakeSave(q);
  recordAdaptive(q.ch, correct);
  touchStreak();
  saveState();
}

/* ---------- MISTAKE NOTEBOOK save prompt ---------- */
function offerMistakeSave(q){
  if(S.mistakes.some(m=>m.qid===q.id && !m.resolved)) return; // already noted
  window._pendingMistake=q;
  setTimeout(()=>{ if(!window._pendingMistake) return;
    openSheet(`
    <h3>❌ Save to Mistake Notebook?</h3>
    <p class="small muted" style="margin:8px 0 14px">Diagnosing mistakes is how you stop repeating them. What type of mistake was it?</p>
    ${["Concept mistake","Formula mistake","Calculation mistake","Reading mistake","Method-selection mistake","Careless mistake","Memory mistake","Unit mistake","Logic mistake"].map((m,i)=>`<button class="chip" style="margin:0 6px 8px 0" onclick="saveMistake(${i})">${m}</button>`).join("")}
    <div style="margin-top:12px"><button class="btn ghost sm" onclick="dismissMistake()">Not now</button></div>`);
  }, 600);
}
function dismissMistake(){ window._pendingMistake=null; closeSheet(); }
function saveMistake(idx){
  const q=window._pendingMistake; if(!q) return;
  const types=["Concept mistake","Formula mistake","Calculation mistake","Reading mistake","Method-selection mistake","Careless mistake","Memory mistake","Unit mistake","Logic mistake"];
  const existing=S.mistakes.find(m=>m.qid===q.id);
  if(existing){ existing.type=types[idx]; }
  else S.mistakes.push({qid:q.id, type:types[idx], ts:Date.now(), resolved:false, ch:q.ch});
  window._pendingMistake=null;
  closeSheet(); saveState();
  toast("📌 Saved to Mistake Notebook");
}

/* ================================================================
   INTERPRETATION TRAINER — 'What is the question asking?'
   ================================================================ */
let INTERP_S=null;
route("/interpret", ()=>{
  $("#view").innerHTML=`
  <div style="margin-bottom:var(--s4)"><h1>🧠 Interpretation Trainer</h1>
  <p class="muted">Read the question. Identify given, required, concept — BEFORE solving.</p></div>
  <button class="btn primary block" onclick="startInterp()">Start training (${INTERP.length} questions)</button>
  <div class="card" style="margin-top:var(--s5);background:var(--surface2)">
  <p class="small muted">Great problem-solvers spend the first 15 seconds understanding, not calculating. Every wrong 'given/required' choice here is a mistake you'll avoid in the real exam.</p></div>`;
  $("#hdrTitle").textContent="Trainer";
});
function startInterp(){
  INTERP_S={order:shuffle(INTERP.map(x=>x.id)), i:0, step:0, right:0, total:0};
  nav("/interpret/session");
}
route("/interpret/session", ()=>{
  if(!INTERP_S){ nav("/interpret"); return; }
  const item=INTERP.find(x=>x.id===INTERP_S.order[INTERP_S.i]);
  if(!item){ interpSummary(); return; }
  const step=item.steps[INTERP_S.step];
  $("#view").innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)">
    <span class="small muted">Case ${INTERP_S.i+1} / ${INTERP_S.order.length}</span>
    <span class="small muted">Step ${INTERP_S.step+1} of ${item.steps.length}</span>
  </div>
  <div class="pbar" style="margin-bottom:var(--s5)"><div style="width:${Math.round(100*INTERP_S.i/INTERP_S.order.length)}%"></div></div>
  <div class="q-card">
    <div class="q-meta"><span class="badge board">🧠 READ BEFORE SOLVING</span></div>
    <p style="font-size:var(--fs-md);font-weight:600">${esc(item.q)}</p>
    <div class="divider"></div>
    <b class="progress-c" style="display:block;margin-bottom:10px">${esc(step.ask)}</b>
    ${step.o.map((o,i)=>`<button class="opt" onclick="interpPick(${i},this)"><span class="opt-key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}
    <div id="interpFb"></div>
  </div>`;
  $("#hdrTitle").textContent="Trainer";
});
function interpPick(i, el){
  const item=INTERP.find(x=>x.id===INTERP_S.order[INTERP_S.i]);
  const step=item.steps[INTERP_S.step];
  const ok=i===step.a;
  INTERP_S.total++; if(ok)INTERP_S.right++;
  el.parentNode.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(j===step.a)b.classList.add("right"); });
  if(!ok) el.classList.add("wrong");
  $("#interpFb").innerHTML=`<div class="hint-box">${ok?"✅":"❌"} ${esc(step.why)}</div>
    <button class="btn primary block" style="margin-top:10px" onclick="interpNext()">${INTERP_S.step<item.steps.length-1?"Next step →":"See full solution →"}</button>`;
}
function interpNext(){
  const item=INTERP.find(x=>x.id===INTERP_S.order[INTERP_S.i]);
  if(INTERP_S.step < item.steps.length-1){
    INTERP_S.step++; nav("/interpret/session");
  } else {
    const c=chapOf(item.ch)||{name:""};
    chRec(item.ch).qc.r++; saveState();
    $("#view").innerHTML=`
    <div class="confetti-ico">🎯</div>
    <h2 style="text-align:center">Question fully decoded</h2>
    <div class="card" style="margin:var(--s5) 0">
      <b>The complete method:</b>
      <div class="sol-box" style="margin-top:10px">${esc(item.final)}</div>
    </div>
    <button class="btn primary block" onclick="interpAdvance()">Next case →</button>`;
  }
}
function interpAdvance(){ INTERP_S.i++; INTERP_S.step=0; nav("/interpret/session"); }
function interpSummary(){
  const pct=INTERP_S.total? Math.round(100*INTERP_S.right/INTERP_S.total):0;
  $("#view").innerHTML=`
  <div class="confetti-ico">${pct>=80?"🏅":"🧠"}</div>
  <h1 style="text-align:center">Interpretation: ${pct}%</h1>
  <p class="muted" style="text-align:center;margin:10px 0 20px">${INTERP_S.right} of ${INTERP_S.total} recognition steps correct</p>
  <p class="small muted" style="text-align:center;margin-bottom:var(--s5)">Notice how the answer 'appeared' once given/required/concept were clear? That's the skill.</p>
  <button class="btn primary block" onclick="startInterp()">Train again</button>
  <button class="btn ghost block" style="margin-top:10px" onclick="nav('/home')">Done</button>`;
}
</script>

<script>
/* ================================================================
   PRACTICE — adaptive sets with filters
   ================================================================ */
let PRAC=null;
route("/practice", ()=>{ practiceConfig(null); });
route("/practice/:ch", (a)=>{ practiceConfig(a.ch); });
function practiceConfig(chId){
  if(chId && !chapOf(chId)) chId=null;
  const chs=SUBJECTS.flatMap(s=>s.chapters.map(c=>({c,s}))).filter(x=>qsFor(x.c.id).length);
  const sel=chId? chs.find(x=>x.c.id===chId):null;
  $("#view").innerHTML=`
  <div style="margin-bottom:var(--s4)"><h1>📝 Practice</h1>
  <p class="muted">Assessment mode — difficulty adapts to your performance.</p></div>
  <div class="card">
    <label class="small" style="font-weight:700;display:block;margin-bottom:6px">Subject & Chapter</label>
    <select class="inp" id="prCh" onchange="prUpdDiff()">
      <option value="">— Choose a chapter —</option>
      ${SUBJECTS.map(s=>`<optgroup label="${esc(s.icon+" "+s.name)}">${s.chapters.map(c=>`<option value="${c.id}" ${chId===c.id?"selected":""}>${esc(c.name)} (${qsFor(c.id).length}Q)</option>`).join("")}</optgroup>`).join("")}
    </select>
    <label class="small" style="font-weight:700;display:block;margin:14px 0 6px">Difficulty</label>
    <div class="chip-row" id="prDiff">
      ${[1,2,3,4].map(d=>`<button class="chip ${d===(chId?adaptiveLevel(chId):S.settings.diffPref)?"sel":""}" data-d="${d}" onclick="prSetDiff(this)">${DIFF_DOTS[d]} ${DIFF_NAME[d]}</button>`).join("")}
    </div>
    <label class="small" style="font-weight:700;display:block;margin:14px 0 6px">Number of questions</label>
    <div class="chip-row" id="prN">
      ${[5,10,20].map(n=>`<button class="chip ${n===10?"sel":""}" data-n="${n}" onclick="prSetN(this)">${n}</button>`).join("")}
    </div>
    <button class="btn primary block" style="margin-top:var(--s5)" onclick="startPractice()">Start Practice</button>
  </div>
  <div class="card" style="margin-top:var(--s4);background:var(--surface2)">
    <p class="small muted">🎯 <b>Adaptive engine:</b> answer 5 in a row well and difficulty rises; struggle and it eases you back to solid ground. Your last level per chapter is remembered.</p>
  </div>`;
  $("#hdrTitle").textContent="Practice";
}
function prSetDiff(el){ el.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel")); el.classList.add("sel"); }
function prSetN(el){ el.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel")); el.classList.add("sel"); }
function prUpdDiff(){
  const chId=$("#prCh").value; if(!chId) return;
  const lvl=adaptiveLevel(chId);
  $$("#prDiff .chip").forEach(c=>c.classList.toggle("sel", +c.dataset.d===lvl));
}
function startPractice(){
  const chId=$("#prCh").value;
  if(!chId){ toast("Pick a chapter first"); return; }
  const d=+($("#prDiff .chip.sel")?.dataset.d || adaptiveLevel(chId));
  const n=+($("#prN .chip.sel")?.dataset.n || 10);
  let pool=qsFor(chId);
  // adaptive: prefer chosen difficulty, widen if short
  let sel=shuffle(pool.filter(q=>q.d===d));
  if(sel.length<n) sel=sel.concat(shuffle(pool.filter(q=>Math.abs(q.d-d)===1)));
  if(sel.length<n) sel=sel.concat(shuffle(pool.filter(q=>Math.abs(q.d-d)>1)));
  sel=sel.slice(0,n);
  if(!sel.length){ toast("No questions available"); return; }
  PRAC={ch:chId, ids:sel.map(q=>q.id), i:0, right:0, wrong:0, t0:Date.now()};
  nav("/practice/session");
}
route("/practice/session", ()=>{
  if(!PRAC){ nav("/practice"); return; }
  const q=QUESTIONS.find(x=>x.id===PRAC.ids[PRAC.i]);
  if(!q){ practiceSummary(); return; }
  const c=chapOf(PRAC.ch);
  $("#view").innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)">
    <span class="small muted">${PRAC.i+1} / ${PRAC.ids.length} · ${esc(c.name)}</span>
    <span class="small muted">${DIFF_DOTS[q.d]} ${DIFF_NAME[q.d]}</span>
  </div>
  <div class="pbar" style="margin-bottom:var(--s5)"><div style="width:${Math.round(100*PRAC.i/PRAC.ids.length)}%"></div></div>
  <div class="q-card" style="position:relative">
    <button class="flag-btn ${S.bookmarks.some(b=>b.type==='question'&&b.id===q.id)?'on':''}" onclick="toggleBookmark('question','${q.id}','${q.ch}')" aria-label="Bookmark">★</button>
    <div class="q-meta"><span class="badge ${DIFF_BADGE[q.d]}">${DIFF_NAME[q.d]}</span><span class="badge ${q.board?'board':'found'}">${q.board?"🏫 Board":"🧠 Foundation"}</span><span class="badge std">${esc(q.ty)}</span></div>
    <p style="font-size:var(--fs-md);font-weight:600">${esc(q.q)}</p>
    ${q.o.length? q.o.map((o,i)=>`<button class="opt" onclick="pracPick(${i},this)"><span class="opt-key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")
      : `<textarea class="inp" id="pracSA" rows="3" placeholder="Work it out on paper, then compare…" style="margin-top:10px"></textarea>
         <button class="btn primary block" style="margin-top:10px" onclick="pracSelf()">Reveal answer</button>`}
    <div id="pracFb"></div>
  </div>`;
  $("#hdrTitle").textContent="Practice";
});
function pracPick(i, el){
  const q=QUESTIONS.find(x=>x.id===PRAC.ids[PRAC.i]);
  const ok=i===q.a;
  el.parentNode.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(j===q.a)b.classList.add("right"); });
  if(!ok) el.classList.add("wrong");
  logAnswer(q, ok, "pr");
  PRAC[ok?"right":"wrong"]++;
  $("#pracFb").innerHTML=pracFeedback(q, ok);
}
function pracSelf(){
  const q=QUESTIONS.find(x=>x.id===PRAC.ids[PRAC.i]);
  $("#pracFb").innerHTML=`
   <div class="sol-box">
     <b>Reference answer</b>
     <div class="sol-step" style="margin-top:6px"><span>${esc(q.ans||"—")}</span></div>
     ${q.sol? q.sol.map((s2,i)=>`<div class="sol-step"><b>${i+1}.</b><span>${esc(s2)}</span></div>`).join(""):""}
   </div>
   <div class="btn-row" style="margin-top:10px">
     <button class="btn success" onclick="pracMark(true)">✅ I was right</button>
     <button class="btn danger" onclick="pracMark(false)">❌ I was wrong</button>
   </div>`;
}
function pracMark(ok){
  const q=QUESTIONS.find(x=>x.id===PRAC.ids[PRAC.i]);
  logAnswer(q, ok, "pr"); PRAC[ok?"right":"wrong"]++;
  $("#pracFb").insertAdjacentHTML("beforeend", pracNextBtn());
}
function pracFeedback(q, ok){
  return `<div class="sol-box">
    ${ok? "✅ <b>Correct!</b>" : "❌ <b>Not quite.</b> Let's diagnose — did you pick the wrong formula, slip in calculation, or misread the ask?"}
    ${q.concept?`<div class="sol-step" style="margin-top:6px"><b>Concept:</b><span>${esc(q.concept)}</span></div>`:""}
    ${q.sol? q.sol.map((s2,i)=>`<div class="sol-step"><b>${i+1}.</b><span>${esc(s2)}</span></div>`).join(""):""}
    ${(q.o&&q.o.length)? `<div class="sol-step"><b>Answer:</b><span>${esc(q.o[q.a])}</span></div>`: `<div class="sol-step"><b>Answer:</b><span>${esc(q.ans||"")}</span></div>`}
  </div>
  <div class="exam-callout" style="margin-top:10px"><b>🎓</b> ${esc(q.exp||"")}</div>`+pracNextBtn();
}
function pracNextBtn(){ return `<button class="btn primary block" style="margin-top:12px" onclick="pracNext()">Next →</button>`; }
function pracNext(){ PRAC.i++; nav("/practice/session"); }
function practiceSummary(){
  const tot=PRAC.right+PRAC.wrong, pct=tot?Math.round(100*PRAC.right/tot):0;
  const c=chapOf(PRAC.ch);
  const mins=Math.max(1,Math.round((Date.now()-PRAC.t0)/60000));
  scheduleRevision(PRAC.ch, pct>=70);
  $("#view").innerHTML=`
  <div class="confetti-ico">${pct>=80?"🏆":pct>=50?"📈":"🌱"}</div>
  <h1 style="text-align:center">${pct}% accuracy</h1>
  <p class="muted" style="text-align:center;margin:8px 0 20px">${PRAC.right} right · ${PRAC.wrong} wrong · ${mins} min</p>
  <div class="card" style="margin-bottom:var(--s5)">
    <b>What this means</b>
    <p class="small muted" style="margin-top:6px">${pct>=80? "Excellent — the adaptive engine has raised your difficulty. Challenge level awaits.": pct>=50? "Solid base. Review the mistakes below, then run another set.":"Back to the short notes first — rebuild the concepts, then return. The difficulty has been eased."}</p>
    <div class="pbar" style="margin-top:10px"><div style="width:${masteryOf(PRAC.ch)}%"></div></div>
    <div class="small muted" style="margin-top:4px">${esc(c.name)} mastery: ${masteryOf(PRAC.ch)}%</div>
  </div>
  ${S.mistakes.filter(m=>m.ch===PRAC.ch).length? `<div class="section-title"><h2>Recent mistakes here</h2></div>`+S.mistakes.filter(m=>m.ch===PRAC.ch).slice(-3).reverse().map(m=>{
    const q=QUESTIONS.find(x=>x.id===m.qid);
    return `<div class="row" style="margin-bottom:8px"><span>❌</span><div class="grow"><div class="small">${esc(q?q.q:"")}</div><div class="small muted">${esc(m.type)} · ${fmtDate(m.ts)}</div></div></div>`;}).join(""):""}
  <button class="btn primary block" onclick="practiceConfig('${PRAC.ch}')">Practice again</button>
  <button class="btn ghost block" style="margin-top:10px" onclick="nav('/learn/ch/${PRAC.ch}')">Back to chapter</button>`;
}

/* ================================================================
   MOCK TESTS — timed, exam mode, full analysis
   ================================================================ */
let MOCK=null, MOCK_TIMER=null;
route("/mock", ()=>{ mockConfig(null); });
route("/mock/:ch", (a)=>{ mockConfig(a.ch); });
function mockConfig(chId){
  if(chId && !chapOf(chId)) chId=null;
  const totalQ=QUESTIONS.length;
  $("#view").innerHTML=`
  <div style="margin-bottom:var(--s4)"><h1>🧪 Mock Test</h1>
  <p class="muted">Exam conditions: timed, no hints, full analysis after.</p></div>
  <div class="card">
    <label class="small" style="font-weight:700;display:block;margin-bottom:6px">Scope</label>
    <select class="inp" id="mkScope">
      <option value="full">Full syllabus (${totalQ} questions available)</option>
      ${SUBJECTS.map(s=>`<option value="subj:${s.id}" ${chId&&subjOf(chId)&&subjOf(chId).id===s.id?"selected":""}>${esc(s.icon+" "+s.name)}</option>`).join("")}
      ${chId? `<option value="ch:${chId}" selected>${esc(chapOf(chId).name)}</option>`:""}
    </select>
    <label class="small" style="font-weight:700;display:block;margin:14px 0 6px">Length</label>
    <div class="chip-row" id="mkN">
      ${[10,20,40].map(n=>`<button class="chip ${n===10?"sel":""}" data-n="${n}" onclick="prSetN(this)">${n}</button>`).join("")}
      <button class="chip" data-n="999" onclick="prSetN(this)">All</button>
    </div>
    <label class="small" style="font-weight:700;display:block;margin:14px 0 6px">Timer</label>
    <div class="chip-row" id="mkT">
      <button class="chip sel" data-t="60" onclick="prSetDiff(this)">60 s / question</button>
      <button class="chip" data-t="90" onclick="prSetDiff(this)">90 s / question</button>
      <button class="chip" data-t="0" onclick="prSetDiff(this)">No timer</button>
    </div>
    <button class="btn primary block" style="margin-top:var(--s5)" onclick="startMock()">Begin Test</button>
  </div>`;
  $("#hdrTitle").textContent="Mock Test";
}
function startMock(){
  const scope=$("#mkScope").value;
  let pool=QUESTIONS.slice();
  if(scope.startsWith("subj:")) pool=pool.filter(q=>subjOf(q.ch).id===scope.split(":")[1]);
  if(scope.startsWith("ch:")) pool=pool.filter(q=>q.ch===scope.split(":")[1]);
  let n=+($("#mkN .chip.sel")?.dataset.n||10);
  if(n===999||n>pool.length) n=pool.length;
  if(!pool.length){ toast("No questions in this scope"); return; }
  const ids=shuffle(pool.map(q=>q.id)).slice(0,n);
  const perQ=+($("#mkT .chip.sel")?.dataset.t||60);
  MOCK={ids, i:0, answers:{}, t0:Date.now(), timeLimit: perQ? perQ*n : 0, perQ, finished:false};
  nav("/mock/session");
  if(MOCK.timeLimit) startMockTimer();
}
function startMockTimer(){
  clearInterval(MOCK_TIMER);
  MOCK_TIMER=setInterval(()=>{
    if(!MOCK||MOCK.finished){ clearInterval(MOCK_TIMER); return; }
    const left=MOCK.timeLimit*1000-(Date.now()-MOCK.t0);
    const el=$("#mkTimer");
    if(el){
      const m=Math.floor(Math.max(0,left)/60000), s2=Math.floor(Math.max(0,left)%60000/1000);
      el.textContent = m+":"+String(s2).padStart(2,"0");
      el.classList.toggle("urgent", left<30000);
    }
    if(left<=0){ clearInterval(MOCK_TIMER); finishMock(true); }
  },500);
}
route("/mock/session", ()=>{
  if(!MOCK){ nav("/mock"); return; }
  if(MOCK.finished){ mockSummary(); return; }
  const q=QUESTIONS.find(x=>x.id===MOCK.ids[MOCK.i]);
  const answered=Object.keys(MOCK.answers).length;
  $("#view").innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)">
    <span class="small muted">${MOCK.i+1} / ${MOCK.ids.length}</span>
    ${MOCK.timeLimit? `<span class="timer-pill" id="mkTimer">⏱ --:--</span>`:`<span class="small muted">no timer</span>`}
    <button class="btn sm danger" onclick="confirmFinishMock()">End</button>
  </div>
  <div class="pbar" style="margin-bottom:var(--s5)"><div style="width:${Math.round(100*MOCK.i/MOCK.ids.length)}%"></div></div>
  <div class="q-card">
    <div class="q-meta"><span class="badge ${DIFF_BADGE[q.d]}">${DIFF_NAME[q.d]}</span><span class="badge ${q.board?'board':'found'}">${q.board?"🏫 Board":"🧠 Foundation"}</span></div>
    <p style="font-size:var(--fs-md);font-weight:600">${esc(q.q)}</p>
    ${q.o.length? q.o.map((o,i)=>`<button class="opt ${MOCK.answers[q.id]===i?"sel":""}" onclick="mockPick(${i})"><span class="opt-key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")
      : `<textarea class="inp" rows="3" placeholder="Answer on paper — self-mark at the end" style="margin-top:10px"></textarea>`}
  </div>
  <div class="btn-row" style="margin-top:var(--s5)">
    <button class="btn ghost" onclick="mockNav(-1)" ${MOCK.i===0?"disabled":""}>← Previous</button>
    ${MOCK.i<MOCK.ids.length-1? `<button class="btn primary" style="flex:1" onclick="mockNav(1)">Next →</button>`:`<button class="btn success" style="flex:1" onclick="confirmFinishMock()">Finish test ✓</button>`}
  </div>`;
  $("#hdrTitle").textContent="Mock Test";
});
function mockPick(i){
  MOCK.answers[QUESTIONS.find(x=>x.id===MOCK.ids[MOCK.i]).id]=i;
  $$(".opt").forEach((b,j)=>b.classList.toggle("sel", j===i));
}
function mockNav(dir){ MOCK.i=Math.max(0,Math.min(MOCK.ids.length-1,MOCK.i+dir)); nav("/mock/session"); }
function confirmFinishMock(){
  openSheet(`<h3>Finish the test?</h3><p class="small muted" style="margin:8px 0 14px">${Object.keys(MOCK.answers).length} of ${MOCK.ids.length} answered.</p>
  <div class="btn-row"><button class="btn success" onclick="finishMock()">Yes, submit</button><button class="btn ghost" onclick="closeSheet()">Keep going</button></div>`);
}
function finishMock(timeUp){
  closeSheet();
  MOCK.finished=true; clearInterval(MOCK_TIMER);
  const secs=Math.round((Date.now()-MOCK.t0)/1000);
  let right=0,wrong=0,unanswered=0;
  const byCh={}, byMistake={};
  for(const id of MOCK.ids){
    const q=QUESTIONS.find(x=>x.id===id);
    const a=MOCK.answers[id];
    const rec=byCh[q.ch]||(byCh[q.ch]={r:0,w:0});
    if(a===undefined){ unanswered++; continue; }
    if(a===q.a){ right++; rec.r++; const p=chRec(q.ch); p.mk.r++; }
    else{ wrong++; rec.w++; const p=chRec(q.ch); p.mk.w++;
      if(q.mis) byMistake[q.mis]=(byMistake[q.mis]||0)+1; }
    S.history.push({qid:id, correct:a===q.a, ts:Date.now(), mode:"mk"});
  }
  saveState();
  MOCK.result={right,wrong,unanswered,secs,byCh,byMistake,timeUp:!!timeUp};
  touchStreak();
  for(const ch of Object.keys(byCh)) scheduleRevision(ch, byCh[ch].r>=byCh[ch].w);
  nav("/mock/session");
}
function mockSummary(){
  const R=MOCK.result;
  const tot=R.right+R.wrong+R.unanswered;
  const acc=R.right+R.wrong? Math.round(100*R.right/(R.right+R.wrong)):0;
  const perQ=R.secs/tot;
  const strong=Object.entries(R.byCh).filter(([k,v])=>v.r>v.w).map(([k])=>chapOf(k).name);
  const weak=Object.entries(R.byCh).filter(([k,v])=>v.w>=v.r).map(([k])=>chapOf(k).name);
  const topMistakes=Object.entries(R.byMistake).sort((a,b)=>b[1]-a[1]).slice(0,3);
  $("#view").innerHTML=`
  <div class="confetti-ico">${acc>=80?"🏆":acc>=50?"📈":"🌱"}</div>
  <h1 style="text-align:center">${R.right} / ${tot}</h1>
  <p class="muted" style="text-align:center;margin:6px 0 20px">${acc}% accuracy · ${Math.round(perQ)}s per question ${R.timeUp?"· ⏰ time ran out":""}</p>
  <div class="grid-3" style="margin-bottom:var(--s5)">
    <div class="stat"><div class="v" style="color:var(--success)">${R.right}</div><div class="l">Correct</div></div>
    <div class="stat"><div class="v" style="color:var(--danger)">${R.wrong}</div><div class="l">Wrong</div></div>
    <div class="stat"><div class="v" style="color:var(--text3)">${R.unanswered}</div><div class="l">Skipped</div></div>
  </div>
  ${strong.length?`<div class="card" style="margin-bottom:10px"><b style="color:var(--success)">💪 Strong areas</b><p class="small muted" style="margin-top:4px">${strong.map(esc).join(", ")}</p></div>`:""}
  ${weak.length?`<div class="card" style="margin-bottom:10px"><b style="color:var(--warn)">⚠️ Weak areas</b><p class="small muted" style="margin-top:4px">${weak.map(esc).join(", ")}</p></div>`:""}
  ${topMistakes.length?`<div class="card" style="margin-bottom:10px"><b>🔍 Mistake pattern</b><p class="small muted" style="margin-top:4px">${topMistakes.map(([m,n])=>esc(m)+" ×"+n).join(" · ")}</p></div>`:""}
  <div class="card" style="background:var(--surface2)"><b>📋 Recommended next step</b>
    <p class="small muted" style="margin-top:4px">${weak.length? "Revise short notes for "+esc(weak[0])+", then re-run a chapter test.":"Raise difficulty in practice mode or try a full-syllabus mock."}</p>
  </div>
  <button class="btn primary block" style="margin-top:var(--s5)" onclick="nav('/mock')">New test</button>
  <button class="btn ghost block" style="margin-top:10px" onclick="nav('/home')">Home</button>`;
}
</script>

<script>
/* ================================================================
   BOOKMARKS
   ================================================================ */
function toggleBookmark(type, id, ch){
  const idx=S.bookmarks.findIndex(b=>b.type===type&&b.id===id);
  let label;
  if(type==="question"){ const q=QUESTIONS.find(x=>x.id===id); label=q? q.q.slice(0,90):id; }
  else label=id;
  if(idx>=0){ S.bookmarks.splice(idx,1); toast("Removed from Saved"); }
  else{ S.bookmarks.push({type, id, label, ch}); toast("⭐ Saved"); }
  saveState(); updateBmIcons();
}
function updateBmIcons(){
  $$(".flag-btn").forEach(b=>{
    // question flags handled via class on render; nothing needed here for now
  });
  S.bookmarks.filter(b=>b.type==="concept").forEach(b=>{
    const el=document.getElementById("bm-c-"+hashId(b.id));
    if(el) el.textContent="★";
  });
}
route("/saved", ()=>{
  if(!S.bookmarks.length){
    $("#view").innerHTML=`<div class="empty"><div class="e-ico">⭐</div><h2>Nothing saved yet</h2><p class="small" style="margin-top:8px">Tap the ★ on any question or concept to bookmark it.</p></div>`;
  } else {
    $("#view").innerHTML=`<h1 style="margin-bottom:var(--s5)">⭐ Saved</h1>`+
      S.bookmarks.map(b=>{
        const c=chapOf(b.ch);
        if(b.type==="question"){
          const q=QUESTIONS.find(x=>x.id===b.id);
          return `<div class="card tap" style="margin-bottom:10px" onclick="reviewSavedQ('${b.id}')">
            <div class="small muted" style="margin-bottom:6px">${c?esc(c.name):""}</div>${esc(b.label)}…</div>`;
        }
        return `<div class="card" style="margin-bottom:10px"><span class="badge std">concept</span>
          <div style="margin-top:6px">${esc(b.label)}</div>
          <div class="small muted" style="margin-top:4px">${c?esc(c.name):""}</div></div>`;
      }).join("");
  }
  $("#hdrTitle").textContent="Saved";
});
function reviewSavedQ(qid){
  const q=QUESTIONS.find(x=>x.id===qid); if(!q) return;
  openSheet(`<div class="q-meta"><span class="badge ${DIFF_BADGE[q.d]}">${DIFF_NAME[q.d]}</span></div>
    <p style="font-weight:600;margin:10px 0">${esc(q.q)}</p>
    ${q.o.length? q.o.map((o,i)=>`<div class="opt ${i===q.a?'right':''}" style="cursor:default"><span class="opt-key">${"ABCD"[i]}</span><span>${esc(o)}</span></div>`).join(""):`<div class="sol-box"><b>Answer:</b> ${esc(q.ans||"")}</div>`}
    <div class="sol-box" style="margin-top:10px">${(q.sol||[]).map((s2,i)=>`<div class="sol-step"><b>${i+1}.</b><span>${esc(s2)}</span></div>`).join("")}</div>
    <button class="btn ghost block" style="margin-top:10px" onclick="closeSheet()">Close</button>`);
}

/* ================================================================
   MISTAKE NOTEBOOK
   ================================================================ */
route("/mistakes", ()=>{
  const ms=S.mistakes.slice().reverse();
  const open=ms.filter(m=>!m.resolved), done=ms.filter(m=>m.resolved);
  $("#view").innerHTML=`
  <div style="margin-bottom:var(--s4)"><h1>❌ Mistake Notebook</h1>
  <p class="muted">${open.length} to revisit · ${done.length} conquered</p></div>
  ${!ms.length? `<div class="empty"><div class="e-ico">🎯</div>No mistakes logged yet.<br><span class="small">When you answer wrong in Solve or Practice, you'll be asked to classify the mistake here.</span></div>`:""}
  ${open.map((m,i)=>{
    const q=QUESTIONS.find(x=>x.id===m.qid); const c=chapOf(m.ch);
    return `<div class="card" style="margin-bottom:10px">
      <div class="q-meta"><span class="badge chal">${esc(m.type)}</span><span class="badge std">${c?esc(c.name):""}</span><span class="small faint">${fmtDate(m.ts)}</span></div>
      <p style="font-weight:550">${esc(q?q.q:"")}</p>
      ${q? `<div class="small" style="margin-top:8px"><span class="muted">Correct answer:</span> <b>${esc(q.o&&q.o.length? "ABCD"[q.a]+") "+q.o[q.a] : q.ans||"—")}</b></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn sm" onclick="reviewSavedQ('${q.id}')">View solution</button>
        <button class="btn sm success" onclick="resolveMistake('${q.id}',true)">✓ Mastered</button>
      </div>`:""}
    </div>`;}).join("")}
  ${done.length? `<div class="section-title"><h2>Conquered</h2></div>`+done.map(m=>{
    const q=QUESTIONS.find(x=>x.id===m.qid);
    return `<div class="row" style="margin-bottom:8px;opacity:.6"><span>✅</span><div class="grow"><div class="small">${esc(q?q.q.slice(0,80):"")}</div><div class="small muted">${esc(m.type)}</div></div>
    <button class="btn sm ghost" onclick="resolveMistake('${q? q.id:""}',false)">Reopen</button></div>`;}).join(""):""}`;
  $("#hdrTitle").textContent="Mistakes";
});
function resolveMistake(qid, ok){
  const m=S.mistakes.find(x=>x.qid===qid); if(!m) return;
  m.resolved=ok; saveState(); render();
}

/* ================================================================
   SMART REVISION
   ================================================================ */
route("/revision", ()=>{
  const due=revisionsDue();
  const upcoming=Object.keys(S.revision).filter(k=>{
    const c=chapOf(k); return c && S.revision[k].next>Date.now() && masteryOf(k)>0;
  }).sort((a,b)=>S.revision[a].next-S.revision[b].next);
  const REV_LABEL=["Today","Tomorrow","in 3 days","in 7 days","in 2 weeks","in a month"];
  $("#view").innerHTML=`
  <div style="margin-bottom:var(--s4)"><h1>🔄 Smart Revision</h1>
  <p class="muted">Spaced repetition: Today → 1 → 3 → 7 → 14 → 30 days.</p></div>

/* ================================================================

   ================================================================ */
const LAB=[
 {icon:"🔌", t:"Why does current flow?", ch:"p-elec", body:["Observation: flip a switch and the bulb glows instantly.","Concept: potential difference pushes free electrons through the conductor.","Mechanism: the battery's chemical energy creates a V between terminals; inside the wire, a tiny electric field nudges EVERY free electron almost simultaneously — that's why light is instant even though individual electrons drift slower than a snail.","Evidence: drift velocity is ~mm per second, yet the lamp lights instantly — the FIELD travels, not the electrons.","Application: this is why electricity grid timing works across thousands of km."]},
 {icon:"🧲", t:"Why does the sky appear blue?", ch:"p-eye", body:["Observation: clear sky is blue; sunsets are red.","Concept: Rayleigh scattering — shorter wavelengths scatter far more.","Mechanism: air molecules scatter incoming sunlight in all directions; scattering strength goes as 1/λ⁴, so blue (short λ) scatters ~5.5× more than red.","Evidence: at sunset, light crosses a much thicker slice of atmosphere — blue is scattered away entirely before reaching your eye, leaving red.","Application: why the sky on Mars (thin atmosphere) looks butterscotch, not blue."]},
 {icon:"🪨", t:"Why does iron rust?", ch:"c-chem", body:["Observation: iron gates develop reddish-brown flakes; aluminium doesn't.","Concept: oxidation of iron in the presence of BOTH air and moisture.","Mechanism: Fe loses electrons to oxygen forming hydrated iron(III) oxide; the flaky layer doesn't protect the metal beneath, so rusting continues inward.","Evidence: iron in dry air or boiled water (no O₂) doesn't rust — both agents are necessary.","Application: galvanisation (zinc coat) and alloying (stainless steel + Cr) block the reaction."]},
 {icon:"🫀", t:"Why does the heart have four chambers?", ch:"b-life", body:["Observation: fish have 2 chambers, frogs 3, birds and mammals 4.","Concept: separation of oxygenated and deoxygenated blood.","Mechanism: warm-blooded animals need high, constant O₂ supply. Four chambers (and double circulation) never let oxygen-rich blood dilute with used blood, maximising delivery to tissues.","Evidence: crocodiles — the one cold-blooded 4-chambered animal — share ancestry with birds; heart structure tracks metabolic demand.","Application: understanding heart septum defects (hole in the heart) becomes obvious: mixing blood = low O₂ delivery."]},
 {icon:"⚛️", t:"Why are carbon compounds so numerous?", ch:"c-carbon", body:["Observation: known carbon compounds outnumber all other elements' compounds combined.","Concept: tetravalency + catenation.","Mechanism: 4 valence electrons → 4 strong covalent bonds in EVERY direction; C–C bond (~347 kJ/mol) is strong enough for chains thousands of atoms long, plus rings and branches.","Evidence: silicon also has 4 valence electrons but Si–Si bonds are weaker and longer — silanes max out around Si₆.","Application: the entire existence of plastics, fuels, fabrics, food and life itself rests on this one atom's bonding habits."]},
 {icon:"🪞", t:"Why does a mirror form an image?", ch:"p-light", body:["Observation: you see 'yourself' behind the glass.","Concept: specular reflection — smooth surfaces reflect light rays in an ordered way.","Mechanism: parallel rays hitting the smooth surface bounce back at equal angles; your brain traces the reflected rays backwards in straight lines and 'sees' an image where they appear to meet.","Evidence: the image is exactly as far behind the mirror as you are in front — measure it yourself.","Application: periscopes, kaleidoscopes, and rear-view mirror design all follow the same law (angle i = angle r)."]},
 {icon:"🧼", t:"Why does soap clean?", ch:"c-carbon", body:["Observation: water alone leaves grease; add soap and it lifts off.","Concept: micelle formation by amphiphilic molecules.","Mechanism: each soap molecule has an ionic head (loves water) and a hydrocarbon tail (loves grease). Hundreds surround a grease droplet, tails inward, forming a micelle that water can wash away.","Evidence: soap lowers water's surface tension — drops spread instead of bead on oily surfaces.","Application: the same tail-in, head-out architecture is how your cell membranes are built."]}
];

route("/search", ()=>{
  $("#view").innerHTML=`
  <h1 style="margin-bottom:var(--s4)">🔍 Search</h1>
  <div class="search-bar">
    <span class="muted">🔎</span>
    <input id="searchInp" type="search" placeholder="Ohm's law, trigonometry, scum, villi…" aria-label="Search" autofocus>
  </div>
  <div id="searchResults"><div class="empty"><div class="e-ico">⌨️</div>Type to search subjects, chapters, notes, questions and mistakes.</div></div>`;
  $("#hdrTitle").textContent="Search";
  const inp=$("#searchInp");
  inp.addEventListener("input", ()=>{
    const q=inp.value.trim().toLowerCase();
    const out=$("#searchResults");
    if(q.length<2){ out.innerHTML='<div class="empty"><div class="e-ico">⌨️</div>Keep typing…</div>'; return; }
    const hits=[];
    for(const s of SUBJECTS){
      if(s.name.toLowerCase().includes(q)) hits.push({icon:s.icon, t:s.name, sub:"Subject", go:`/learn/${s.id}`});
      for(const c of s.chapters){
        if(c.name.toLowerCase().includes(q)) hits.push({icon:s.icon, t:c.name, sub:s.name+" · chapter", go:`/learn/ch/${c.id}`});
        const notes=NOTES[c.id];
        if(notes&&notes.short){
          for(const it of notes.short){
            const txt=typeof it==="string"? it : (it.f||it.h||it.e||it.x||it.w||"");
            if(txt && txt.toLowerCase().includes(q)) hits.push({icon:"⚡", t:txt.slice(0,100), sub:c.name+" · short notes", go:`/notes/${c.id}/short`});
          }
        }
      }
    }
    for(const q2 of QUESTIONS){
      if(q2.q.toLowerCase().includes(q)) hits.push({icon:"✍️", t:q2.q.slice(0,100), sub:(chapOf(q2.ch)||{}).name+" · question", go:`/solve/${q2.ch}`});
    }
    for(const m of S.mistakes){
      const q3=QUESTIONS.find(x=>x.id===m.qid);
      if(q3&&q3.q.toLowerCase().includes(q)) hits.push({icon:"❌", t:q3.q.slice(0,100), sub:(chapOf(m.ch)||{}).name+" · mistake", go:`/mistakes`});
    }
    const uniq=[]; const seen={};
    for(const h of hits){ if(!seen[h.t]){ seen[h.t]=1; uniq.push(h);} if(uniq.length>=20) break; }
    out.innerHTML = uniq.length? uniq.map(h=>`<div class="row tap" style="margin-bottom:8px" onclick="nav('${h.go}')">
        <span style="font-size:1.2rem">${h.icon}</span>
        <div class="grow"><div class="small" style="font-weight:600">${esc(h.t)}</div><div class="small muted">${esc(h.sub)}</div></div>
      </div>`).join("")
      : `<div class="empty"><div class="e-ico">🤷</div>No matches for "${esc(q)}".</div>`;
  });
});

function toggleTheme(el){
  const dark = document.documentElement.getAttribute("data-theme")==="dark";
  S.settings.theme = dark? "light":"dark";
  applyTheme(); saveState(); render();
}
function exportData(){
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="ilk-study-lab-backup-"+todayKey()+".json";
  a.click();
  toast("Backup downloaded");
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result);
      if(!data.settings||!data.progress) throw 0;
      S=data; saveState(); applyTheme(); toast("Progress restored ✓"); nav("/home"); render();
    }catch(e){ toast("Invalid backup file"); } };
  r.readAsText(f);
}
function confirmReset(){
  openSheet(`<h3>⚠️ Reset everything?</h3>
  <p class="small muted" style="margin:8px 0 14px">All progress, mistakes, bookmarks and revision schedules will be permanently deleted.</p>
  <div class="btn-row"><button class="btn danger" onclick="doReset()">Yes, delete all</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);
}
function doReset(){
  localStorage.removeItem(LS_KEY);
  S=loadState(); applyTheme(); closeSheet(); nav("/home"); render();
  toast("Fresh start 🌱");
}
