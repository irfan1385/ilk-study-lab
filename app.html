{id:"q-q3", ch:"m-quad", d:2, ty:"MCQ", q:"The discriminant of 2x² − 4x + 1 = 0 is:", o:["8","−8","4","12"], a:0, concept:"D = b² − 4ac", mis:"Calculation mistake", h1:"a = 2, b = −4, c = 1.", h2:"D = 16 − 8.", h3:"D = 8 → two distinct real roots.", sol:["D = (−4)² − 4(2)(1)","= 16 − 8 = 8"], exp:"D > 0 here, so the equation has two distinct real roots — state the nature when asked.", board:true},
{id:"q-q4", ch:"m-quad", d:4, ty:"NUM", q:"A train travels 360 km at a uniform speed. If the speed were 5 km/h more, the journey would take 1 hour less. Find the speed of the train.", o:[], a:-1, ans:"40 km/h", concept:"Speed–time modelling", mis:"Method-selection mistake", h1:"Time = distance/speed. Write both times.", h2:"360/v − 360/(v+5) = 1.", h3:"Multiply through by v(v+5) → 360(v+5) − 360v = v² + 5v → 1800 = v² + 5v.", sol:["360/v − 360/(v+5) = 1","× v(v+5): 360(v+5) − 360v = v(v+5)","1800 = v² + 5v","v² + 5v − 1800 = 0","(v + 45)(v − 40) = 0","v = 40 (reject −45)","Speed = 40 km/h (check: 9h vs 8h ✓)"], exp:"The classic board 5-marker. The rejection line for v = −45 is worth a mark by itself.", board:true},
{id:"q-q5", ch:"m-quad", d:3, ty:"MCQ", q:"If x = 3 is a root of x² − kx + 12 = 0, then k equals:", o:["7","−7","4","12"], a:0, concept:"Root substitution", mis:"Careless mistake", h1:"Substitute x = 3 into the equation.", h2:"9 − 3k + 12 = 0.", h3:"21 = 3k → k = 7.", sol:["3² − 3k + 12 = 0","21 = 3k","k = 7"], exp:"One substitution, one linear equation — never overthink a root question.", board:true},
/* ---------- MATHS: AP ---------- */
{id:"q-a1", ch:"m-ap", d:3, ty:"NUM", q:"In an AP with a = 7, aₙ = 84 and Sₙ = 2093/2, find n.", o:[], a:-1, ans:"23", concept:"Sₙ = n/2(a + aₙ)", mis:"Formula mistake", h1:"You know the first term AND the nth term — which Sₙ form avoids d?", h2:"Sₙ = n/2(a + aₙ) = n/2(7 + 84) = 91n/2.", h3:"91n/2 = 2093/2 → n = 2093/91 = 23.", sol:["Sₙ = n/2(a + aₙ)","n/2(91) = 2093/2","91n = 2093","n = 23"], exp:"From your 2024 board paper (Q4). Using n/2(a + aₙ) skips finding d entirely.", board:true},
{id:"q-a2", ch:"m-ap", d:2, ty:"MCQ", q:"The 10th term of the AP 2, 7, 12, … is:", o:["52","47","57","42"], a:1, concept:"aₙ = a + (n−1)d", mis:"Calculation mistake", h1:"First find d.", h2:"d = 5.", h3:"a₁₀ = 2 + 9×5 = 47.", sol:["a = 2, d = 5","a₁₀ = 2 + (10−1)5 = 2 + 45 = 47"], exp:"n − 1, not n — the most common AP slip.", board:true},
/* ---------- MATHS: TRIANGLES (from your bank) ---------- */
{id:"q-t1", ch:"m-tri", d:2, ty:"MCQ", q:"In ΔABC, DE ∥ BC with AD = 2 cm, DB = 3 cm, AE = 4 cm. Then EC equals:", o:["5 cm","6 cm","6.5 cm","4.5 cm"], a:1, concept:"Basic Proportionality Theorem", mis:"Formula mistake", h1:"A parallel line cutting two sides means the segments are proportional.", h2:"AD/DB = AE/EC.", h3:"2/3 = 4/EC → EC = 6.", sol:["By BPT: AD/DB = AE/EC","2/3 = 4/EC","EC = (3×4)/2 = 6 cm"], exp:"BPT numericals are near-guaranteed. Keep the SAME-side ratios — never criss-cross.", board:true},
{id:"q-t2", ch:"m-tri", d:3, ty:"MCQ", q:"If ΔABC ∼ ΔDEF with area(ABC) : area(DEF) = 9 : 16, then AB : DE equals:", o:["3 : 4","9 : 16","4 : 3","81 : 256"], a:0, concept:"Area ratio = k²", mis:"Concept mistake", h1:"How are area ratios related to side ratios?", h2:"Areas scale as the SQUARE of side ratio.", h3:"k² = 9/16 → k = 3/4.", sol:["area ratio = k² where k = side ratio","9/16 = (3/4)²","AB/DE = 3/4"], exp:"Square root the area ratio to get the side ratio — and square the side ratio for areas.", board:true},
{id:"q-t3", ch:"m-tri", d:3, ty:"SA", q:"In a right triangle, the sides are 8 cm, 15 cm and 17 cm. Verify that these form a right triangle, and name the hypotenuse.", o:[], a:-1, ans:"17 cm (64 + 225 = 289)", concept:"Pythagoras converse", mis:"Concept mistake", h1:"The largest side must satisfy c² = a² + b².", h2:"Check 17² vs 8² + 15².", h3:"64 + 225 = 289 = 17² ✓.", sol:["Largest side = 17","8² + 15² = 64 + 225 = 289","17² = 289 ✓ right angle opposite 17","Hypotenuse = 17 cm"], exp:"Converse questions just need the arithmetic check plus a conclusion sentence.", board:true},
{id:"q-t4", ch:"m-tri", d:4, ty:"SA", q:"D and E are points on sides AB and AC of ΔABC such that AD/DB = AE/EC = 3/4. If BC = 21 cm, find DE.", o:[], a:-1, ans:"9 cm", concept:"BPT converse → similarity → parallel scaling", mis:"Method-selection mistake", h1:"Equal ratios on both sides — what does the converse of BPT give you?", h2:"DE ∥ BC, so ΔADE ∼ ΔABC (AA).", h3:"AD/AB = 3/7 → DE/BC = 3/7 → DE = 9.", sol:["AD/DB = AE/EC ⇒ DE ∥ BC (converse of BPT)","ΔADE ∼ ΔABC (AA — common ∠A, equal corresponding angles)","AD/AB = 3/(3+4) = 3/7","DE/BC = 3/7 ⇒ DE = (3/7)×21 = 9 cm"], exp:"Two-step chain: converse of BPT for parallelism, then AA similarity for the scale factor. This combined reasoning is what 3–4 markers reward.", board:true, found:true},
{id:"q-t5", ch:"m-tri", d:2, ty:"MCQ", q:"Two triangles are similar if:", o:["their areas are equal","their corresponding angles are equal","their sides are equal","they are both equilateral"], a:1, concept:"Definition of similarity", mis:"Concept mistake", h1:"Equal areas or equal sides give congruence-flavoured facts — what does similar need?", h2:"Similar = same SHAPE.", h3:"Same shape ⇔ equal corresponding angles (AA) or proportional sides (SSS/SAS).", sol:["Similar requires equal corresponding angles (and hence proportional sides)","Equal sides/areas alone is congruence, which is stronger"], exp:"Equiangular ⟺ similar is the definitional MCQ from your SelfStudys revision.", board:true},
/* ---------- MATHS: TRIGONOMETRY ---------- */
{id:"q-g1", ch:"m-trig", d:2, ty:"MCQ", q:"If sin θ = 3/5, then cos θ equals:", o:["3/4","4/5","5/4","4/3"], a:1, concept:"Pythagoras + ratio definition", mis:"Concept mistake", h1:"sin θ = P/H = 3/5 — build the right triangle.", h2:"P = 3, H = 5 → B = ?", h3:"B = 4 → cos θ = B/H = 4/5.", sol:["sin θ = P/H = 3/5 ⇒ P = 3, H = 5","B = √(5² − 3²) = 4","cos θ = B/H = 4/5"], exp:"The 3-4-5 triangle solves the whole family: tan θ = 3/4, cosec θ = 5/3, and so on.", board:true},
{id:"q-g2", ch:"m-trig", d:3, ty:"SA", q:"Prove that (sin θ + cosec θ)² + (cos θ + sec θ)² = 7 + tan²θ + cot²θ.", o:[], a:-1, ans:"—", concept:"Identity proof", mis:"Method-selection mistake", h1:"Expand the left side squares first.", h2:"sin² + cosec² + 2·sin·cosec = sin² + cosec² + 2 (since sin·cosec = 1).", h3:"Group as (sin² + cos²) + (cosec² + sec²) + 4 and use the two identities.", sol:["LHS = sin²θ + cosec²θ + 2 + cos²θ + sec²θ + 2","= (sin²θ + cos²θ) + (cosec²θ + sec²θ) + 4","= 1 + (1 + cot²θ) + (1 + tan²θ) + 4","= 7 + tan²θ + cot²θ = RHS ✓"], exp:"Cross-terms always reduce via sin·cosec = 1 — spot them before expanding anything else.", board:true},
{id:"q-g3", ch:"m-trig", d:2, ty:"MCQ", q:"The value of sin 30° · cos 60° + cos 30° · sin 60° is:", o:["1","√3/2","1/2","0"], a:0, concept:"Standard values + recognition", mis:"Careless mistake", h1:"Substitute the standard values first.", h2:"= (1/2)(1/2) + (√3/2)(√3/2).", h3:"= 1/4 + 3/4 = 1 (it's sin(30°+60°) = sin 90° = 1).", sol:["(1/2)(1/2) + (√3/2)(√3/2)","= 1/4 + 3/4 = 1"], exp:"If you know the addition formula sin(A+B), you get this instantly — that is the foundation-level shortcut.", board:true, found:true},
{id:"q-g4", ch:"m-trig", d:3, ty:"NUM", q:"If tan θ = 1, then the value of (sin θ + cos θ) is:", o:[], a:-1, ans:"√2", concept:"Standard angle recognition", mis:"Memory mistake", h1:"tan θ = 1 at which standard angle?", h2:"θ = 45° → sin = cos = 1/√2.", h3:"Sum = 2/√2 = √2.", sol:["tan θ = 1 ⇒ θ = 45°","sin 45° + cos 45° = 1/√2 + 1/√2","= 2/√2 = √2"], exp:"Recognising tan θ = 1 as 45° is the whole question — values first, algebra later.", board:true},
/* ---------- MATHS: PROBABILITY ---------- */
{id:"q-pr1", ch:"m-prob", d:1, ty:"MCQ", q:"If the probability of a player winning a game is 0.79, the probability of losing it is:", o:["1.79","0.31","0.21%","0.21"], a:3, concept:"Complement rule", mis:"Careless mistake", h1:"Win and lose are the only outcomes — their probabilities add to 1.", h2:"1 − 0.79.", h3:"0.21 (note: 0.21% in the options is a trap — 21% is 0.21 as a decimal).", sol:["P(lose) = 1 − P(win)","= 1 − 0.79 = 0.21"], exp:"From your 2024 board paper (Q2). Distinguish 0.21 from 0.21% — options are engineered around that confusion.", board:true},
{id:"q-pr2", ch:"m-prob", d:2, ty:"NUM", q:"Two dice are thrown together. What is the probability that the sum of the numbers is 7?", o:[], a:-1, ans:"1/6", concept:"Sample space counting", mis:"Calculation mistake", h1:"Total outcomes first: 6 × 6.", h2:"List pairs summing to 7: (1,6)(2,5)(3,4)(4,3)(5,2)(6,1).", h3:"6/36 = 1/6.", sol:["n(S) = 36","Favourable: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) → 6","P = 6/36 = 1/6"], exp:"7 is the MOST likely sum with two dice — useful fact for MCQs.", board:true},
{id:"q-pr3", ch:"m-prob", d:3, ty:"NUM", q:"A card is drawn from a well-shuffled deck. Find the probability that it is neither a king nor a queen.", o:[], a:-1, ans:"11/13", concept:"Complement + counting", mis:"Reading mistake", h1:"'Neither a king nor a queen' — how many cards are kings or queens?", h2:"4 + 4 = 8 cards are excluded.", h3:"P = (52 − 8)/52 = 44/52 = 11/13.", sol:["Kings + queens = 8 cards","P(neither) = 44/52","= 11/13"], exp:"'Neither A nor B' → subtract both counts — or use 1 − P(king) − P(queen).", board:true},
/* ---------- MATHS: COORDINATE / STAT / SURF / CIRC / ARCA ---------- */
{id:"q-c1", ch:"m-coord", d:3, ty:"MCQ", q:"A(5, −4), B(6, 4), C(0, 0). AD is a median to BC. The length of AD is:", o:["√68","2√15","√101","10"], a:1, concept:"Median via midpoint + distance formula", mis:"Method-selection mistake", h1:"A median joins A to the MIDPOINT of BC — find D first.", h2:"D = ((6+0)/2, (4+0)/2) = (3, 2).", h3:"AD = √((5−3)² + (−4−2)²) = √40 = 2√15.", sol:["D = midpoint of BC = (3, 2)","AD = √(2² + 6²) = √40","= 2√15 units"], exp:"From your 2024 board paper (Q6). Median questions are always two steps: midpoint, then distance.", board:true},
{id:"q-c2", ch:"m-coord", d:2, ty:"MCQ", q:"The distance of the point (−5, 12) from the origin is:", o:["13","17","7","11"], a:0, concept:"Distance formula", mis:"Calculation mistake", h1:"Distance from origin = √(x² + y²).", h2:"√(25 + 144).", h3:"√169 = 13.", sol:["√((−5)² + 12²) = √(25+144)","= √169 = 13"], exp:"5-12-13 is the third classic Pythagorean triple — recognise it on sight.", board:true},
{id:"q-s1", ch:"m-stat", d:2, ty:"MCQ", q:"The empirical relationship between the three measures of central tendency is:", o:["3 Median = Mode + 2 Mean","Mode = 3 Median − 2 Mean","Mean = Mode + Median","3 Mean = Median + Mode"], a:0, concept:"Empirical formula", mis:"Memory mistake", h1:"It links median, mode and mean.", h2:"Median sits between mode and mean in a moderately skewed distribution.", h3:"3 Median = Mode + 2 Mean.", sol:["Empirical relation: 3 Median = Mode + 2 Mean"], exp:"The other options are rearrangements that only hold accidentally — memorise the standard form.", board:true},
{id:"q-v1", ch:"m-surf", d:3, ty:"NUM", q:"A solid metallic sphere of radius 6 cm is melted and recast into a cylinder of radius 4 cm. Find the height of the cylinder.", o:[], a:-1, ans:"18 cm", concept:"Volume conservation", mis:"Concept mistake", h1:"Melting preserves TOTAL volume.", h2:"(4/3)π(6)³ = π(4)²h → 288π = 16πh.", h3:"288/16 = 18 — don't forget to cube the radius.", sol:["V_sphere = (4/3)π(6)³ = 288π cm³","V_cyl = π(4)²h = 16πh","288π = 16πh","h = 18 cm"], exp:"Set volumes equal, cancel π, divide. Check: 16 × 18 = 288 ✓", board:true},
{id:"q-ci1", ch:"m-circ", d:3, ty:"SA", q:"Two tangents PQ and PR are drawn from an external point P to a circle with centre O. If ∠QPR = 60°, find ∠QOR.", o:[], a:-1, ans:"120°", concept:"Tangent–radius perpendicularity", mis:"Concept mistake", h1:"OQ and OR are radii; tangents are perpendicular to them.", h2:"In quadrilateral OQPR: 90° + 90° + 60° + ∠QOR = 360°.", h3:"∠QOR = 120°.", sol:["∠OQP = ∠ORP = 90° (radius ⟂ tangent)","∠QOR + ∠QPR + 90° + 90° = 360°","∠QOR = 360° − 240° = 120°"], exp:"The two right angles from the perpendicularity theorem drive every angle question on tangents.", board:true},
{id:"q-ar1", ch:"m-arca", d:2, ty:"NUM", q:"Find the area of a sector of a circle of radius 6 cm with angle 60°. (Use π = 22/7.)", o:[], a:-1, ans:"132/7 ≈ 18.86 cm²", concept:"Sector area formula", mis:"Formula mistake", h1:"Area = (θ/360) × πr².", h2:"(60/360) × (22/7) × 36.", h3:"= (1/6) × 792/7 = 132/7 ≈ 18.86 cm².", sol:["Area = (60/360) × (22/7) × 6²","= (1/6) × (22/7) × 36","= 132/7 ≈ 18.86 cm²"], exp:"Keep the fraction until the last line — premature decimals create rounding errors.", board:true},
{id:"q-at1", ch:"m-atrig", d:3, ty:"NUM", q:"The angle of elevation of the top of a tower from a point 30 m from its base is 30°. Find the height of the tower.", o:[], a:-1, ans:"10√3 m (≈ 17.32 m)", concept:"Elevation + tangent", mis:"Formula mistake", h1:"Draw: tower (opposite), ground distance (adjacent) = 30 m.", h2:"tan 30° = h/30.", h3:"h = 30 × (1/√3) = 10√3.", sol:["tan 30° = h/30","1/√3 = h/30","h = 30/√3 = 10√3 ≈ 17.32 m"], exp:"Rationalise at the end: 30/√3 = 30√3/3 = 10√3.", board:true},
/* ---------- PHYSICS: ELECTRICITY ---------- */
{id:"q-e1", ch:"p-elec", d:1, ty:"MCQ", q:"A 6 Ω resistor carries a current of 2 A. The potential difference across it is:", o:["3 V","8 V","12 V","0.33 V"], a:2, concept:"Ohm's law", mis:"Formula mistake", h1:"Which law connects V, I and R?", h2:"V = IR.", h3:"6 × 2 = 12.", sol:["V = IR","= 2 A × 6 Ω = 12 V"], exp:"One substitution — the interpretation trainer uses exactly this question's structure.", board:true},
{id:"q-e2", ch:"p-elec", d:2, ty:"NUM", q:"Calculate the equivalent resistance of 3 Ω and 6 Ω connected in parallel, then in series with a 3 Ω resistor, across a 12 V battery. Find the total current.", o:[], a:-1, ans:"2.4 A", concept:"Series–parallel reduction", mis:"Method-selection mistake", h1:"Reduce the parallel pair first.", h2:"(3×6)/(3+6) = 2 Ω; series with 3 Ω → 5 Ω total.", h3:"I = 12/5 = 2.4 A.", sol:["Parallel: (3×6)/(3+6) = 2 Ω","Total: 2 + 3 = 5 Ω","I = V/R = 12/5 = 2.4 A"], exp:"Always reduce to ONE equivalent resistance before applying Ohm's law at the battery.", board:true},
{id:"q-e3", ch:"p-elec", d:3, ty:"MCQ", q:"Two bulbs rated 100 W and 60 W are connected in SERIES. Which glows brighter?", o:["100 W bulb","60 W bulb","Both equally","Neither glows"], a:1, concept:"I²R heating in series", mis:"Concept mistake", h1:"In series, what is the SAME through both bulbs?", h2:"Current. So heat ∝ I²R — resistance decides.", h3:"The 60 W bulb has HIGHER resistance (P = V²/R at rating voltage) → dissipates more heat in series → glows brighter.", sol:["In series: same I in both","P_series = I²R → higher R wins","R₆₀ = V²/60 > R₁₀₀ = V²/100","60 W bulb glows brighter"], exp:"Counter-intuitive and therefore a favourite MCQ. In PARALLEL the 100 W bulb wins — the wiring decides, not the rating.", board:true, found:true},
{id:"q-e4", ch:"p-elec", d:2, ty:"NUM", q:"An electric heater draws 1500 W at 220 V. Find (a) the current and (b) the resistance of the heating element.", o:[], a:-1, ans:"I = 6.82 A, R = 32.3 Ω", concept:"Power formulas", mis:"Formula mistake", h1:"Which power formula has V and I only?", h2:"P = VI → I = 1500/220 ≈ 6.82 A.", h3:"R = V/I = 220/6.82 ≈ 32.3 Ω.", sol:["I = P/V = 1500/220 ≈ 6.82 A","R = V/I = 220/6.82 ≈ 32.27 Ω"], exp:"Two formulas, one chain. Also try R = V²/P directly = 48400/1500 ≈ 32.3 ✓", board:true},
{id:"q-e5", ch:"p-elec", d:3, ty:"NUM", q:"A family runs a 2 kW geyser for 2 hours daily and five 40 W bulbs for 6 hours daily. Calculate the electricity bill for 30 days at ₹6 per unit.", o:[], a:-1, ans:"₹936", concept:"Energy in kWh", mis:"Unit mistake", h1:"Convert everything to kW and hours first.", h2:"Geyser: 2 kW × 2 h × 30 = 120 units. Bulbs: 5 × 0.04 kW × 6 h × 30 = 36 units.", h3:"(120 + 36) × 6 = ₹936.", sol:["Geyser: 2 × 2 × 30 = 120 kWh","Bulbs: 0.04 × 5 × 6 × 30 = 36 kWh","Total = 156 units","Bill = 156 × 6 = ₹936"], exp:"The W→kW conversion is where marks die. 40 W = 0.04 kW, not 4 or 40.", board:true},
{id:"q-e6", ch:"p-elec", d:4, ty:"NUM", q:"Why is the filament of an electric bulb made of tungsten, and why is the electric fuse wire thin with a low melting point? (2 marks)", o:[], a:-1, ans:"Tungsten: high melting point (≈3380°C) resists melting at white-hot temperature. Fuse: thin + low-melting so excess current melts it QUICKLY, breaking the circuit before damage.", concept:"Material properties in circuits", mis:"Concept mistake", h1:"What does a filament need to survive? What must a fuse do on overload?", h2:"Filament works at very high temperature — needs a very high melting point + high resistivity.", h3:"Fuse must SURRENDER early — thin wire heats fast (higher resistance per length) and low melting point melts first.", sol:["Tungsten: very high melting point (doesn't melt when white hot), high resistivity, can be drawn into thin wires","Fuse: thin wire → higher resistance → heats quickly; low melting point → melts and breaks the circuit on excess current, protecting appliances"], exp:"'Give reasons' physics questions want ONE property linked to ONE job — memorise the pairs.", board:true},
/* ---------- PHYSICS: MAGNETISM ---------- */
{id:"q-m1", ch:"p-mag", d:2, ty:"MCQ", q:"At the centre of a current-carrying circular loop, the magnetic field lines are:", o:["circular","straight and parallel","radial outward","elliptical"], a:1, concept:"Field of a loop", mis:"Concept mistake", h1:"Think of the loop as a tiny bar magnet — what does the field look like at its very centre?", h2:"Every part of the ring contributes a field pointing along the axis at the centre.", h3:"They add to straight, parallel lines through the centre.", sol:["At centre, contributions from the whole loop align along the axis","Field lines appear straight and parallel at the centre"], exp:"This is why a solenoid's interior has a uniform field — every loop contributes straight parallel lines.", board:true},
{id:"q-m2", ch:"p-mag", d:3, ty:"MCQ", q:"An electric generator converts:", o:["mechanical energy into electrical energy","electrical energy into mechanical energy","chemical energy into electrical energy","heat into electricity"], a:0, concept:"Generator principle", mis:"Memory mistake", h1:"Think of the direction of energy flow in a power plant.", h2:"Turbine turns → coil rotates → current induced.", h3:"Mechanical → electrical.", sol:["Generator: mechanical → electrical (Faraday's induction)","Motor: electrical → mechanical (reverse)"], exp:"Motor and generator are mirror images — examiners swap them every year. Fleming: LEFT = motor, RIGHT = generator.", board:true},
/* ---------- PHYSICS: LIGHT ---------- */
{id:"q-l3", ch:"p-light", d:3, ty:"NUM", q:"An object is placed 10 cm from a concave mirror of focal length 15 cm. Find the position and nature of the image.", o:[], a:-1, ans:"v = +30 cm: virtual, erect, magnified (behind the mirror)", concept:"Mirror formula with signs", mis:"Calculation mistake", h1:"Signs first: u = −10, f = −15 (concave).", h2:"1/v = 1/f − 1/u = −1/15 + 1/10.", h3:"= (−2+3)/30 = 1/30 → v = +30 cm (positive = virtual).", sol:["1/v + 1/u = 1/f","1/v = 1/f − 1/u = −1/15 − (−1/10) = 1/30","v = +30 cm (behind mirror)","m = −v/u = −(30)/(−10) = +3 → erect, triple size"], exp:"Object inside F always gives a virtual, erect, magnified image — the makeup-mirror case.", board:true},
{id:"q-l4", ch:"p-light", d:2, ty:"MCQ", q:"A convex mirror always forms an image that is:", o:["real, inverted, diminished","virtual, erect, diminished","virtual, erect, magnified","real, inverted, same size"], a:1, concept:"Convex mirror imaging", mis:"Memory mistake", h1:"Convex mirrors are used as rear-view mirrors — what do you see in them?", h2:"Upright and smaller (wider field).", h3:"Virtual, erect, diminished — for ANY object position.", sol:["Convex mirror: image always virtual, erect, diminished","That's why they give a wide field of view as rear-view mirrors"], exp:"The word 'always' is the key — convex mirrors have no special cases.", board:true},
{id:"q-l5", ch:"p-light", d:3, ty:"NUM", q:"The refractive index of glass is 1.5 and of water 1.33. In which medium does light travel slower, and what is the speed of light in glass?", o:[], a:-1, ans:"Glass; 2 × 10⁸ m/s", concept:"n = c/v", mis:"Concept mistake", h1:"Higher refractive index = slower light.", h2:"n_glass (1.5) > n_water (1.33) → slower in glass.", h3:"v = c/n = 3×10⁸/1.5 = 2×10⁸ m/s.", sol:["Higher n → optically denser → slower light: glass","v = c/n = (3 × 10⁸)/1.5","= 2 × 10⁸ m/s"], exp:"n = c/v is the bridge between 'density' language and actual speed — exams love this translation.", board:true},
/* ---------- PHYSICS: EYE ---------- */
{id:"q-y1", ch:"p-eye", d:2, ty:"MCQ", q:"The defect of vision in which a person can see nearby objects clearly but distant objects appear blurred is:", o:["myopia","hypermetropia","presbyopia","astigmatism"], a:0, concept:"Defects of vision", mis:"Memory mistake", h1:"Distant objects blur — where must the image be landing relative to the retina?", h2:"Before the retina = eye too convergent = short-sighted.", h3:"Myopia — corrected by a concave lens.", sol:["Distant objects blurry → image forms BEFORE the retina → myopia","Correction: concave (diverging) lens"], exp:"My-opia = 'short-sighted': you can see NEAR. Link each defect to where the image lands and the correction writes itself.", board:true},
/* ---------- CHEMISTRY ---------- */
{id:"q-cc1", ch:"c-chem", d:2, ty:"MCQ", q:"When iron nails are dipped in copper sulphate solution, the observation is:", o:["solution turns green, brown deposit on nails","solution turns blue, grey deposit","no change","gas evolves with pop sound"], a:0, concept:"Displacement reaction", mis:"Concept mistake", h1:"Compare Fe and Cu in the reactivity series.", h2:"Fe is ABOVE Cu → Fe displaces copper.", h3:"FeSO₄ (green) forms and copper deposits brown on the nails.", sol:["Fe + CuSO₄ → FeSO₄ + Cu","Fe more reactive → displaces Cu","Blue colour fades to green; brown copper coats the iron"], exp:"Colour + deposit = the two observations boards ask for. 'Pop sound' belongs to hydrogen — don't mix signals.", board:true},
{id:"q-cc2", ch:"c-chem", d:3, ty:"MCQ", q:"In the reaction ZnO + C → Zn + CO₂, which species is reduced?", o:["ZnO","C","Zn","CO"], a:0, concept:"Redox identification", mis:"Concept mistake", h1:"Reduction = removal of oxygen (or gain of electrons).", h2:"ZnO loses oxygen to become Zn.", h3:"ZnO is reduced; carbon is oxidised.", sol:["ZnO → Zn: oxygen removed ⇒ ZnO reduced","C → CO₂: oxygen gained ⇒ C oxidised"], exp:"Track ONE species's oxygen and the whole redox picture falls out.", board:true},
{id:"q-cc3", ch:"c-chem", d:2, ty:"MCQ", q:"Rancidity of food is prevented by:", o:["adding antioxidants","adding salt","refrigeration only","adding water"], a:0, concept:"Oxidation of fats", mis:"Memory mistake", h1:"Rancidity = slow oxidation of fats and oils in air.", h2:"Prevention must slow/block oxidation.", h3:"Antioxidants (and nitrogen flushing of chip packets) block oxidation — refrigeration only slows it.", sol:["Rancidity = oxidation of fats","Antioxidants prevent it; N₂ flushing keeps O₂ out of packets"], exp:"Chips packets are flushed with nitrogen — that specific example appears in board answers.", board:true},
{id:"q-a1x", ch:"c-acid", d:2, ty:"MCQ", q:"A solution turns red litmus blue. Its pH is likely to be:", o:["2","5","7","11"], a:3, concept:"pH scale", mis:"Concept mistake", h1:"Blue litmus in the solution = the solution is a base.", h2:"Bases have pH > 7.", h3:"Only 11 fits.", sol:["Red→blue litmus = basic solution","pH > 7 → 11"], exp:"Read both directions of the litmus test: acid turns blue litmus red; base turns red litmus blue.", board:true},
{id:"q-a2x", ch:"c-acid", d:3, ty:"SA", q:"Why does tooth decay start when the pH of the mouth falls below 5.5? Suggest one remedy.", o:[], a:-1, ans:"Tooth enamel (calcium phosphate) starts dissolving in acidic medium below pH 5.5. Remedy: brush with toothpaste (basic) / rinse after eating sweets; avoid frequent sugary snacks.", concept:"pH in daily life", mis:"Concept mistake", h1:"What is tooth enamel made of, and how do acids treat it?", h2:"Bacteria feed on sugar and produce ACID in the mouth.", h3:"Below pH 5.5, the enamel (calcium phosphate, the hardest substance in the body) starts dissolving — a basic toothpaste neutralises it.", sol:["Sugary food → bacteria act → acid forms → pH drops","Below 5.5: enamel (calcium phosphate) corrodes","Remedy: brushing with basic toothpaste; rinsing the mouth after meals; fewer sugary snacks between meals"], exp:"The pH value 5.5 is the memorised threshold; remedy marks come from saying BASIC toothpaste.", board:true},
{id:"q-a3x", ch:"c-acid", d:2, ty:"MCQ", q:"Baking soda is chemically:", o:["Na₂CO₃","NaHCO₃","NaOH","NaCl"], a:1, concept:"Chemical formulas", mis:"Memory mistake", h1:"It's the mild one used in food — which sodium compound is mild?", h2:"Baking SODA = sodium bicarbonate.", h3:"NaHCO₃ — sodium hydrogen carbonate.", sol:["Baking soda = NaHCO₃ (sodium hydrogen carbonate)","Washing soda = Na₂CO₃·10H₂O (don't confuse!)"], exp:"Baking vs washing soda is THE classic MCQ confusion pair.", board:true},
{id:"q-me1", ch:"c-metal", d:2, ty:"MCQ", q:"Which of the following metals is kept immersed in kerosene?", o:["Sodium","Iron","Copper","Gold"], a:0, concept:"Reactivity with air/water", mis:"Concept mistake", h1:"Which metal reacts so violently with air/moisture that it must be isolated?", h2:"Group 1 metals like Na catch fire in air.", h3:"Sodium — stored under kerosene to cut off air and moisture.", sol:["Na reacts vigorously with air oxygen and moisture","Kept under kerosene to prevent contact"], exp:"The logic (not the fact) is the answer: reactive metal + air = fire risk.", board:true},
{id:"q-me2", ch:"c-metal", d:3, ty:"MCQ", q:"Galvanisation is the process of coating iron with:", o:["tin","chromium","zinc","copper"], a:2, concept:"Corrosion prevention", mis:"Memory mistake", h1:"The name sounds like it involves one specific metal…", h2:"Galvanisation protects iron even when the coating scratches.", h3:"Zinc — it is more reactive than iron and corrodes first (sacrificial protection).", sol:["Galvanisation = zinc coating on iron","Zn oxidises preferentially, protecting the iron beneath"], exp:"Why zinc and not tin? A scratched tin coat lets iron rust FASTER — zinc's reactivity order makes it sacrificial.", board:true},
{id:"q-cb1", ch:"c-carbon", d:2, ty:"MCQ", q:"The number of structural isomers of butane (C₄H₁₀) is:", o:["1","2","3","4"], a:1, concept:"Isomerism", mis:"Concept mistake", h1:"Isomers = same formula, different structure.", h2:"C₄H₁₀ can be a straight chain (n-butane) or branched.", h3:"Only two: n-butane and iso-butane (2-methylpropane).", sol:["n-butane: CH₃–CH₂–CH₂–CH₃","iso-butane: CH(CH₃)₃","Total: 2 isomers"], exp:"Drawing beats counting — sketch the skeletons and the answer is visible.", board:true},
{id:"q-cb2", ch:"c-carbon", d:3, ty:"SA", q:"Why is the conversion of ethanol to ethanoic acid an oxidation reaction? Write the equation.", o:[], a:-1, ans:"CH₃CH₂OH + 2[O] →(alk. KMnO₄) CH₃COOH + H₂O — hydrogen is removed / oxygen is added, so it's oxidation.", concept:"Oxidation of alcohols", mis:"Concept mistake", h1:"What's the difference between C₂H₅OH and CH₃COOH?", h2:"Two hydrogen atoms are removed and one oxygen is added.", h3:"Gain of O / loss of H = oxidation, by definition.", sol:["CH₃CH₂OH + 2[O] → CH₃COOH + H₂O","Alkaline KMnO₄ or acidified K₂Cr₂O₇ supply the oxygen","O added + H removed ⇒ oxidation"], exp:"Oxidation is defined as EITHER — you don't need both, just one direction consistently.", board:true},
{id:"q-cb3", ch:"c-carbon", d:4, ty:"SA", q:"Explain why soap is not suitable for washing clothes in hard water.", o:[], a:-1, ans:"Hard water contains Ca²⁺/Mg²⁺ ions which react with soap forming an insoluble scum — so no micelles form and cleaning stops.", concept:"Micelle chemistry", mis:"Concept mistake", h1:"What extra ions does hard water carry?", h2:"Ca²⁺/Mg²⁺ + soap (sodium stearate) → calcium/magnesium stearate.", h3:"That's an insoluble SCUM — soap is consumed without cleaning; detergents avoid this with sulphonate heads.", sol:["Hard water: dissolved Ca²⁺ and Mg²⁺ salts","Soap anion + Ca²⁺ → insoluble scum (calcium stearate)","Scum = wasted soap, no lather, no micelle cleaning","Detergents' sulphonate heads stay soluble in hard water"], exp:"Two parts: name the ions, name the product. Half the class forgets 'scum' — the exact word the marking scheme wants.", board:true},
/* ---------- BIOLOGY ---------- */
{id:"q-b1", ch:"b-life", d:2, ty:"MCQ", q:"The left ventricle has the thickest muscular wall because it:", o:["pumps blood to the whole body","pumps blood only to the lungs","receives blood from the lungs","stores blood"], a:0, concept:"Double circulation", mis:"Concept mistake", h1:"Compare the two circuits the ventricles serve.", h2:"Right → lungs (short, low pressure). Left → entire body.", h3:"Whole-body push needs the most force → thickest wall.", sol:["Left ventricle → aorta → entire body","Maximum pressure needed → maximum muscle"], exp:"Structure follows function — the reasoning transfers to every biology 'why' question.", board:true},
{id:"q-b2", ch:"b-life", d:2, ty:"MCQ", q:"Which of the following is the correct sequence of air passage during inhalation?", o:["nostrils → larynx → pharynx → trachea → lungs","nostrils → pharynx → larynx → trachea → bronchi → lungs","nostrils → trachea → pharynx → larynx → lungs","pharynx → nostrils → larynx → trachea → lungs"], a:1, concept:"Respiratory pathway", mis:"Memory mistake", h1:"The throat has two parts — which comes first after the nose?", h2:"Pharynx (throat) then larynx (voice box).", h3:"nostrils → pharynx → larynx → trachea → bronchi → lungs.", sol:["Air: nostrils → pharynx → larynx → trachea → bronchi → bronchioles → alveoli"], exp:"Pharynx BEFORE larynx is the swapped pair examiners target.", board:true},
{id:"q-b3", ch:"b-life", d:3, ty:"MCQ", q:"In humans, deoxygenated blood is pumped from the:", o:["left atrium to left ventricle","right atrium to right ventricle","right ventricle to the body","left ventricle to the lungs"], a:1, concept:"Heart chambers", mis:"Concept mistake", h1:"Which side handles deoxygenated blood?", h2:"The right side, always.", h3:"Right atrium receives it (from the vena cava) and passes it to the right ventricle → lungs.", sol:["Deoxygenated blood: vena cava → right atrium → right ventricle → pulmonary artery → lungs"], exp:"'Right = rests before recharge' — right side handles used blood; left side handles the fresh oxygenated load.", board:true},
{id:"q-b4", ch:"b-life", d:3, ty:"SA", q:"Why is the small intestine long and internally provided with villi?", o:[], a:-1, ans:"Long length + millions of villi (with microvilli) create a huge surface area for absorption of digested food — and villi are richly supplied with blood vessels to carry it away fast.", concept:"Surface area in absorption", mis:"Concept mistake", h1:"What does absorption need physically?", h2:"Surface area and blood supply.", h3:"Villi multiply the absorbing surface enormously — a classic structure-function pairing.", sol:["Long tube = food stays longer + more contact area","Villi = finger-like projections multiplying surface further","Each villus has blood capillaries for rapid transport"], exp:"'Increase surface area' is the master answer to many biology questions (alveoli, villi, root hairs) — the exam rewards recognising the pattern.", board:true},
{id:"q-b5", ch:"b-ctrl", d:2, ty:"MCQ", q:"The gap between two adjacent neurons across which impulses travel is called:", o:["axon","synapse","dendrite","myelin"], a:1, concept:"Neuron structure", mis:"Memory mistake", h1:"Impulses JUMP a gap between neurons.", h2:"The jump happens at a chemical junction.", h3:"Synapse — neurotransmitter diffuses across it.", sol:["Synapse = microscopic gap between axon ending of one neuron and dendrite of the next","Chemical (neurotransmitter) transmission across it"], exp:"Electrical travels IN the neuron; chemical crosses BETWEEN neurons.", board:true},
{id:"q-b6", ch:"b-ctrl", d:3, ty:"MCQ", q:"Iodine is necessary in our diet because it:", o:["makes bones strong","is needed to make thyroxine","prevents diabetes","builds muscles"], a:1, concept:"Endocrine function", mis:"Memory mistake", h1:"Which gland famously fails without iodine?", h2:"The thyroid — and goitre is its deficiency disease.", h3:"Thyroid needs iodine to synthesise thyroxine.", sol:["Iodine → thyroid → thyroxine","Deficiency → goitre (swollen neck)"], exp:"Iodised salt exists for exactly this — the diet link completes the answer.", board:true},
{id:"q-b7", ch:"b-repro", d:2, ty:"MCQ", q:"Which of these is NOT a method of asexual reproduction?", o:["budding","binary fission","pollination","fragmentation"], a:2, concept:"Reproduction modes", mis:"Concept mistake", h1:"Which one involves TWO parents or gametes?", h2:"Pollination carries MALE gametes to the female part — it's sexual.", h3:"The other three are one-parent modes.", sol:["Budding (Hydra), binary fission (Amoeba), fragmentation (Spirogyra) = asexual","Pollination = part of sexual reproduction in plants"], exp:"Asexual = one parent, no gametes — test each option against that one rule.", board:true},
{id:"q-b8", ch:"b-hered", d:3, ty:"NUM", q:"A tall pea plant (Tt) is crossed with a dwarf pea plant (tt). What fraction of offspring will be tall?", o:[], a:-1, ans:"1/2 (50%)", concept:"Monohybrid cross", mis:"Method-selection mistake", h1:"Write the gametes each parent can give.", h2:"Tt gives T or t; tt gives only t.", h3:"Offspring: Tt (tall) and tt (dwarf) in equal numbers → 1/2 tall.", sol:["Parents: Tt × tt","Gametes: T, t and t","Offspring: Tt, tt, Tt, tt → 2 tall : 2 dwarf","P(tall) = 1/2"], exp:"A test cross (Tt × tt) gives a 1:1 ratio — that's how Mendel identified hidden genotypes.", board:true},
{id:"q-b9", ch:"b-env", d:2, ty:"MCQ", q:"Which of the following is a non-biodegradable waste?", o:["cow dung","cotton cloth","polythene bag","paper"], a:2, concept:"Waste types", mis:"Concept mistake", h1:"Which material cannot be broken down by decomposers?", h2:"Plastics have bonds decomposers can't digest.", h3:"Polythene bag — non-biodegradable.", sol:["Non-biodegradable: plastics, polythene, synthetic fibres, glass, metals","Biodegradable: cow dung, paper, cotton, vegetable peels"], exp:"Rule of thumb: anything plant/animal-derived is biodegradable; synthetic polymers are not.", board:true},
{id:"q-b10", ch:"b-env", d:3, ty:"MCQ", q:"Energy flow in an ecosystem is:", o:["cyclic","unidirectional","bidirectional","random"], a:1, concept:"10% law context", mis:"Concept mistake", h1:"Does the energy a lion eats ever flow back to the grass?", h2:"Energy leaves as heat at each step and never returns.", h3:"Unidirectional — sun → producers → consumers → heat.", sol:["Energy enters as sunlight, leaves as heat","Never re-enters the biotic chain ⇒ unidirectional","Nutrients CYCLE; energy FLOWS"], exp:"Nutrients cycle, energy flows — one sentence carrying two distinctions examiners test.", board:true},

{id:"q-s1x", ch:"s-hist", d:2, ty:"MCQ", q:"The Non-Cooperation Movement was withdrawn by Gandhi after:", o:["the Jallianwala Bagh massacre","the Chauri Chaura incident","the Simon Commission","the Dandi March"], a:1, concept:"Movement chronology", mis:"Memory mistake", h1:"Gandhi's principle: non-violence above all.", h2:"In Feb 1922, protesters burned a police station killing policemen.", h3:"Chauri Chaura — violence broke the movement's soul.", sol:["Feb 1922: Chauri Chaura (Gorakhpur) — mob torched police station","Gandhi withdrew Non-Cooperation, launched Civil Disobedience later in 1930"], exp:"Order to memorise: Rowlatt (1919) → NCM (1920) → Chauri Chaura (1922) → Dandi (1930) → Quit India (1942).", board:true},
{id:"q-s2x", ch:"s-civ", d:2, ty:"MCQ", q:"In Belgium, the percentage of Dutch-speaking and French-speaking people is respectively:", o:["59% and 40%","40% and 59%","50% and 50%","64% and 34%"], a:0, concept:"Belgium's composition", mis:"Memory mistake", h1:"Which community is the majority but lives in the north?", h2:"Dutch-speaking are the larger group.", h3:"59% Dutch, 40% French (1% German).", sol:["Belgium: 59% Dutch (Flemish region), 40% French (Wallonia), 1% German","Brussels: 80% French speakers in a Dutch-majority country — the tension"], exp:"Sri Lanka (majoritarianism) vs Belgium (accommodation) is the guaranteed compare question.", board:true},
{id:"q-s3x", ch:"s-eco", d:3, ty:"MCQ", q:"The sector that employs the largest number of people in India is:", o:["primary","secondary","tertiary","quaternary"], a:0, concept:"Employment vs GDP share", mis:"Concept mistake", h1:"GDP share is largest in tertiary — but employment?", h2:"More than half of Indians still work in agriculture.", h3:"Primary sector — despite contributing the smallest GDP share.", sol:["Employment: primary (agriculture) employs most","GDP: tertiary contributes most","The mismatch itself = underemployment/disguised unemployment"], exp:"This gap is the whole point of the chapter's MGNREGA discussion.", board:true},
{id:"q-s4x", ch:"s-geo", d:2, ty:"MCQ", q:"Cropping season: which of these is a RABI crop?", o:["rice","maize","wheat","jowar"], a:2, concept:"Cropping seasons", mis:"Memory mistake", h1:"Rabi = sown in winter (Oct–Nov), harvested Mar–Apr.", h2:"Rice/jowar/maize are kharif (monsoon) crops.", h3:"Wheat is the classic rabi crop.", sol:["Rabi (winter): wheat, gram, mustard, peas","Kharif (monsoon): rice, jowar, bajra, maize, cotton"], exp:"Anchor: wheat needs NO monsoon — winter irrigation (tube wells) suits it.", board:true},

{id:"q-x1", ch:"e-poem", d:2, ty:"MCQ", q:"In 'Fire and Ice', 'fire' and 'ice' respectively symbolise:", o:["love and hope","desire and hatred","war and peace","passion and logic"], a:1, concept:"Symbolism", mis:"Reading mistake", h1:"What two ways does Frost say the world could end?", h2:"Fire = heat of emotion out of control; ice = cold indifference.", h3:"Desire (fire) and hatred (ice).", sol:["Fire ⇒ uncontrolled desire/passion","Ice ⇒ cold hatred/indifference","Frost: either emotion is enough to destroy the world"], exp:"Symbol questions need the abstract meaning, not the literal element.", board:true},

{id:"q-h1", ch:"h-kav", d:2, ty:"MCQ", q:"'पर्वत प्रदेश में पावस' कविता के कवि हैं:", o:["सुमित्रानंदन पंत","जयशंकर प्रसाद","महादेवी वर्मा","सूरदास"], a:0, concept:"कवि पहचान", mis:"Memory mistake", h1:"इस कविता में हिमालय की वर्षा का चित्रण है — छायावादी कवि।", h2:"छायावाद के चार स्तंभों में से एक, 'पल्लव' के रचनाकार।", h3:"सुमित्रानंदन पंत।", sol:["'पर्वत प्रदेश में पावस' — सुमित्रानंदन पंत","प्रमुख रचनाएँ: पल्लव, ग्रंथि, लोकवात्यायन"], exp:"कवि-कविता युग्म पहले प्रश्न होते हैं — एक बार में छह कवियों का मैप बना लो।", board:true},
{id:"q-h2", ch:"h-gady", d:3, ty:"MCQ", q:"'बड़े भाई साहब' कहानी में लेखक और बड़े भाई के बीच मूल टकराव का कारण है:", o:["संपत्ति का बँटवारा","पढ़ाई की पद्धति और खेल में समय बिताने पर मतभेद","पिता की असम्मति","गाँव छोड़ने की इच्छा"], a:1, concept:"कथानक समझ", mis:"Reading mistake", h1:"बड़े भाई लेखक को कैसे पढ़ाना चाहते हैं?", h2:"रटने की निगरानी बनाम लेखक का खेल-प्रेम।", h3:"पढ़ाई की पद्धति और खेल पर बिताए समय को लेकर विवाद।", sol:["बड़े भाई: दोहराव-पद्धति, निगरानी","लेखक: क्रिकेट और ताश में समय","अंत में बड़े भाई स्वीकार करते हैं कि उनकी विधि व्यर्थ थी"], exp:"कहानी का संदेश: शिक्षण-पद्धति में रटना बनाम समझ — परीक्षा में इसी निष्कर्ष से उत्तर शुरू करो।", board:true}

/* ---------- QUESTION INTERPRETATION TRAINER DATA ---------- */
const INTERP = [
{id:"i1", ch:"p-elec", q:"A 6 Ω resistor carries a current of 2 A. Find the potential difference.",
 steps:[
  {ask:"What is GIVEN in this question?", o:["Voltage and resistance","Resistance and current","Power and resistance","Current and voltage"], a:1, why:"'6 Ω' is resistance; '2 A' is current."},
  {ask:"What is REQUIRED?", o:["Current","Resistance","Potential difference","Power"], a:2, why:"'Find the potential difference' — V."},
  {ask:"Which relation connects given → required?", o:["P = VI","V = IR","H = I²Rt","Q = It"], a:1, why:"V = IR links all three quantities."}],
 final:"V = IR = 2 × 6 = 12 V"},
{id:"i2", ch:"m-trig", q:"If sin θ = 3/5, find cos θ.",
 steps:[
  {ask:"sin θ = 3/5 tells you which two sides?", o:["Base and hypotenuse","Perpendicular and hypotenuse","Perpendicular and base","Hypotenuse only"], a:1, why:"sin θ = P/H, so P = 3, H = 5."},
  {ask:"Which concept finds the third side?", o:["Trigonometric identities","Pythagoras theorem","Similar triangles","Area formula"], a:1, why:"H² = P² + B² gives the base."},
  {ask:"cos θ needs which sides?", o:["P and H","H and B","P and B","B only"], a:1, why:"cos θ = B/H."}],
 final:"B = √(25−9) = 4 → cos θ = 4/5"},
{id:"i3", ch:"m-quad", q:"The product of two consecutive positive integers is 306. Find them.",
 steps:[
  {ask:"What is the unknown here?", o:["One number (the other follows)","The sum","Their difference","Two independent numbers"], a:0, why:"'Consecutive' lets ONE variable describe both: x and x+1."},
  {ask:"Which equation type does this produce?", o:["Linear","Quadratic","Cubic","None"], a:1, why:"x(x+1) = 306 → x² + x − 306 = 0."},
  {ask:"After solving, what must you check?", o:["Nothing — both roots work","Reject non-positive/non-integer roots","Only check the smaller root","Divide by 2"], a:1, why:"'Positive integers' physically constrains the answer."}],
 final:"x² + x − 306 = 0 → x = 17 → numbers 17, 18"},
{id:"i4", ch:"p-light", q:"An object is placed 10 cm from a concave mirror of focal length 15 cm. Describe the image.",
 steps:[
  {ask:"What are the given signs (mirror convention)?", o:["u = +10, f = +15","u = −10, f = −15","u = −10, f = +15","u = +10, f = −15"], a:1, why:"Real-object distances are negative; concave focal length is negative."},
  {ask:"Is the object beyond or within the focal length?", o:["Beyond F","Exactly at F","Within F","At the centre of curvature"], a:2, why:"10 cm from mirror < 15 cm focal length → inside F."},
  {ask:"An object within F of a concave mirror gives:", o:["Real inverted image","Virtual erect magnified image","No image","Diminished real image"], a:1, why:"Inside F, reflected rays diverge → virtual, erect, magnified."}],
 final:"1/v = −1/15 + 1/10 = 1/30 → v = +30 cm, m = +3: virtual, erect, magnified"},
{id:"i5", ch:"m-prob", q:"Two dice are rolled. What is the probability of getting a sum of 7?",
 steps:[
  {ask:"How many total outcomes exist?", o:["12","36","6","21"], a:1, why:"6 × 6 = 36 ordered pairs."},
  {ask:"Which pairs give sum 7?", o:["(1,6)(2,5)(3,4) only — order matters","6 pairs","12 pairs","1 pair"], a:1, why:"(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)."},
  {ask:"Final probability?", o:["1/6","1/12","7/36","5/36"], a:0, why:"6/36 = 1/6."}],
 final:"P = 6/36 = 1/6"},
{id:"i6", ch:"b-life", q:"Why does the left ventricle have a thicker wall than the right?",
 steps:[
  {ask:"What does each ventricle pump to?", o:["Both to the lungs","Left → body, right → lungs","Left → lungs, right → body","Both to the body"], a:1, why:"Left drives the systemic circuit; right only the pulmonary."},
  {ask:"Which circuit needs higher pressure?", o:["Pulmonary (lungs)","Systemic (whole body)","Both equal","Neither"], a:1, why:"Whole-body resistance exceeds the short lung loop."},
  {ask:"So the thicker wall exists because…", o:["More muscle = more force for the longer circuit","It stores more blood","It beats faster","It receives more blood"], a:0, why:"Muscle thickness scales with pressure demand."}],
 final:"Left ventricle → aorta → entire body: maximum force → maximum muscle"},
{id:"i7", ch:"c-acid", q:"A solution turns red litmus blue. What is its likely pH?",
 steps:[
  {ask:"What does red litmus turning blue indicate?", o:["Acidic solution","Basic solution","Neutral solution","Salt solution"], a:1, why:"Bases turn red litmus blue."},
  {ask:"So its pH must be…", o:["< 7","> 7","= 7","0"], a:1, why:"Basic ⇒ pH above 7."},
  {ask:"From options 2, 5, 7, 11 — which fits?", o:["2","5","11","7"], a:2, why:"Only 11 > 7."}],
 final:"pH = 11"},
{id:"i8", ch:"m-tri", q:"In ΔABC, DE ∥ BC. If AD = 2, DB = 3, AE = 4, find EC.",
 steps:[
  {ask:"Which theorem applies?", o:["Pythagoras","Basic Proportionality Theorem","Area formula","Midpoint theorem"], a:1, why:"A parallel line to one side cutting the other two → BPT."},
  {ask:"What ratio does BPT give here?", o:["AD/AE = DB/EC","AD/DB = AE/EC","AD/EC = AE/DB","AB/AD = AC/AE"], a:1, why:"Segments of each side are proportional: AD/DB = AE/EC."},
  {ask:"What must you NOT do?", o:["Cross-multiply correctly","Criss-cross the two sides' segments","Keep same-side ratios","Substitute values"], a:1, why:"Criss-crossing (AD/DB = EC/AE) is the classic error — it's false."}],
 final:"2/3 = 4/EC → EC = 6"}

"use strict";

const DEFAULT_STATE = {

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const s = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), s);
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const DIFF_NAME=["","Basic","Standard","Advanced","Challenge"];

/* ---------- mastery (multi-component, never from volume alone) ---------- */
function chRec(chId){ if(!S.progress[chId]) S.progress[chId]={notesS:false,notesL:{},qc:{r:0,w:0},pr:{r:0,w:0},sv:{r:0,w:0},rev:{r:0,w:0},mk:{r:0,w:0}}; const p=S.progress[chId]; for(const k of ["qc","pr","sv","rev","mk"]){ if(!p[k])p[k]={r:0,w:0}; } if(!p.notesL)p.notesL={}; return p; }
function acc(r){ return (r.r+r.w)===0 ? 0 : Math.round(100*r.r/(r.r+r.w)); }
function masteryOf(chId){
  const p = chRec(chId);
  const note = p.notesS?70:0, noteL = Math.min(1, Object.keys(p.notesL).length/4)*70;
  const notes = Math.max(note, noteL);
  const parts = {
    notes: notes,                 // weight 20
    qc: acc(p.qc),               // 15 — concept checks
    pr: acc(p.pr),                // 25 — practice
    sv: acc(p.sv),                // 25 — solving
    rev: acc(p.rev),              // 10 — revision
    mk: acc(p.mk)                 // 5  — mock tests
  };
  const touched = (parts.notes>0) + (p.qc.r+p.qc.w>0) + (p.pr.r+p.pr.w>0) + (p.sv.r+p.sv.w>0) + (p.rev.r+p.rev.w>0) + (p.mk.r+p.mk.w>0);
  if(touched===0) return 0;
  // weighted average, only over touched components rescaled
  const W = {notes:20, qc:15, pr:25, sv:25, rev:10, mk:5};
  let num=0, den=0;
  if(parts.notes>0){ num+=W.notes*parts.notes; den+=W.notes; }
  for(const k of ["qc","pr","sv","rev","mk"]){ if((p[k].r+p[k].w)>0){ num+=W[k]*parts[k]; den+=W[k]; } }
  return den? Math.min(100, Math.round(num/den)) : 0;
}
function overallMastery(){
  const chs = SUBJECTS.flatMap(s=>s.chapters.map(c=>c.id));
  const m = chs.map(masteryOf).filter(x=>x>0);
  return m.length? Math.round(m.reduce((a,b)=>a+b,0)/m.length) : 0;
}
function overallStats(){
  let r=0,w=0,answered=0; const H=S.history;
  for(const h of H){ if(h.correct!==null){ answered++; if(h.correct)r++; else w++; } }
  return {solved:answered, right:r, wrong:w, accuracy: answered? Math.round(100*r/answered):0};
}
function touchStreak(){
  const t = todayKey();
  if(S.streak.last === t) return;
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak.count = (S.streak.last === y) ? S.streak.count+1 : 1;
  S.streak.last = t; saveState();
}

/* ---------- adaptive difficulty ---------- */
function adaptiveLevel(chId){
  const a = S.adaptive[chId] || (S.adaptive[chId] = {level: S.settings.diffPref||2, recent:[]});
  return a.level;
}
function recordAdaptive(chId, correct){
  const a = S.adaptive[chId] || (S.adaptive[chId] = {level: S.settings.diffPref||2, recent:[]});
  a.recent.push(correct); if(a.recent.length>8) a.recent.shift();
  const last5 = a.recent.slice(-5);
  if(last5.length>=5){
    const pct = last5.filter(Boolean).length/5;
    if(pct>=0.8 && a.level<4){ a.level++; a.recent=[]; toast("📈 Difficulty increased: "+DIFF_NAME[a.level]); }
    else if(pct<=0.4 && a.level>1){ a.level--; a.recent=[]; toast("📉 Difficulty eased — revise the notes first"); }
  }
}
/* ---------- spaced revision ---------- */
const REV_STEPS=[0,1,3,7,14,30];
function scheduleRevision(chId, didWell){
  const cur = S.revision[chId] || {stage:0, next:Date.now()};
  if(didWell && cur.stage < REV_STEPS.length-1) cur.stage++;
  if(!didWell) cur.stage = Math.max(0, cur.stage-1); // poor performance brings it back earlier
  cur.next = Date.now() + REV_STEPS[cur.stage]*864e5;
  S.revision[chId]=cur; saveState();
}
function revisionsDue(){
  const now=Date.now();
  return Object.keys(S.revision).filter(k=>{
    const c=chapOf(k); return c && S.revision[k].next<=now && masteryOf(k)>0;
  }).map(k=>({ch:k, ...S.revision[k]}));
}

/* ---------- ROUTER ---------- */
const ROUTES=[];
function route(path, fn){ ROUTES.push({re:new RegExp("^"+path.replace(/:[^/]+/g,"([^/]+)")+"$"), fn, parts:path.split("/").filter(p=>p.startsWith(":")).map(p=>p.slice(1))}); }
function nav(path){ location.hash = "#"+path; }
window.addEventListener("hashchange", render);
function render(){
  const path = (location.hash||"#/home").slice(1).replace(/\/$/,"") || "/home";
  closeSheet();
  let matched=false;
  for(const r of ROUTES){
    const m = path.match(r.re);
    if(m){
      const args={}; r.parts.forEach((p,i)=>args[p]=decodeURIComponent(m[i+1]));
      try{ r.fn(args); }catch(err){ console.error(err); $("#view").innerHTML='<div class="empty"><div class="e-ico">⚠️</div>Something went wrong rendering this screen.</div>'; }
      matched=true; break;
    }
  }
  if(!matched) $("#view").innerHTML='<div class="empty"><div class="e-ico">🧭</div>Page not found.</div>';
  window.scrollTo(0,0);
  $$(".nav-item").forEach(n=>n.classList.toggle("active", path.startsWith("/"+n.dataset.nav)));
  const mainTab = path.split("/")[1];
  $$(".nav-item").forEach(n=>n.classList.toggle("active", n.dataset.nav===mainTab || (n.dataset.nav==="home"&&path==="/home")));
}

function renderNoteItem(it){
  if(typeof it==="string") return `<li style="margin:6px 0 6px 4px;padding-left:16px;position:relative"><span style="position:absolute;left:0;color:var(--primary)">▸</span>${it}</li>`;
  if(it.h) return `<div style="font-weight:800;margin:14px 0 6px;letter-spacing:.3px;color:var(--primary);text-transform:uppercase;font-size:var(--fs-xs)">${esc(it.h)}</div>`;
  if(it.f) return `<div class="formula">${esc(it.f)}</div>`;
  if(it.x) return `<div class="mistake-callout"><b>⚠️ Common mistake:</b> ${esc(it.x)}</div>`;
  if(it.e) return `<div class="exam-callout"><b>🎓 Exam point:</b> ${esc(it.e)}</div>`;
  if(it.w) return `<div class="why-callout"><b>💡 Why:</b> ${esc(it.w)}</div>`;
  if(it.tbl){ return `<div style="overflow-x:auto;margin:8px 0"><table class="tbl"><thead><tr>${it.tbl[0].map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${it.tbl.slice(1).map(r=>`<tr>${r.map(cell=>`<td>${esc(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
  if(it.qc){ return renderQuickCheck(it.qc); }
  return "";
}

}
