function hashId(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return "x"+h.toString(36); }

/* ---------- NOTES RENDERER ---------- */
function renderNoteItem(it){
  if(typeof it==="string") return `<li style="margin:6px 0 6px 4px;padding-left:16px;position:relative"><span style="position:absolute;left:0;color:var(--primary)">▸</span>${it}</li>`;
  if(it.h) return `<div style="font-weight:800;margin:14px 0 6px;letter-spacing:.3px;color:var(--primary);text-transform:uppercase;font-size:var(--fs-xs)">${esc(it.h)}</div>`;
  if(it.f) return `<div class="formula">${esc(it.f)}</div>`;
  if(it.x) return `<div class="mistake-callout"><b>⚠️ Common mistake:</b> ${esc(it.x)}</div>`;
  if(it.e) return `<div class="exam-callout"><b>🎓 Exam point:</b> ${esc(it.e)}</div>`;
  if(it.w) return `<div class="why-callout"><b>💡 Why:</b> ${esc(it.w)}</div>`;
  if(it.tbl){ return `<div style="overflow-x:auto;margin:8px 0"><table class="tbl"><thead><tr>${it.tbl[0].map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${it.tbl.slice(1).map(r=>`<tr>${r.map(cell=>`<td>${esc(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
  if(it.qc){ return renderQuickCheck(it.qc); }
  return "";
}
let _qcCache={};
function renderQuickCheck(qc){
  const qid="qc"+Math.random().toString(36).slice(2,8);
  _qcCache[qid]=qc;
  return `<div class="card" style="margin:10px 0;background:var(--surface2);border:1.5px dashed var(--border2)" id="${qid}">
    <b class="small">🧩 Quick Check</b>
    <p style="margin:8px 0">${esc(qc.q)}</p>
    ${qc.o.map((o,i)=>`<button class="opt" style="padding:9px 12px" onclick="answerQC('${qid}',${i},this)"><span class="opt-key">${"ABCD"[i]||"E"}</span><span>${esc(o)}</span></button>`).join("")}
  </div>`;
}
function answerQC(qid, i, el){
  const qc=_qcCache[qid]; const box=document.getElementById(qid);
  const btns=box.querySelectorAll(".opt");
  btns.forEach((b,j)=>{ b.disabled=true; if(j===qc.a)b.classList.add("right"); });
  if(i===qc.a){ el.classList.add("right"); const p=chRec(_qcCh); p.qc.r++; }
  else{ el.classList.add("wrong"); const p=chRec(_qcCh); p.qc.w++; }
  saveState();
  const msg=document.createElement("div"); msg.className="hint-box"; msg.style.marginTop="8px";
  msg.innerHTML = i===qc.a? "✅ Correct!" : "❌ Not quite — the answer is "+"ABCD"[qc.a]+". "+esc(qc.expl||"");
  box.appendChild(msg);
}
let _qcCh=null;
route("/notes/:ch/:mode", (a)=>{
  const c=chapOf(a.ch); if(!c){nav("/learn");return;}
  _qcCh=a.ch;
  const notes=NOTES[a.ch]||{short:[],long:[]};
  const isShort=a.mode==="short";
  if(isShort && notes.short.length) { const p=chRec(a.ch); p.notesS=true; saveState(); }
  if(!isShort){ const p=chRec(a.ch); p.notesL["overview"]=true; saveState(); }
  let body="";
  if(isShort){
    body = notes.short.length
      ? `<div style="padding-left:4px"><ul style="list-style:none">${notes.short.map(renderNoteItem).join("")}</ul></div>
         <button class="btn primary block" style="margin-top:16px" onclick="reviseNow('${a.ch}')">✅ I've revised this — mark done</button>`
      : emptyNotes();
  } else {
    body = notes.long && notes.long.length
      ? notes.long.map((blk,i)=>`<div class="topic-block">
          <h3><span class="tag-num">${i+1}</span>${esc(blk.t)}</h3>
          ${blk.s.map(sec=>{
            let h="";
            if(sec.d) h+=`<p style="margin:8px 0"><b>What is it?</b> ${sec.d}</p>`;
            if(sec.why) h+=`<div class="why-callout"><b>Why does it work?</b> ${sec.why}</div>`;
            if(sec.how) h+=`<div class="card" style="margin:10px 0;background:var(--surface2)"><b class="small">🪜 How — step by step</b><ol style="margin:8px 0 0 20px">${sec.how.map(s2=>`<li style="margin:5px 0">${s2}</li>`).join("")}</ol></div>`;
            if(sec.terms) h+=`<div style="margin:10px 0">${Object.entries(sec.terms).map(([k,v])=>`<div class="small" style="padding:5px 0"><b class="progress-c">${esc(k)}</b> — ${esc(v)}</div>`).join("")}</div>`;
            if(sec.ex) h+=`<div class="card" style="margin:10px 0"><b class="small">📌 Example</b><div style="margin-top:6px;white-space:pre-line">${sec.ex}</div></div>`;
            if(sec.rw) h+=`<p class="small muted" style="margin:8px 0"><b>🌍 Real world:</b> ${sec.rw}</p>`;
            if(sec.mis) h+=`<div class="mistake-callout"><b>⚠️ Common misconception:</b> ${sec.mis}</div>`;
            if(sec.exam) h+=`<div class="exam-callout"><b>🎓 Exam perspective:</b> ${sec.exam}</div>`;
            if(sec.f) h+=`<div class="formula">${esc(sec.f)}</div>`;
            if(sec.qc){ const qcs = Array.isArray(sec.qc)? sec.qc : [sec.qc]; h+=qcs.map(renderQuickCheck).join(""); }
            return h;}).join("")}
        </div>`).join("")
      : `<div class="card">${noDeepNotes(c)}<div style="overflow:hidden;padding-left:4px"><ul style="list-style:none">${notes.short.map(renderNoteItem).join("")}</ul></div></div>`;
  }
  $("#view").innerHTML = `
  <button class="btn ghost sm" onclick="nav('/learn/ch/${a.ch}')" style="margin-bottom:var(--s4)">← ${esc(c.name)}</button>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:var(--s4)">
    <h1>${isShort?"⚡ Short Notes":"🧠 Long Notes"}</h1>
    <span class="badge ${isShort?'std':'found'}">${isShort?"REVISION MODE":"UNDERSTANDING MODE"}</span>
  </div>
  <p class="muted small" style="margin-bottom:var(--s4)">${isShort?esc(c.name)+" — quick revision":esc(c.name)+" — built for deep understanding"}</p>
  <div class="tab-row">
    <div class="tab ${isShort?'':'active'}" onclick="nav('/notes/${a.ch}/long')">🧠 Long</div>
    <div class="tab ${isShort?'active':''}" onclick="nav('/notes/${a.ch}/short')">⚡ Short</div>
  </div>
  ${body}`;
  $("#hdrTitle").textContent=(isShort?"⚡ ":"🧠 ")+c.name;
});
function emptyNotes(){ return `<div class="empty"><div class="e-ico">📚</div>Short notes for this chapter are being written — use the textbook + concepts list for now.</div>`; }
function noDeepNotes(c){ return `<div class="exam-callout" style="margin-bottom:12px"><b>ℹ️ Deep dive in progress:</b> The full 9-part breakdown for this chapter is being expanded. Meanwhile, here are the complete revision notes with every key point:</div>`; }
function reviseNow(chId){
  const p=chRec(chId); p.rev.r++; saveState();
  scheduleRevision(chId, true);
  toast("🔄 Revision logged — next review scheduled");
}
</script>

<script>
/* ================================================================
   SOLVE — teaches HOW to solve. Guided workflow + hint ladder.
   ================================================================ */
let SOLVE = null; // active solving session
route("/solve", ()=>{
  const chs = SUBJECTS.flatMap(s=>s.chapters.map(c=>({c, s}))).filter(x=>qsFor(x.c.id).length);
  $("#view").innerHTML = `
  <div style="margin-bottom:var(--s4)"><h1>✍️ Solve</h1>
  <p class="muted">Guided problem solving — hints first, answers last.</p></div>
  <div class="card" style="margin-bottom:var(--s5);background:var(--surface2)">
    <b>How it works</b>
    <div class="flow" style="margin-top:10px">
      <span class="f-step">1 · Understand</span><span class="f-arrow">→</span>
      <span class="f-step">2 · Concept</span><span class="f-arrow">→</span>
      <span class="f-step">3 · Method</span><span class="f-arrow">→</span>
      <span class="f-step">4 · Solve</span>
    </div>
  </div>
  <div class="section-title"><h2>Pick a chapter</h2></div>
  ${chs.map(x=>`<div class="row tap" style="margin-bottom:8px" onclick="startSolve('${x.c.id}')">
    <div class="subj-icon" style="background:${x.s.color}22">${x.s.icon}</div>
    <div class="grow"><b>${esc(x.c.name)}</b><div class="small muted">${qsFor(x.c.id).length} guided questions</div></div>
    <span class="faint">→</span></div>`).join("")}
  <div class="section-title"><h2>🧠 Interpretation Trainer</h2></div>
  <button class="btn primary block" onclick="nav('/interpret')">Train 'What is the question asking?'</button>`;
  $("#hdrTitle").textContent="Solve";
});
route("/solve/:ch", ()=>{ startSolve(location.hash.split("/")[2]); });

function startSolve(chId){
  if(chId && !chapOf(chId)) chId=null;
  if(!chId){ nav("/solve"); return; }
  const qs = shuffle(qsFor(chId).map(q=>q.id));
  if(!qs.length){ toast("No questions for this chapter yet"); nav("/solve"); return; }
  SOLVE = { ch:chId, ids:qs, i:0, hints:0, correctCount:0, wrongCount:0 };
  nav("/solve/session");
}
route("/solve/session", ()=>{
  if(!SOLVE){ nav("/solve"); return; }
  const q = QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  if(!q){ solveSummary(); return; }
  const c=chapOf(SOLVE.ch), s=subjOf(SOLVE.ch);
  const revealed = SOLVE.hints;
  $("#view").innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)">
    <span class="small muted">Question ${SOLVE.i+1} of ${SOLVE.ids.length} · ${esc(c.name)}</span>
    <span class="small muted">${DIFF_DOTS[q.d]} ${DIFF_NAME[q.d]}</span>
  </div>
  <div class="pbar" style="margin-bottom:var(--s5)"><div style="width:${Math.round(100*SOLVE.i/SOLVE.ids.length)}%"></div></div>
  <div class="q-card" style="position:relative">
    <button class="flag-btn ${S.bookmarks.some(b=>b.type==="question"&&b.id===q.id)?'on':''}" onclick="toggleBookmark('question','${q.id}','${q.ch}')" aria-label="Bookmark" title="Bookmark">★</button>
    <div class="q-meta"><span class="badge board">🏫 Board</span>${q.found?'<span class="badge found">🧠 Foundation</span>':""}</div>
    <p style="font-size:var(--fs-md);font-weight:600">${esc(q.q)}</p>
    <div id="solveSteps" style="margin-top:var(--s4)"></div>
    <div class="divider"></div>
    <div id="hintArea"></div>
    <div class="btn-row" style="margin-top:var(--s3)">
      ${q.o.length? "":`<button class="btn" onclick="showSelfAssess()">I've solved it — check myself</button>`}
      ${revealed<3? `<button class="btn primary" id="hintBtn" onclick="nextHint()">💡 Hint ${revealed+1}</button>`:""}
      ${q.o.length? `<button class="btn primary" onclick="showOptions()">Choose answer</button>`:""}
      <button class="btn ghost" onclick="showSolution(true)">Skip to solution</button>
    </div>
  </div>`;
  $("#hdrTitle").textContent="Solve";
});
function nextHint(){
  const q=QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  const lvl=SOLVE.hints;
  const labels=["💡 Hint 1 — Direction","🔎 Hint 2 — Method","🧩 Hint 3 — Next step"];
  if(lvl>2) return;
  SOLVE.hints++;
  const h=[q.h1,q.h2,q.h3][lvl];
  $("#hintArea").insertAdjacentHTML("beforeend",`<div class="hint-box"><b>${labels[lvl]}</b><br>${esc(h||"Think about what's given and what's required.")}</div>`);
  if(SOLVE.hints>=3){ const b=$("#hintBtn"); if(b)b.remove(); }
}
function showSelfAssess(){
  openSheet(`
    <h3 style="margin-bottom:10px">How did it go?</h3>
    <p class="small muted" style="margin-bottom:14px">Be honest — this drives your mastery and revision schedule.</p>
    <div class="btn-row">
      <button class="btn success" onclick="selfAssess(true)">✅ I got it right</button>
      <button class="btn danger" onclick="selfAssess(false)">❌ I got it wrong</button>
    </div>`);
}
function selfAssess(ok){
  closeSheet();
  const q=QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  logAnswer(q, ok, "sv");
  SOLVE[ok?"correctCount":"wrongCount"]++;
  showSolution(ok);
}
function showOptions(){
  const q=QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  $("#solveSteps").innerHTML = `<div style="margin-top:8px">${q.o.map((o,i)=>`<button class="opt" onclick="solvePick(${i},this)"><span class="opt-key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
}
function solvePick(i, el){
  const q=QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  const ok = i===q.a;
  el.parentNode.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(j===q.a)b.classList.add("right"); });
  el.classList.add(ok?"right":"wrong");
  logAnswer(q, ok, "sv");
  SOLVE[ok?"correctCount":"wrongCount"]++;
  showSolution(ok, !ok);
}
function showSolution(correct, wasWrong){
  const q=QUESTIONS.find(x=>x.id===SOLVE.ids[SOLVE.i]);
  const qEl=$("#solveSteps"); if(!qEl) return;
  let html=`<div class="sol-box">
    <b>${correct?"✅ Nice work":"❌ Let's diagnose"}</b>`;
  if(!correct){
    html+=`<div class="mistake-callout" style="margin-top:8px">
      ${wasWrong? "Possible reasons: you may have used the wrong formula, made a calculation slip, or misread what's asked.":"Self-assessment logged — check the steps below against your working."}
      ${q.concept? "<br><b>Review:</b> "+esc(q.concept):""}
    </div>`;
  }
  html+=`<div style="margin-top:10px"><b>Given:</b> read the question again and list the data</div>`;
  html+=`<div class="sol-step"><b>Concept:</b><span>${esc(q.concept||"—")}</span></div>`;
  if(q.sol && q.sol.length){
    html+=`<div style="margin-top:8px"><b>Solution:</b></div>`+
      q.sol.map((s2,i)=>`<div class="sol-step"><b>${i+1}.</b><span>${esc(s2)}</span></div>`).join("");
  }
  if(q.ans || (q.a>=0 && q.o && q.o.length)){
    const ansTxt = q.o && q.o.length? "ABCD"[q.a]+") "+q.o[q.a] : q.ans;
    html+=`<div class="sol-step" style="margin-top:6px"><b>Answer:</b><span>${esc(ansTxt)}</span></div>`;
  }
  html+=`</div>
  <div class="exam-callout" style="margin-top:10px"><b>🎓 Takeaway:</b> ${esc(q.exp||"")}</div>
  <button class="btn primary block" style="margin-top:14px" onclick="nextSolveQ()">Next question →</button>`;
  $("#hintArea").innerHTML="";
  qEl.insertAdjacentHTML("beforeend", html);
}
function nextSolveQ(){
  SOLVE.i++; SOLVE.hints=0;
  nav("/solve/session");
}
function solveSummary(){
  const c=chapOf(SOLVE.ch);
  const tot=SOLVE.correctCount+SOLVE.wrongCount;
  $("#view").innerHTML=`
  <div class="confetti-ico">${SOLVE.wrongCount===0?"🏆":"📖"}</div>
  <h1 style="text-align:center">Solving complete</h1>
  <p class="muted" style="text-align:center;margin:8px 0 20px">${esc(c.name)}</p>
  <div class="grid-3" style="margin-bottom:var(--s5)">
    <div class="stat"><div class="v">${SOLVE.correctCount}</div><div class="l">Solved</div></div>
    <div class="stat"><div class="v">${SOLVE.wrongCount}</div><div class="l">Missed</div></div>
    <div class="stat"><div class="v">${tot?Math.round(100*SOLVE.correctCount/tot):0}%</div><div class="l">Rate</div></div>
  </div>
  <button class="btn primary block" onclick="nav('/learn/ch/${SOLVE.ch}')">Back to chapter</button>
  <button class="btn ghost block" style="margin-top:10px" onclick="startSolve('${SOLVE.ch}')">Solve again (new order)</button>`;
}

/* log an answer: history + component + adaptive + streak + daily */
function logAnswer(q, correct, comp){
  S.history.push({qid:q.id, correct:!!correct, ts:Date.now(), mode:comp});
  const p=chRec(q.ch); p[comp][correct?"r":"w"]++;
  if(!correct) offerMistakeSave(q);
  recordAdaptive(q.ch, correct);
  touchStreak();
  saveState();
}

/* ---------- MISTAKE NOTEBOOK save prompt ---------- */
function offerMistakeSave(q){
  if(S.mistakes.some(m=>m.qid===q.id && !m.resolved)) return; // already noted
  window._pendingMistake=q;
  setTimeout(()=>{ if(!window._pendingMistake) return;
    openSheet(`
    <h3>❌ Save to Mistake Notebook?</h3>
    <p class="small muted" style="margin:8px 0 14px">Diagnosing mistakes is how you stop repeating them. What type of mistake was it?</p>
    ${["Concept mistake","Formula mistake","Calculation mistake","Reading mistake","Method-selection mistake","Careless mistake","Memory mistake","Unit mistake","Logic mistake"].map((m,i)=>`<button class="chip" style="margin:0 6px 8px 0" onclick="saveMistake(${i})">${m}</button>`).join("")}
    <div style="margin-top:12px"><button class="btn ghost sm" onclick="dismissMistake()">Not now</button></div>`);
  }, 600);
}
function dismissMistake(){ window._pendingMistake=null; closeSheet(); }
function saveMistake(idx){
  const q=window._pendingMistake; if(!q) return;
  const types=["Concept mistake","Formula mistake","Calculation mistake","Reading mistake","Method-selection mistake","Careless mistake","Memory mistake","Unit mistake","Logic mistake"];
  const existing=S.mistakes.find(m=>m.qid===q.id);
  if(existing){ existing.type=types[idx]; }
  else S.mistakes.push({qid:q.id, type:types[idx], ts:Date.now(), resolved:false, ch:q.ch});
  window._pendingMistake=null;
  closeSheet(); saveState();
  toast("📌 Saved to Mistake Notebook");
}

/* ================================================================
   INTERPRETATION TRAINER — 'What is the question asking?'
   ================================================================ */
let INTERP_S=null;
route("/interpret", ()=>{
  $("#view").innerHTML=`
  <div style="margin-bottom:var(--s4)"><h1>🧠 Interpretation Trainer</h1>
  <p class="muted">Read the question. Identify given, required, concept — BEFORE solving.</p></div>
  <button class="btn primary block" onclick="startInterp()">Start training (${INTERP.length} questions)</button>
  <div class="card" style="margin-top:var(--s5);background:var(--surface2)">
  <p class="small muted">Great problem-solvers spend the first 15 seconds understanding, not calculating. Every wrong 'given/required' choice here is a mistake you'll avoid in the real exam.</p></div>`;
  $("#hdrTitle").textContent="Trainer";
});
function startInterp(){
  INTERP_S={order:shuffle(INTERP.map(x=>x.id)), i:0, step:0, right:0, total:0};
  nav("/interpret/session");
}
route("/interpret/session", ()=>{
  if(!INTERP_S){ nav("/interpret"); return; }
  const item=INTERP.find(x=>x.id===INTERP_S.order[INTERP_S.i]);
  if(!item){ interpSummary(); return; }
  const step=item.steps[INTERP_S.step];
  $("#view").innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)">
    <span class="small muted">Case ${INTERP_S.i+1} / ${INTERP_S.order.length}</span>
    <span class="small muted">Step ${INTERP_S.step+1} of ${item.steps.length}</span>
  </div>
  <div class="pbar" style="margin-bottom:var(--s5)"><div style="width:${Math.round(100*INTERP_S.i/INTERP_S.order.length)}%"></div></div>
  <div class="q-card">
    <div class="q-meta"><span class="badge board">🧠 READ BEFORE SOLVING</span></div>
    <p style="font-size:var(--fs-md);font-weight:600">${esc(item.q)}</p>
    <div class="divider"></div>
    <b class="progress-c" style="display:block;margin-bottom:10px">${esc(step.ask)}</b>
    ${step.o.map((o,i)=>`<button class="opt" onclick="interpPick(${i},this)"><span class="opt-key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}
    <div id="interpFb"></div>
  </div>`;
  $("#hdrTitle").textContent="Trainer";
});
function interpPick(i, el){
  const item=INTERP.find(x=>x.id===INTERP_S.order[INTERP_S.i]);
  const step=item.steps[INTERP_S.step];
  const ok=i===step.a;
  INTERP_S.total++; if(ok)INTERP_S.right++;
  el.parentNode.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(j===step.a)b.classList.add("right"); });
  if(!ok) el.classList.add("wrong");
  $("#interpFb").innerHTML=`<div class="hint-box">${ok?"✅":"❌"} ${esc(step.why)}</div>
    <button class="btn primary block" style="margin-top:10px" onclick="interpNext()">${INTERP_S.step<item.steps.length-1?"Next step →":"See full solution →"}</button>`;
}
function interpNext(){
  const item=INTERP.find(x=>x.id===INTERP_S.order[INTERP_S.i]);
  if(INTERP_S.step < item.steps.length-1){
    INTERP_S.step++; nav("/interpret/session");
  } else {
    const c=chapOf(item.ch)||{name:""};
    chRec(item.ch).qc.r++; saveState();
    $("#view").innerHTML=`
    <div class="confetti-ico">🎯</div>
    <h2 style="text-align:center">Question fully decoded</h2>
    <div class="card" style="margin:var(--s5) 0">
      <b>The complete method:</b>
      <div class="sol-box" style="margin-top:10px">${esc(item.final)}</div>
    </div>
    <button class="btn primary block" onclick="interpAdvance()">Next case →</button>`;
  }
}
function interpAdvance(){ INTERP_S.i++; INTERP_S.step=0; nav("/interpret/session"); }
function interpSummary(){
  const pct=INTERP_S.total? Math.round(100*INTERP_S.right/INTERP_S.total):0;
  $("#view").innerHTML=`
  <div class="confetti-ico">${pct>=80?"🏅":"🧠"}</div>
  <h1 style="text-align:center">Interpretation: ${pct}%</h1>
  <p class="muted" style="text-align:center;margin:10px 0 20px">${INTERP_S.right} of ${INTERP_S.total} recognition steps correct</p>
  <p class="small muted" style="text-align:center;margin-bottom:var(--s5)">Notice how the answer 'appeared' once given/required/concept were clear? That's the skill.</p>
  <button class="btn primary block" onclick="startInterp()">Train again</button>
  <button class="btn ghost block" style="margin-top:10px" onclick="nav('/home')">Done</button>`;
}
</script>

<script>
/* ================================================================
   PRACTICE — adaptive sets with filters
   ================================================================ */
let PRAC=null;
route("/practice", ()=>{ practiceConfig(null); });
route("/practice/:ch", (a)=>{ practiceConfig(a.ch); });
function practiceConfig(chId){
  if(chId && !chapOf(chId)) chId=null;
  const chs=SUBJECTS.flatMap(s=>s.chapters.map(c=>({c,s}))).filter(x=>qsFor(x.c.id).length);
  const sel=chId? chs.find(x=>x.c.id===chId):null;
  $("#view").innerHTML=`
  <div style="margin-bottom:var(--s4)"><h1>📝 Practice</h1>
  <p class="muted">Assessment mode — difficulty adapts to your performance.</p></div>
  <div class="card">
    <label class="small" style="font-weight:700;display:block;margin-bottom:6px">Subject & Chapter</label>
    <select class="inp" id="prCh" onchange="prUpdDiff()">
      <option value="">— Choose a chapter —</option>
      ${SUBJECTS.map(s=>`<optgroup label="${esc(s.icon+" "+s.name)}">${s.chapters.map(c=>`<option value="${c.id}" ${chId===c.id?"selected":""}>${esc(c.name)} (${qsFor(c.id).length}Q)</option>`).join("")}</optgroup>`).join("")}
    </select>
    <label class="small" style="font-weight:700;display:block;margin:14px 0 6px">Difficulty</label>
    <div class="chip-row" id="prDiff">
      ${[1,2,3,4].map(d=>`<button class="chip ${d===(chId?adaptiveLevel(chId):S.settings.diffPref)?"sel":""}" data-d="${d}" onclick="prSetDiff(this)">${DIFF_DOTS[d]} ${DIFF_NAME[d]}</button>`).join("")}
    </div>
    <label class="small" style="font-weight:700;display:block;margin:14px 0 6px">Number of questions</label>
    <div class="chip-row" id="prN">
      ${[5,10,20].map(n=>`<button class="chip ${n===10?"sel":""}" data-n="${n}" onclick="prSetN(this)">${n}</button>`).join("")}
    </div>
    <button class="btn primary block" style="margin-top:var(--s5)" onclick="startPractice()">Start Practice</button>
  </div>
  <div class="card" style="margin-top:var(--s4);background:var(--surface2)">
    <p class="small muted">🎯 <b>Adaptive engine:</b> answer 5 in a row well and difficulty rises; struggle and it eases you back to solid ground. Your last level per chapter is remembered.</p>
  </div>`;
  $("#hdrTitle").textContent="Practice";
}
function prSetDiff(el){ el.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel")); el.classList.add("sel"); }
function prSetN(el){ el.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel")); el.classList.add("sel"); }
function prUpdDiff(){
  const chId=$("#prCh").value; if(!chId) return;
  const lvl=adaptiveLevel(chId);
  $$("#prDiff .chip").forEach(c=>c.classList.toggle("sel", +c.dataset.d===lvl));
}
function startPractice(){
  const chId=$("#prCh").value;
  if(!chId){ toast("Pick a chapter first"); return; }
  const d=+($("#prDiff .chip.sel")?.dataset.d || adaptiveLevel(chId));
  const n=+($("#prN .chip.sel")?.dataset.n || 10);
  let pool=qsFor(chId);
  // adaptive: prefer chosen difficulty, widen if short
  let sel=shuffle(pool.filter(q=>q.d===d));
  if(sel.length<n) sel=sel.concat(shuffle(pool.filter(q=>Math.abs(q.d-d)===1)));
  if(sel.length<n) sel=sel.concat(shuffle(pool.filter(q=>Math.abs(q.d-d)>1)));
  sel=sel.slice(0,n);
  if(!sel.length){ toast("No questions available"); return; }
  PRAC={ch:chId, ids:sel.map(q=>q.id), i:0, right:0, wrong:0, t0:Date.now()};
  nav("/practice/session");
}
route("/practice/session", ()=>{
  if(!PRAC){ nav("/practice"); return; }
  const q=QUESTIONS.find(x=>x.id===PRAC.ids[PRAC.i]);
  if(!q){ practiceSummary(); return; }
  const c=chapOf(PRAC.ch);
  $("#view").innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)">
    <span class="small muted">${PRAC.i+1} / ${PRAC.ids.length} · ${esc(c.name)}</span>
    <span class="small muted">${DIFF_DOTS[q.d]} ${DIFF_NAME[q.d]}</span>
  </div>
  <div class="pbar" style="margin-bottom:var(--s5)"><div style="width:${Math.round(100*PRAC.i/PRAC.ids.length)}%"></div></div>
  <div class="q-card" style="position:relative">
    <button class="flag-btn ${S.bookmarks.some(b=>b.type==='question'&&b.id===q.id)?'on':''}" onclick="toggleBookmark('question','${q.id}','${q.ch}')" aria-label="Bookmark">★</button>
    <div class="q-meta"><span class="badge ${DIFF_BADGE[q.d]}">${DIFF_NAME[q.d]}</span><span class="badge ${q.board?'board':'found'}">${q.board?"🏫 Board":"🧠 Foundation"}</span><span class="badge std">${esc(q.ty)}</span></div>
    <p style="font-size:var(--fs-md);font-weight:600">${esc(q.q)}</p>
    ${q.o.length? q.o.map((o,i)=>`<button class="opt" onclick="pracPick(${i},this)"><span class="opt-key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")
      : `<textarea class="inp" id="pracSA" rows="3" placeholder="Work it out on paper, then compare…" style="margin-top:10px"></textarea>
         <button class="btn primary block" style="margin-top:10px" onclick="pracSelf()">Reveal answer</button>`}
    <div id="pracFb"></div>
  </div>`;
  $("#hdrTitle").textContent="Practice";
});
function pracPick(i, el){
  const q=QUESTIONS.find(x=>x.id===PRAC.ids[PRAC.i]);
  const ok=i===q.a;
  el.parentNode.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(j===q.a)b.classList.add("right"); });
  if(!ok) el.classList.add("wrong");
  logAnswer(q, ok, "pr");
  PRAC[ok?"right":"wrong"]++;
  $("#pracFb").innerHTML=pracFeedback(q, ok);
}
function pracSelf(){
  const q=QUESTIONS.find(x=>x.id===PRAC.ids[PRAC.i]);
  $("#pracFb").innerHTML=`
   <div class="sol-box">
     <b>Reference answer</b>
     <div class="sol-step" style="margin-top:6px"><span>${esc(q.ans||"—")}</span></div>
     ${q.sol? q.sol.map((s2,i)=>`<div class="sol-step"><b>${i+1}.</b><span>${esc(s2)}</span></div>`).join(""):""}
   </div>
   <div class="btn-row" style="margin-top:10px">
     <button class="btn success" onclick="pracMark(true)">✅ I was right</button>
     <button class="btn danger" onclick="pracMark(false)">❌ I was wrong</button>
   </div>`;
}
function pracMark(ok){
  const q=QUESTIONS.find(x=>x.id===PRAC.ids[PRAC.i]);
  logAnswer(q, ok, "pr"); PRAC[ok?"right":"wrong"]++;
  $("#pracFb").insertAdjacentHTML("beforeend", pracNextBtn());
}
function pracFeedback(q, ok){
  return `<div class="sol-box">
    ${ok? "✅ <b>Correct!</b>" : "❌ <b>Not quite.</b> Let's diagnose — did you pick the wrong formula, slip in calculation, or misread the ask?"}
    ${q.concept?`<div class="sol-step" style="margin-top:6px"><b>Concept:</b><span>${esc(q.concept)}</span></div>`:""}
    ${q.sol? q.sol.map((s2,i)=>`<div class="sol-step"><b>${i+1}.</b><span>${esc(s2)}</span></div>`).join(""):""}
    ${(q.o&&q.o.length)? `<div class="sol-step"><b>Answer:</b><span>${esc(q.o[q.a])}</span></div>`: `<div class="sol-step"><b>Answer:</b><span>${esc(q.ans||"")}</span></div>`}
  </div>
  <div class="exam-callout" style="margin-top:10px"><b>🎓</b> ${esc(q.exp||"")}</div>`+pracNextBtn();
}
function pracNextBtn(){ return `<button class="btn primary block" style="margin-top:12px" onclick="pracNext()">Next →</button>`; }
function pracNext(){ PRAC.i++; nav("/practice/session"); }
function practiceSummary(){
  const tot=PRAC.right+PRAC.wrong, pct=tot?Math.round(100*PRAC.right/tot):0;
  const c=chapOf(PRAC.ch);
  const mins=Math.max(1,Math.round((Date.now()-PRAC.t0)/60000));
  scheduleRevision(PRAC.ch, pct>=70);
  $("#view").innerHTML=`
  <div class="confetti-ico">${pct>=80?"🏆":pct>=50?"📈":"🌱"}</div>
  <h1 style="text-align:center">${pct}% accuracy</h1>
  <p class="muted" style="text-align:center;margin:8px 0 20px">${PRAC.right} right · ${PRAC.wrong} wrong · ${mins} min</p>
  <div class="card" style="margin-bottom:var(--s5)">
    <b>What this means</b>
    <p class="small muted" style="margin-top:6px">${pct>=80? "Excellent — the adaptive engine has raised your difficulty. Challenge level awaits.": pct>=50? "Solid base. Review the mistakes below, then run another set.":"Back to the short notes first — rebuild the concepts, then return. The difficulty has been eased."}</p>
    <div class="pbar" style="margin-top:10px"><div style="width:${masteryOf(PRAC.ch)}%"></div></div>
    <div class="small muted" style="margin-top:4px">${esc(c.name)} mastery: ${masteryOf(PRAC.ch)}%</div>
  </div>
  ${S.mistakes.filter(m=>m.ch===PRAC.ch).length? `<div class="section-title"><h2>Recent mistakes here</h2></div>`+S.mistakes.filter(m=>m.ch===PRAC.ch).slice(-3).reverse().map(m=>{
    const q=QUESTIONS.find(x=>x.id===m.qid);
    return `<div class="row" style="margin-bottom:8px"><span>❌</span><div class="grow"><div class="small">${esc(q?q.q:"")}</div><div class="small muted">${esc(m.type)} · ${fmtDate(m.ts)}</div></div></div>`;}).join(""):""}
  <button class="btn primary block" onclick="practiceConfig('${PRAC.ch}')">Practice again</button>
  <button class="btn ghost block" style="margin-top:10px" onclick="nav('/learn/ch/${PRAC.ch}')">Back to chapter</button>`;
}

/* ================================================================
   MOCK TESTS — timed, exam mode, full analysis
   ================================================================ */
let MOCK=null, MOCK_TIMER=null;
route("/mock", ()=>{ mockConfig(null); });
route("/mock/:ch", (a)=>{ mockConfig(a.ch); });
function mockConfig(chId){
  if(chId && !chapOf(chId)) chId=null;
  const totalQ=QUESTIONS.length;
  $("#view").innerHTML=`
  <div style="margin-bottom:var(--s4)"><h1>🧪 Mock Test</h1>
  <p class="muted">Exam conditions: timed, no hints, full analysis after.</p></div>
  <div class="card">
    <label class="small" style="font-weight:700;display:block;margin-bottom:6px">Scope</label>
    <select class="inp" id="mkScope">
      <option value="full">Full syllabus (${totalQ} questions available)</option>
      ${SUBJECTS.map(s=>`<option value="subj:${s.id}" ${chId&&subjOf(chId)&&subjOf(chId).id===s.id?"selected":""}>${esc(s.icon+" "+s.name)}</option>`).join("")}
      ${chId? `<option value="ch:${chId}" selected>${esc(chapOf(chId).name)}</option>`:""}
    </select>
    <label class="small" style="font-weight:700;display:block;margin:14px 0 6px">Length</label>
    <div class="chip-row" id="mkN">
      ${[10,20,40].map(n=>`<button class="chip ${n===10?"sel":""}" data-n="${n}" onclick="prSetN(this)">${n}</button>`).join("")}
      <button class="chip" data-n="999" onclick="prSetN(this)">All</button>
    </div>
    <label class="small" style="font-weight:700;display:block;margin:14px 0 6px">Timer</label>
    <div class="chip-row" id="mkT">
      <button class="chip sel" data-t="60" onclick="prSetDiff(this)">60 s / question</button>
      <button class="chip" data-t="90" onclick="prSetDiff(this)">90 s / question</button>
      <button class="chip" data-t="0" onclick="prSetDiff(this)">No timer</button>
    </div>
    <button class="btn primary block" style="margin-top:var(--s5)" onclick="startMock()">Begin Test</button>
  </div>`;
  $("#hdrTitle").textContent="Mock Test";
}
function startMock(){
  const scope=$("#mkScope").value;
  let pool=QUESTIONS.slice();
  if(scope.startsWith("subj:")) pool=pool.filter(q=>subjOf(q.ch).id===scope.split(":")[1]);
  if(scope.startsWith("ch:")) pool=pool.filter(q=>q.ch===scope.split(":")[1]);
  let n=+($("#mkN .chip.sel")?.dataset.n||10);
  if(n===999||n>pool.length) n=pool.length;
  if(!pool.length){ toast("No questions in this scope"); return; }
  const ids=shuffle(pool.map(q=>q.id)).slice(0,n);
  const perQ=+($("#mkT .chip.sel")?.dataset.t||60);
  MOCK={ids, i:0, answers:{}, t0:Date.now(), timeLimit: perQ? perQ*n : 0, perQ, finished:false};
  nav("/mock/session");
  if(MOCK.timeLimit) startMockTimer();
}
function startMockTimer(){
  clearInterval(MOCK_TIMER);
  MOCK_TIMER=setInterval(()=>{
    if(!MOCK||MOCK.finished){ clearInterval(MOCK_TIMER); return; }
    const left=MOCK.timeLimit*1000-(Date.now()-MOCK.t0);
    const el=$("#mkTimer");
    if(el){
      const m=Math.floor(Math.max(0,left)/60000), s2=Math.floor(Math.max(0,left)%60000/1000);
      el.textContent = m+":"+String(s2).padStart(2,"0");
      el.classList.toggle("urgent", left<30000);
    }
    if(left<=0){ clearInterval(MOCK_TIMER); finishMock(true); }
  },500);
}
route("/mock/session", ()=>{
  if(!MOCK){ nav("/mock"); return; }
  if(MOCK.finished){ mockSummary(); return; }
  const q=QUESTIONS.find(x=>x.id===MOCK.ids[MOCK.i]);
  const answered=Object.keys(MOCK.answers).length;
  $("#view").innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)">
    <span class="small muted">${MOCK.i+1} / ${MOCK.ids.length}</span>
    ${MOCK.timeLimit? `<span class="timer-pill" id="mkTimer">⏱ --:--</span>`:`<span class="small muted">no timer</span>`}
    <button class="btn sm danger" onclick="confirmFinishMock()">End</button>
  </div>
  <div class="pbar" style="margin-bottom:var(--s5)"><div style="width:${Math.round(100*MOCK.i/MOCK.ids.length)}%"></div></div>
  <div class="q-card">
    <div class="q-meta"><span class="badge ${DIFF_BADGE[q.d]}">${DIFF_NAME[q.d]}</span><span class="badge ${q.board?'board':'found'}">${q.board?"🏫 Board":"🧠 Foundation"}</span></div>
    <p style="font-size:var(--fs-md);font-weight:600">${esc(q.q)}</p>
    ${q.o.length? q.o.map((o,i)=>`<button class="opt ${MOCK.answers[q.id]===i?"sel":""}" onclick="mockPick(${i})"><span class="opt-key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")
      : `<textarea class="inp" rows="3" placeholder="Answer on paper — self-mark at the end" style="margin-top:10px"></textarea>`}
  </div>
  <div class="btn-row" style="margin-top:var(--s5)">
    <button class="btn ghost" onclick="mockNav(-1)" ${MOCK.i===0?"disabled":""}>← Previous</button>
    ${MOCK.i<MOCK.ids.length-1? `<button class="btn primary" style="flex:1" onclick="mockNav(1)">Next →</button>`:`<button class="btn success" style="flex:1" onclick="confirmFinishMock()">Finish test ✓</button>`}
  </div>`;
  $("#hdrTitle").textContent="Mock Test";
});
function mockPick(i){
  MOCK.answers[QUESTIONS.find(x=>x.id===MOCK.ids[MOCK.i]).id]=i;
  $$(".opt").forEach((b,j)=>b.classList.toggle("sel", j===i));
}
function mockNav(dir){ MOCK.i=Math.max(0,Math.min(MOCK.ids.length-1,MOCK.i+dir)); nav("/mock/session"); }
function confirmFinishMock(){
  openSheet(`<h3>Finish the test?</h3><p class="small muted" style="margin:8px 0 14px">${Object.keys(MOCK.answers).length} of ${MOCK.ids.length} answered.</p>
  <div class="btn-row"><button class="btn success" onclick="finishMock()">Yes, submit</button><button class="btn ghost" onclick="closeSheet()">Keep going</button></div>`);
}
function finishMock(timeUp){
  closeSheet();
  MOCK.finished=true; clearInterval(MOCK_TIMER);
  const secs=Math.round((Date.now()-MOCK.t0)/1000);
  let right=0,wrong=0,unanswered=0;
  const byCh={}, byMistake={};
  for(const id of MOCK.ids){
    const q=QUESTIONS.find(x=>x.id===id);
    const a=MOCK.answers[id];
    const rec=byCh[q.ch]||(byCh[q.ch]={r:0,w:0});
    if(a===undefined){ unanswered++; continue; }
    if(a===q.a){ right++; rec.r++; const p=chRec(q.ch); p.mk.r++; }
    else{ wrong++; rec.w++; const p=chRec(q.ch); p.mk.w++;
      if(q.mis) byMistake[q.mis]=(byMistake[q.mis]||0)+1; }
    S.history.push({qid:id, correct:a===q.a, ts:Date.now(), mode:"mk"});
  }
  saveState();
  MOCK.result={right,wrong,unanswered,secs,byCh,byMistake,timeUp:!!timeUp};
  touchStreak();
  for(const ch of Object.keys(byCh)) scheduleRevision(ch, byCh[ch].r>=byCh[ch].w);
  nav("/mock/session");
}
function mockSummary(){
  const R=MOCK.result;
  const tot=R.right+R.wrong+R.unanswered;
  const acc=R.right+R.wrong? Math.round(100*R.right/(R.right+R.wrong)):0;
  const perQ=R.secs/tot;
  const strong=Object.entries(R.byCh).filter(([k,v])=>v.r>v.w).map(([k])=>chapOf(k).name);
  const weak=Object.entries(R.byCh).filter(([k,v])=>v.w>=v.r).map(([k])=>chapOf(k).name);
  const topMistakes=Object.entries(R.byMistake).sort((a,b)=>b[1]-a[1]).slice(0,3);
  $("#view").innerHTML=`
  <div class="confetti-ico">${acc>=80?"🏆":acc>=50?"📈":"🌱"}</div>
  <h1 style="text-align:center">${R.right} / ${tot}</h1>
  <p class="muted" style="text-align:center;margin:6px 0 20px">${acc}% accuracy · ${Math.round(perQ)}s per question ${R.timeUp?"· ⏰ time ran out":""}</p>
  <div class="grid-3" style="margin-bottom:var(--s5)">
    <div class="stat"><div class="v" style="color:var(--success)">${R.right}</div><div class="l">Correct</div></div>
    <div class="stat"><div class="v" style="color:var(--danger)">${R.wrong}</div><div class="l">Wrong</div></div>
    <div class="stat"><div class="v" style="color:var(--text3)">${R.unanswered}</div><div class="l">Skipped</div></div>
  </div>
  ${strong.length?`<div class="card" style="margin-bottom:10px"><b style="color:var(--success)">💪 Strong areas</b><p class="small muted" style="margin-top:4px">${strong.map(esc).join(", ")}</p></div>`:""}
  ${weak.length?`<div class="card" style="margin-bottom:10px"><b style="color:var(--warn)">⚠️ Weak areas</b><p class="small muted" style="margin-top:4px">${weak.map(esc).join(", ")}</p></div>`:""}
  ${topMistakes.length?`<div class="card" style="margin-bottom:10px"><b>🔍 Mistake pattern</b><p class="small muted" style="margin-top:4px">${topMistakes.map(([m,n])=>esc(m)+" ×"+n).join(" · ")}</p></div>`:""}
  <div class="card" style="background:var(--surface2)"><b>📋 Recommended next step</b>
    <p class="small muted" style="margin-top:4px">${weak.length? "Revise short notes for "+esc(weak[0])+", then re-run a chapter test.":"Raise difficulty in practice mode or try a full-syllabus mock."}</p>
  </div>
  <button class="btn primary block" style="margin-top:var(--s5)" onclick="nav('/mock')">New test</button>
  <button class="btn ghost block" style="margin-top:10px" onclick="nav('/home')">Home</button>`;
}
</script>

<script>
/* ================================================================
   BOOKMARKS
   ================================================================ */
function toggleBookmark(type, id, ch){
  const idx=S.bookmarks.findIndex(b=>b.type===type&&b.id===id);
  let label;
  if(type==="question"){ const q=QUESTIONS.find(x=>x.id===id); label=q? q.q.slice(0,90):id; }
  else label=id;
  if(idx>=0){ S.bookmarks.splice(idx,1); toast("Removed from Saved"); }
  else{ S.bookmarks.push({type, id, label, ch}); toast("⭐ Saved"); }
  saveState(); updateBmIcons();
}
function updateBmIcons(){
  $$(".flag-btn").forEach(b=>{
    // question flags handled via class on render; nothing needed here for now
  });
  S.bookmarks.filter(b=>b.type==="concept").forEach(b=>{
    const el=document.getElementById("bm-c-"+hashId(b.id));
    if(el) el.textContent="★";
  });
}
route("/saved", ()=>{
  if(!S.bookmarks.length){
    $("#view").innerHTML=`<div class="empty"><div class="e-ico">⭐</div><h2>Nothing saved yet</h2><p class="small" style="margin-top:8px">Tap the ★ on any question or concept to bookmark it.</p></div>`;
  } else {
    $("#view").innerHTML=`<h1 style="margin-bottom:var(--s5)">⭐ Saved</h1>`+
      S.bookmarks.map(b=>{
        const c=chapOf(b.ch);
        if(b.type==="question"){
          const q=QUESTIONS.find(x=>x.id===b.id);
          return `<div class="card tap" style="margin-bottom:10px" onclick="reviewSavedQ('${b.id}')">
            <div class="small muted" style="margin-bottom:6px">${c?esc(c.name):""}</div>${esc(b.label)}…</div>`;
        }
        return `<div class="card" style="margin-bottom:10px"><span class="badge std">concept</span>
          <div style="margin-top:6px">${esc(b.label)}</div>
          <div class="small muted" style="margin-top:4px">${c?esc(c.name):""}</div></div>`;
      }).join("");
  }
  $("#hdrTitle").textContent="Saved";
});
function reviewSavedQ(qid){
  const q=QUESTIONS.find(x=>x.id===qid); if(!q) return;
  openSheet(`<div class="q-meta"><span class="badge ${DIFF_BADGE[q.d]}">${DIFF_NAME[q.d]}</span></div>
    <p style="font-weight:600;margin:10px 0">${esc(q.q)}</p>
    ${q.o.length? q.o.map((o,i)=>`<div class="opt ${i===q.a?'right':''}" style="cursor:default"><span class="opt-key">${"ABCD"[i]}</span><span>${esc(o)}</span></div>`).join(""):`<div class="sol-box"><b>Answer:</b> ${esc(q.ans||"")}</div>`}
    <div class="sol-box" style="margin-top:10px">${(q.sol||[]).map((s2,i)=>`<div class="sol-step"><b>${i+1}.</b><span>${esc(s2)}</span></div>`).join("")}</div>
    <button class="btn ghost block" style="margin-top:10px" onclick="closeSheet()">Close</button>`);
}

/* ================================================================
   MISTAKE NOTEBOOK
   ================================================================ */
route("/mistakes", ()=>{
  const ms=S.mistakes.slice().reverse();
  const open=ms.filter(m=>!m.resolved), done=ms.filter(m=>m.resolved);
  $("#view").innerHTML=`
  <div style="margin-bottom:var(--s4)"><h1>❌ Mistake Notebook</h1>
  <p class="muted">${open.length} to revisit · ${done.length} conquered</p></div>
  ${!ms.length? `<div class="empty"><div class="e-ico">🎯</div>No mistakes logged yet.<br><span class="small">When you answer wrong in Solve or Practice, you'll be asked to classify the mistake here.</span></div>`:""}
  ${open.map((m,i)=>{
    const q=QUESTIONS.find(x=>x.id===m.qid); const c=chapOf(m.ch);
    return `<div class="card" style="margin-bottom:10px">
      <div class="q-meta"><span class="badge chal">${esc(m.type)}</span><span class="badge std">${c?esc(c.name):""}</span><span class="small faint">${fmtDate(m.ts)}</span></div>
      <p style="font-weight:550">${esc(q?q.q:"")}</p>
      ${q? `<div class="small" style="margin-top:8px"><span class="muted">Correct answer:</span> <b>${esc(q.o&&q.o.length? "ABCD"[q.a]+") "+q.o[q.a] : q.ans||"—")}</b></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn sm" onclick="reviewSavedQ('${q.id}')">View solution</button>
        <button class="btn sm success" onclick="resolveMistake('${q.id}',true)">✓ Mastered</button>
      </div>`:""}
    </div>`;}).join("")}
  ${done.length? `<div class="section-title"><h2>Conquered</h2></div>`+done.map(m=>{
    const q=QUESTIONS.find(x=>x.id===m.qid);
    return `<div class="row" style="margin-bottom:8px;opacity:.6"><span>✅</span><div class="grow"><div class="small">${esc(q?q.q.slice(0,80):"")}</div><div class="small muted">${esc(m.type)}</div></div>
    <button class="btn sm ghost" onclick="resolveMistake('${q? q.id:""}',false)">Reopen</button></div>`;}).join(""):""}`;
  $("#hdrTitle").textContent="Mistakes";
});
function resolveMistake(qid, ok){
  const m=S.mistakes.find(x=>x.qid===qid); if(!m) return;
  m.resolved=ok; saveState(); render();
}

/* ================================================================
   SMART REVISION
   ================================================================ */
route("/revision", ()=>{
  const due=revisionsDue();
  const upcoming=Object.keys(S.revision).filter(k=>{
    const c=chapOf(k); return c && S.revision[k].next>Date.now() && masteryOf(k)>0;
  }).sort((a,b)=>S.revision[a].next-S.revision[b].next);
  const REV_LABEL=["Today","Tomorrow","in 3 days","in 7 days","in 2 weeks","in a month"];
  $("#view").innerHTML=`

route("/search", ()=>{
  $("#view").innerHTML=`

    <span class="muted">🔎</span>

  $("#hdrTitle").textContent="Search";
  const inp=$("#searchInp");
  inp.addEventListener("input", ()=>{
    const q=inp.value.trim().toLowerCase();
    const out=$("#searchResults");
    if(q.length<2){ out.innerHTML='<div class="empty"><div class="e-ico">⌨️</div>Keep typing…</div>'; return; }
    const hits=[];
    for(const s of SUBJECTS){
      if(s.name.toLowerCase().includes(q)) hits.push({icon:s.icon, t:s.name, sub:"Subject", go:`/learn/${s.id}`});
      for(const c of s.chapters){
        if(c.name.toLowerCase().includes(q)) hits.push({icon:s.icon, t:c.name, sub:s.name+" · chapter", go:`/learn/ch/${c.id}`});
        const notes=NOTES[c.id];
        if(notes&&notes.short){
          for(const it of notes.short){
            const txt=typeof it==="string"? it : (it.f||it.h||it.e||it.x||it.w||"");
            if(txt && txt.toLowerCase().includes(q)) hits.push({icon:"⚡", t:txt.slice(0,100), sub:c.name+" · short notes", go:`/notes/${c.id}/short`});
          }
        }
      }
    }
    for(const q2 of QUESTIONS){
      if(q2.q.toLowerCase().includes(q)) hits.push({icon:"✍️", t:q2.q.slice(0,100), sub:(chapOf(q2.ch)||{}).name+" · question", go:`/solve/${q2.ch}`});
    }
    for(const m of S.mistakes){
      const q3=QUESTIONS.find(x=>x.id===m.qid);
      if(q3&&q3.q.toLowerCase().includes(q)) hits.push({icon:"❌", t:q3.q.slice(0,100), sub:(chapOf(m.ch)||{}).name+" · mistake", go:`/mistakes`});
    }
    const uniq=[]; const seen={};
    for(const h of hits){ if(!seen[h.t]){ seen[h.t]=1; uniq.push(h);} if(uniq.length>=20) break; }
    out.innerHTML = uniq.length? uniq.map(h=>`<div class="row tap" style="margin-bottom:8px" onclick="nav('${h.go}')">
        <span style="font-size:1.2rem">${h.icon}</span>
        <div class="grow"><div class="small" style="font-weight:600">${esc(h.t)}</div><div class="small muted">${esc(h.sub)}</div></div>
      </div>`).join("")
      : `<div class="empty"><div class="e-ico">🤷</div>No matches for "${esc(q)}".</div>`;
  });
});

function exportData(){
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="ilk-study-lab-backup-"+todayKey()+".json";

function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result);
      if(!data.settings||!data.progress) throw 0;
      S=data; saveState(); applyTheme(); toast("Progress restored ✓"); nav("/home"); render();
    }catch(e){ toast("Invalid backup file"); } };
  r.readAsText(f);
}

    "s": [
      { "d": "A conductor carrying a current, placed in a magnetic field, experiences a mechanical force that can move it; the direction of this force is given by Fleming's left-hand rule." },
      { "why": "Electric current is nothing but moving charges (electrons), and a moving charge in a magnetic field experiences a push (this is the same physics that runs particle accelerators — a NEET-level insight). Another way to see it: the current's own field and the magnet's field superpose. On one side of the wire the two fields add and become strong; on the other side they cancel and become weak. The wire is pushed from the strong-field side towards the weak-field side — that push is the force. Reverse the current and the strong/weak sides swap, so the force reverses; reverse the magnet's poles and the force reverses too. If the wire lies parallel to the field, the two sides are equally affected and the force is zero." },
      { "f": "F = B × I × L (force on a straight wire perpendicular to the field — bigger field, bigger current, longer wire all give a bigger push)" },
      { "how": [
        "Stretch the thumb, forefinger and middle finger of your LEFT hand so that all three are mutually perpendicular.",
        "Point the forefinger along the direction of the magnetic field (N-pole to S-pole direction of the external field).",
        "Point the middle finger along the direction of the conventional current (positive to negative).",
        "The thumb now points in the direction of the force (motion of the wire).",
        "Verify with the activity: an aluminium rod between the poles of a horseshoe magnet deflects when current flows, reverses when current is reversed, and reverses again when the magnet is flipped."
      ] },
      { "terms": {
        "Fleming's left-hand rule": "Left-hand mnemonic giving the force direction on a current-carrying conductor in a magnetic field (used for motors).",
        "Motor effect": "The conversion of electrical energy into mechanical energy by the force on a current in a field.",
        "Armature": "The rotating coil wound on a soft-iron core in a motor.",
        "Split-ring commutator": "The two-half ring in a DC motor that reverses the current direction every half rotation so the coil keeps spinning in one direction."
      } },
      { "ex": "A 10 cm wire carries a current of 2 A perpendicular to a magnetic field of 0.5 T. Force F = B I L = 0.5 × 2 × 0.1 = 0.1 N. Direction: suppose the field points east and the current flows north. Hold your left hand: forefinger east (field), middle finger north (current) — the thumb points vertically UP, so the force is 0.1 N upward. Double the current to 4 A and the force doubles to 0.2 N, because F is proportional to I." },
      { "rw": "This force is the working principle of every electric fan, washing machine motor, mixer grinder and loudspeaker in your home — electrical energy in, spinning motion out." },
      { "mis": "The classic error is using the RIGHT hand for the motor effect (right hand is for induced current — see generators). Second error: forgetting that no force acts when the wire is parallel to the field; the full push appears only when the wire is perpendicular to B." },
      { "exam": "A 1-mark MCQ usually tests the rule itself ('In Fleming's left-hand rule, the middle finger shows the direction of ___' — current). A 3-mark favourite asks you to describe the aluminium-rod-and-horseshoe-magnet activity, including what happens on reversing current or field. The 5-mark classic is the electric motor: principle, working, and the role of the split-ring commutator and brushes." },
      { "qc": { "q": "In Fleming's left-hand rule, the middle finger indicates the direction of —", "o": ["the force on the conductor", "the magnetic field", "the current", "the motion of the magnet"], "a": 2 } }
    ]
  },
  {
    "t": "Electromagnetic Induction — Fleming's Right-Hand Rule; Motor vs Generator",
    "s": [
      { "d": "Electromagnetic induction is the production of an electric current in a coil or wire whenever the magnetic field around it changes (due to relative motion between the wire/coil and a magnet); Fleming's right-hand rule gives the direction of the induced current." },
      { "why": "Michael Faraday found that a changing magnetic field 'linked' with a circuit drives current in it — a constant, unchanging field does not. Only RELATIVE motion between the coil and magnet changes the field the coil experiences, so only then does the galvanometer deflect. Deep principle (NEET foundation): energy conservation. When you push a magnet towards a coil, the induced current creates its own field that opposes your push, so your mechanical work gets converted into electrical energy — a generator is exactly a machine that never gives you energy for free. Moving the magnet faster changes the flux faster, so the induced current is larger." },
      { "how": [
        "Connect a coil of insulated copper wire to a sensitive galvanometer (a centre-zero meter that shows current direction).",
        "Push the N-pole of a bar magnet into the coil — the galvanometer needle swings, say, to the right: induced current flows.",
        "Hold the magnet still inside the coil — the needle returns to zero; no change in field means no current.",
        "Pull the magnet out — the needle swings to the left: the induced current reverses.",
        "Repeat with the S-pole, or move the magnet faster — the deflection reverses again or becomes larger."
      ] },
      { "terms": {
        "Electromagnetic induction": "Current produced in a circuit due to a changing magnetic field around it.",
        "Galvanometer": "An instrument that detects even tiny currents and shows their direction.",
        "Fleming's right-hand rule": "Stretch thumb, forefinger and middle finger of the RIGHT hand mutually perpendicular; forefinger = field, thumb = motion of conductor, middle finger = induced current.",
        "Slip rings": "Full rings used in an AC generator to carry the alternating current out without reversing it; a split-ring commutator is used instead in a DC generator."
      } },
      { "f": "Induced EMF ∝ rate of change of magnetic flux (Faraday); faster change → larger EMF" },
      { "ex": "Coil connected to a galvanometer, magnet moved N-pole first: (i) magnet pushed IN — needle deflects right; (ii) magnet HELD inside — deflection zero; (iii) magnet pulled OUT — needle deflects left; (iv) magnet reversed (S-pole first) and pushed in — needle deflects left (opposite of case i); (v) the same motion done in half the time — the deflection is roughly twice as large, because the EMF depends on how fast the field changes, not on how strong the magnet is." },
      { "rw": "Every power station — hydro, thermal, wind, even the dynamo bulb on a bicycle — is nothing but a coil and a magnet in relative motion. Induction cooktops and wireless phone chargers use the same physics with no moving parts." },
      { "mis": "Students believe a magnet lying still inside a coil induces current. Correction: a STATIC field induces nothing; something must change (motion, or a switching current, as in transformers). Second error: mixing up the hand rules — remember 'LEFT for motors (electricity → motion), RIGHT for generators (motion → electricity)'." },
      { "exam": "A 3-mark regular: describe the coil-and-galvanometer activity and the conditions for induced current. A 5-mark regular: state differences between an AC and a DC generator, or between a motor and a generator. MCQs test Fleming's right-hand rule directions and 'when is the deflection maximum/zero'. Examiners want the words 'relative motion' and 'changing magnetic field' explicitly in your answer." },
      { "qc": { "q": "A bar magnet is held completely stationary inside a coil connected to a galvanometer. The galvanometer reads —", "o": ["maximum, because the magnet is inside", "zero, because the magnetic field around the coil is not changing", "left deflection", "right deflection"], "a": 1 } }
    ]
  }
],

"p-eye": [
  {
    "t": "Accommodation — How Ciliary Muscles Keep the Image on the Retina",
    "s": [
      { "d": "Accommodation is the ability of the eye to change the focal length of its crystalline lens (by changing its curvature with the ciliary muscles) so that objects at different distances all form sharp images on the retina." },
      { "why": "The distance between the lens and the retina is fixed at about 2.5 cm and cannot change — so the image distance v is practically constant. But the object distance u changes every time you look somewhere else. From the lens formula 1/v − 1/u = 1/f, the only variable left that the eye can adjust is the focal length f. Looking at a distant hill: u is huge, 1/u ≈ 0, so the lens needs its maximum focal length — the ciliary muscles RELAX, the lens becomes thin and flat. Reading a book: u is small, the lens must converge more — the ciliary muscles CONTRACT, the lens becomes thicker and more curved, shortening f. The eye adjusts the lens to the object, instead of moving the screen like a camera does." },
      { "f": "1/v − 1/u = 1/f  →  with v fixed at ≈ 2.5 cm, f must decrease for nearby objects" },
      { "how": [
        "Look at a distant object: ciliary muscles relax, suspensory ligaments pull, the lens becomes thinner, focal length is maximum.",
        "Switch your gaze to a nearby book: ciliary muscles contract, the lens bulges and thickens, focal length shortens.",
        "The thicker lens bends the rays more so the image still forms exactly on the retina, not in front of or behind it.",
        "The closest distance at which the eye can focus comfortably (about 25 cm) is the least distance of distinct vision."
      ] },
      { "terms": {
        "Ciliary muscles": "Ring of muscles that changes the curvature of the eye lens to alter its focal length.",
        "Retina": "The light-sensitive screen of the eye on which the real, inverted image must form for clear vision.",
        "Power of a lens": "P = 1/f (f in metres); unit dioptre (D) — a shorter focal length means a bigger, positive power number.",
        "Least distance of distinct vision": "About 25 cm for a normal eye — the minimum comfortable reading distance.",
        "Far point": "The farthest distance a normal eye can see clearly: infinity."
      } },
      { "ex": "Image distance v = 2.5 cm. For a distant object: 1/f = 1/v − 1/u ≈ 1/2.5 − 0, so f = 2.5 cm and P = 100 cm / 2.5 cm = 40 D. For an object at the near point, u = −25 cm (Cartesian sign convention: object distance is negative): 1/f = 1/v − 1/u = 1/2.5 − (−1/25) = 0.4 + 0.04 = 0.44, so f = 1/0.44 ≈ 2.27 cm and P = 100/2.27 ≈ 44 D. The eye's power rises from 40 D to about 44 D just to read — that extra 4 D of squeezing is the ciliary muscles at work." },
      { "rw": "A camera focuses by moving its lens back and forth; your eye focuses by reshaping a biological lens — faster, silent and continuous. After 40, the lens loses elasticity, the muscles cannot make it round enough, and reading glasses (presbyopia) are needed." },
      { "mis": "Students often say the eye changes the image distance, i.e. the retina moves. Correction: v is fixed at 2.5 cm; only the focal length changes. Another common slip: computing power with focal length in cm — dioptres require metres (f = 2.5 cm is 0.025 m, not 2.5 m)." },
      { "exam": "1-mark MCQ: 'The focal length of the human eye increases/decreases when viewing distant/near objects' or 'which muscles change the lens curvature'. 2-3 marks: 'Why is the image distance in the eye constant?' and 'How does the eye adjust for objects at varying distances?' Examiners want the words ciliary muscles, contract/relax, and focal length changes — and NOT 'the eye moves the retina'." },
      { "qc": { "q": "To focus on a nearby object, the ciliary muscles of the eye —", "o": ["relax, making the lens thinner", "contract, making the lens thicker and its focal length shorter", "push the retina backwards", "rotate the lens"], "a": 1 } }
    ]
  },
  {
    "t": "Myopia and Hypermetropia — Ray-Diagram Reasoning and Lens Correction",
    "s": [
      { "d": "Myopia (near-sightedness) is the defect in which distant objects are focused in FRONT of the retina, blurring far vision; hypermetropia (far-sightedness) is the defect in which nearby objects are focused BEHIND the retina, blurring near vision." },
      { "why": "Myopia has two possible causes: excessive curvature of the eye lens (too much converging power) or an elongated eyeball — either way rays from a distant object meet before reaching the retina. Since the lens cannot get any flatter than 'fully relaxed', the image cannot be pulled back — so we put a DIVERGING (concave) lens in front, which first spreads the parallel rays; the eye then converges them exactly onto the retina. Hypermetropia is the mirror image: the lens is too flat / the eyeball too short, so rays from a 25 cm object would meet behind the retina. The lens cannot bulge beyond its limit, so we add a CONVERGING (convex) lens that does part of the converging in advance, bringing the image forward onto the retina. In both cases spectacles do not replace the eye lens — they just shift the rays so the eye's own lens can finish the job." },
      { "how": [
        "For myopia: draw parallel rays from a distant object entering the eye; show them converging to a point in front of the retina.",
        "Note the person's far point (the maximum distance they see clearly, e.g. 2 m instead of infinity).",
        "Place a concave lens of suitable power: parallel rays are made divergent, so the eye focuses them exactly on the retina.",
        "For hypermetropia: draw rays from an object at 25 cm; show them meeting behind the retina.",
        "Place a convex lens: it converges the rays early, so the image falls on the retina."
      ] },
      { "f": "1/f = 1/v − 1/u (Cartesian sign convention), P = 1/f(in m) dioptres; myopia needs P negative, hypermetropia needs P positive" },
      { "terms": {
        "Myopia": "Far point comes closer than infinity; distant objects focus in front of the retina; corrected by a concave lens.",
        "Hypermetropia": "Near point recedes beyond 25 cm; near objects focus behind the retina; corrected by a convex lens.",
        "Far point": "The farthest distance seen clearly — infinity for a normal eye, maybe only 1-2 m for a myope.",
        "Near point": "The nearest distance seen clearly — 25 cm for a normal eye; often 1 m or more for a hypermetrope.",
        "Presbyopia": "Age-related loss of accommodation; bifocal lenses (upper concave, lower convex) correct it when it coexists with myopia."
      } },
      { "ex": "MYOPIA: far point = 2 m. The concave lens must take an object at infinity and make it a virtual image at 2 m: u = −∞, v = −2 m, so 1/f = 1/v − 1/u = −1/2 − 0 = −1/2, f = −2 m, P = −0.5 D. HYPERMETROPIA: near point receded to 1 m. The convex lens must take an object at u = −0.25 m and form its virtual image at v = −1 m: 1/f = 1/v − 1/u = −1 + 4 = +3, so f = +1/3 m and P = +3 D. Notice the signs: minus for the diverging myopia lens, plus for the converging hypermetropia lens." },
      { "rw": "Opticians 'prescribe power' in exactly these dioptres; LASIK surgery reshapes the cornea to permanently add or subtract the missing power, doing what the spectacle lens did." },
      { "mis": "Two perennial confusions. (1) Which lens for which defect — anchor it this way: myopes are 'too strong' (excess convergence) so they get minus/negative power; hypermetropes are 'too weak' so they get plus/positive power. (2) Myopia is misread as 'cannot see near' — it is the opposite: a myope reads fine but cannot see far." },
      { "exam": "This is one of the most repeated 3-mark questions in boards: draw labelled ray diagrams showing (i) the myopic eye with the image in front of the retina and (ii) its correction with a concave lens (same for hypermetropia with a convex lens). Numericals on lens power for the two defects (as in the example above) appear as 2-3 marks. Presbyopia-vs-hypermetropia is a favourite 2-mark distinction — presbyopia is ageing of the lens, hypermetropia is a structural defect possible even in the young. Examiners award marks for the image position (front/behind retina) drawn correctly." },
      { "qc": { "q": "A person cannot see objects beyond 2 m clearly. The defect and the correcting lens are —", "o": ["hypermetropia, convex lens", "myopia, concave lens of power −0.5 D", "myopia, convex lens", "presbyopia, bifocal lens"], "a": 1 } }
    ]
  },
  {
    "t": "Dispersion — Why Violet Bends Most and a Prism Splits White Light",
    "s": [
      { "d": "Dispersion is the splitting of white light into its constituent colours (VIBGYOR — violet, indigo, blue, green, yellow, orange, red) when it passes through a prism, because different colours bend by different amounts." },
      { "why": "The refractive index of glass is not the same for every colour — it depends on the wavelength of light. Violet light has the shortest wavelength and experiences the HIGHEST refractive index in the prism material, so it travels slowest and bends (refracts) the most at each face; red has the longest wavelength, the lowest refractive index, and bends the least. A rectangular glass slab has two PARALLEL faces, so the bending on the second face exactly undoes the bending on the first and the colours recombine into white light — which is why we see dispersion only with a prism, whose faces are INCLINED, so the deviations at the two faces add up and the colours emerge separated. Crucially, the prism does not create the colours: white light already contains them all; the prism only separates what was hidden (Newton proved this by recombining the spectrum with a second identical prism and getting white light back)." },
      { "how": [
        "Pass a narrow beam of sunlight through a triangular glass prism in a dark room.",
        "At the first face, each colour refracts by a different amount — violet the most, red the least.",
        "At the second (inclined) face, the colours refract again and the deviations add, spreading them further apart.",
        "On the screen, a band appears with violet at the bottom (most deviated) and red at the top: the spectrum VIBGYOR.",
        "To prove white light is a mixture, pass the whole spectrum through a second identical prism kept inverted — the rays recombine and a white patch emerges."
      ] },
      { "terms": {
        "Dispersion": "Separation of white light into its component colours on refraction through a prism.",
        "Spectrum": "The band of seven colours obtained after dispersion, from red (least deviated) to violet (most deviated).",
        "Refractive index": "Ratio of the speed of light in vacuum to its speed in a medium; higher for violet than for red in the same medium.",
        "Deviation": "The angle by which a ray is turned from its original path by refraction."
      } },
      { "ex": "Ray diagram check: a single white ray enters a prism and leaves as seven rays. Measure the deviation of the extreme rays: red deviates least, violet most, with indigo, blue, green, yellow and orange in between, in that fixed order. Newton's control experiment: prism 1 spreads the colours, prism 2 (inverted) refracts each colour back by the same amount it was bent, so the fan of rays reconverges and emerges as one WHITE ray — direct proof that white light is a mixture, not a pure colour." },
      { "rw": "A rainbow is dispersion by nature: sunlight refracts into suspended raindrops, reflects once inside, and refracts out — each drop acting as a tiny prism, with violet on the inside of the arc and red on the outside. Spectrometers use the same effect to identify elements in stars." },
      { "mis": "Students say 'violet bends most because it is heavier'. Correction: light has no weight here — violet slows down most in glass because the glass's refractive index is highest for violet's short wavelength, and the bigger speed change causes the bigger bend. Also, saying the prism 'creates' the seven colours is wrong: the colours were already present in white light." },
      { "exam": "A 1-mark MCQ asks which colour deviates most/least (violet / red). A 2-3 mark question asks you to draw the dispersion of white light through a prism with the correct order of colours, or to explain WHY violet bends most — the keywords are 'refractive index is different for different colours' and 'wavelength'. Related 2-3 mark questions use the same physics for atmospheric refraction: twinkling of stars, stars appearing higher than they are, and the Sun visible about 2 minutes before sunrise and after sunset." },
      { "qc": { "q": "White light passing through a glass prism splits into colours. The colour deviated the MOST is —", "o": ["red", "yellow", "violet", "green"], "a": 2 } }
    ]
  }
],

"c-acid": [
  {
    "t": "Acids, Bases and the pH Scale — The H⁺/OH⁻ Ion Picture",
    "s": [
      { "d": "An acid is a substance that releases H⁺ ions (which bond to water as hydronium, H₃O⁺) in aqueous solution; a base releases OH⁻ ions in water; the pH scale (0-14) measures how concentrated the H⁺ ions are — lower pH means more H⁺, i.e. more acidic." },
      { "why": "All acid chemistry is H⁺ chemistry. Acidic properties (sour taste, turning blue litmus red, reacting with metals to give H₂ gas) come from the H⁺ ion itself — no water, no ions, no acid behaviour (which is why HCl gas does not conduct electricity, but HCl in water does). Strong acids like HCl ionize almost completely in water, releasing the maximum possible H⁺; weak acids like acetic acid (CH₃COOH, vinegar) ionize only partially, so the same concentration of vinegar holds far fewer free H⁺. Pure water itself splits very slightly: 1 in every ~5 crore molecules becomes H⁺ and OH⁻ in exactly equal numbers (each 10⁻⁷ mol/L), which is why water is neutral, pH 7. The pH scale is logarithmic — a jump of 1 pH unit means a TEN-fold change in H⁺ concentration, so lemon juice (pH ~2) holds 100,000 times more H⁺ than pure water (pH 7)." },
      { "f": "pH = −log₁₀[H⁺]; neutral water has [H⁺] = [OH⁻] = 10⁻⁷ M, so pH 7; lower pH → more acidic, higher pH → more basic" },
      { "how": [
        "Dissolve the substance in water; ask: what ions did it set free — H⁺ (acid), OH⁻ (base), or neither (neutral)?",
        "Add universal indicator: the colour it turns is calibrated against the pH scale (red ~1, green ~7, purple ~13).",
        "Read the pH: below 7 acidic, at 7 neutral, above 7 basic — each step is a 10× change in H⁺ concentration.",
        "For strength, compare ionization at the same concentration: HCl (strong) vs CH₃COOH (weak).",
        "Remember the life limits: below pH 5.5 the mouth's enamel (calcium phosphate) starts dissolving — hence brushing after acidic food."
      ] },
      { "terms": {
        "Hydronium ion (H₃O⁺)": "The form H⁺ actually takes in water — a bare proton grabbed by a water molecule.",
        "Strong acid / weak acid": "Ionizes completely (HCl, H₂SO₄, HNO₃) vs partially (CH₃COOH, H₂CO₃) in water.",
        "Universal indicator": "A mixture of indicators giving a different colour for every pH value.",
        "Neutralization": "Acid + base → salt + water; the H⁺ of the acid and the OH⁻ of the base combine to make H₂O."
      } },
      { "ex": "Neutralization by mass: HCl + NaOH → NaCl + H₂O. Molar masses: HCl = 36.5, NaOH = 40, NaCl = 58.5, H₂O = 18. So exactly 36.5 g of HCl is neutralized by exactly 40 g of NaOH, giving 58.5 g of salt — mass is conserved. pH arithmetic: if [H⁺] = 10⁻³ M, then pH = −log(10⁻³) = 3. Dilute it ten times, [H⁺] = 10⁻⁴ M, pH = 4 — one unit up per ten-fold dilution. Same-concentration comparison: 1 M HCl is fully ionized (pH ≈ 0) while 1 M acetic acid is only partly ionized (pH ≈ 2.4) — strength is about ionization, not amount." },
      { "rw": "Tooth enamel (calcium phosphate) corrodes when mouth pH drops below 5.5 — bacteria feed on sugar and make acid, so the dentist's warning is pure chemistry. Acid rain (pH < 5.6) kills fish and leaches soil; farmers spread quicklime on acidic soil, and we pop antacid tablets (milk of magnesia, Mg(OH)₂) to neutralize excess stomach HCl. Blood is held at pH 7.4 — a tiny shift is lethal." },
      { "mis": "The most common error: equating 'strong' with 'concentrated'. Strength = the EXTENT of ionization in water (HCl strong, acetic acid weak — a fixed property of the substance); concentration = how much of it per litre of water (you can have a dilute strong acid and a concentrated weak acid). Examiners test this distinction directly." },
      { "exam": "1-mark MCQs give a pH value and ask about the substance or the colour with universal indicator. 2-3 marks: 'Why does tooth decay occur below pH 5.5?', 'Why is quicklime added to soil?', 'Why does dry HCl gas not turn litmus red but HCl solution does?' (answer: ionization requires water). The 5-mark pattern asks for chemical properties of acids and bases with balanced equations (reaction with metals, metal carbonates, metal oxides). Always write ionic equations where asked — marks are reserved for H⁺ and OH⁻." },
      { "qc": { "q": "Two solutions X (pH 3) and Y (pH 5) are compared. Which statement is correct?", "o": ["Y has 100 times more H⁺ than X", "X has 100 times more H⁺ than Y, because each pH unit is a ten-fold change", "both have equal H⁺", "X is basic"], "a": 1 } }
    ]
  },
  {
    "t": "The Chlor-Alkali Process — One Salt Gives a Whole Family of Chemicals",
    "s": [
      { "d": "The chlor-alkali process is the electrolysis of brine (a concentrated aqueous solution of common salt, NaCl), which decomposes it into three products: sodium hydroxide (the 'alkali'), chlorine (the 'chlor') and hydrogen gas." },
      { "why": "Passing electricity through brine forces opposite changes at the two electrodes. At the ANODE, Cl⁻ ions lose electrons (oxidation) and pair up as Cl₂ gas. At the CATHODE, it is easier to reduce water molecules than Na⁺ ions, so water splits, releasing H₂ gas. With the H₂ gone and the Na⁺ left behind, the solution around the cathode accumulates OH⁻ — sodium hydroxide forms in the solution while the gases bubble out. The three products never get to fully mix in an industrial cell. The name encodes the products: 'chlor' from chlorine, 'alkali' from NaOH. Every one of the three is a starting material for more chemicals, which is why this single process sits at the base of the modern chemical industry." },
      { "f": "2NaCl(aq) + 2H₂O(l) --electricity--> 2NaOH(aq) + Cl₂(g) + H₂(g)" },
      { "how": [
        "Prepare brine: a concentrated aqueous solution of sodium chloride.",
        "Pass direct current through it using two electrodes.",
        "At the anode, Cl⁻ is oxidized: 2Cl⁻ → Cl₂ + 2e⁻ (greenish-yellow chlorine gas bubbles out).",
        "At the cathode, water is reduced: 2H₂O + 2e⁻ → H₂ + 2OH⁻ (hydrogen gas bubbles out, NaOH stays dissolved).",
        "Keep the products separated; evaporate the remaining solution to get solid NaOH."
      ] },
      { "terms": {
        "Brine": "Concentrated aqueous solution of sodium chloride — the raw material of the process.",
        "Electrolysis": "Decomposition of a substance by passing electricity through it.",
        "Anode": "The electrode where oxidation occurs — here Cl₂ is released.",
        "Cathode": "The electrode where reduction occurs — here H₂ is released and NaOH forms in solution."
      } },
      { "ex": "Mass check of the balanced equation: reactants = 2NaCl + 2H₂O = (2 × 58.5) + (2 × 18) = 117 + 36 = 153 g. Products = 2NaOH + Cl₂ + H₂ = (2 × 40) + 71 + 2 = 80 + 71 + 2 = 153 g. Mass is exactly conserved — for every 117 g of salt electrolysed you get 80 g of NaOH, 71 g of Cl₂ and 2 g of H₂. Downstream: that Cl₂ with dry slaked lime gives bleaching powder, CaOCl₂, used to disinfect drinking water." },
      { "rw": "Soaps and detergents (NaOH), paper and artificial fibres, PVC and plastics (Cl₂), fuels and margarine (H₂ — hydrogenation), and bleaching powder for water treatment: an enormous share of the chemical industry descends from salt water and electricity. In India, coastal caustic-chlorine plants supply both the soap and the water-treatment sectors." },
      { "mis": "Students place Cl₂ at the cathode. Correction: like charges repel — the negative Cl⁻ ion migrates to the POSITIVE anode, where it is oxidized; H₂ forms at the cathode because water is reduced there (Na⁺ is too stable to be reduced by the available electrons in aqueous solution). Second error: thinking NaOH is produced as a gas — it stays behind in solution." },
      { "exam": "The single most banked question of this chapter: write the balanced chemical equation of brine electrolysis WITH the condition 'electricity' written over the arrow (2 marks), then list uses of NaOH, Cl₂ and H₂ (3 marks — memorise at least two uses each). MCQs ask which gas is released at which electrode. Examiners deduct marks if the (aq), (g) state symbols or the electrolysis condition are missing." },
      { "qc": { "q": "In the chlor-alkali process, the gases released at the anode and cathode respectively are —", "o": ["H₂ and Cl₂", "Cl₂ and H₂", "O₂ and H₂", "Cl₂ and O₂"], "a": 1 } }
    ]
  }
],
"c-metal": [
  {
    "t": "The Reactivity Series — Why K Explodes in Water but Gold Never Reacts",
    "s": [
      { "d": "The reactivity series arranges metals in decreasing order of how easily they lose their outermost electrons to form positive ions: K > Na > Ca > Mg > Al > Zn > Fe > Pb > (H) > Cu > Hg > Ag > Au." },
      { "why": "A metal's reactivity is essentially its willingness to donate valence electrons. In potassium (2,8,8,1) the single outer electron feels a weak pull from a distant, well-shielded nucleus — it is lost easily, so K is so reactive it catches fire in cold water. In gold, the outer electrons are held much more firmly, so gold refuses to react even with steam and is found free in nature. The series is really a ladder of electron-losing tendency, and every reaction of a metal — with water, dilute acid, or another metal's salt — is a contest of that tendency. Hydrogen sits in the ladder because metals above it can push H⁺ out of acids (giving H₂ gas) while metals below cannot. Displacement reactions confirm the order experimentally: iron displaces copper from copper sulphate, but copper can never displace iron — the more reactive metal always wins the electrons." },
      { "how": [
        "Observe the reaction of different metals with cold water: K and Na react violently; calcium reacts gently; others do not react.",
        "Heat the unreactive ones and pass steam over them: Mg, Al, Zn and Fe react with steam; Cu, Ag and Au do not react even with steam.",
        "Test with dilute HCl: everything above hydrogen in the series gives H₂ bubbles; Cu, Ag, Au give no reaction.",
        "Run displacement tests (a metal strip dipped in another metal's salt solution) — a reaction occurs only if the strip is higher in the series.",
        "Assemble the evidence into the single ordered list — that list IS the reactivity series."
      ] },
      { "f": "Metal + cold water/steam → metal oxide/hydroxide + H₂ (only for metals above hydrogen); more reactive metal displaces a less reactive one from its salt solution" },
      { "terms": {
        "Reactivity series": "The arrangement of metals (and hydrogen) in order of decreasing reactivity — i.e. decreasing tendency to lose electrons.",
        "Displacement reaction": "A more reactive metal pushes a less reactive metal out of its salt solution, e.g. Fe + CuSO₄ → FeSO₄ + Cu.",
        "Amphoteric oxide": "An oxide that reacts as both acid and base (Al₂O₃, ZnO) — relevant to why aluminium's protective oxide makes it behave unusually."
      } },
      { "ex": "Drop an iron nail into blue copper sulphate solution. Overnight the blue fades to pale green (FeSO₄) and a brown deposit of copper coats the nail: Fe + CuSO₄ → FeSO₄ + Cu — iron is above copper, so it takes the sulphate. Now do the reverse with a copper wire in FeSO₄: nothing happens, because copper, sitting below iron, cannot win the electrons. Mass check of the forward reaction: 56 g Fe displaces 63.5 g Cu from 159.5 g CuSO₄ (FeSO₄ formed = 152 g, i.e. 159.5 + 56 = 63.5 + 152 — conserved)." },
      { "rw": "Galvanization works because of this ladder: a zinc coating on iron not only blocks air and water, it also sacrifices itself — being more reactive, Zn corrodes first and protects Fe even where the coat scratches. This 'sacrificial protection' is used on ships' hulls and underground pipelines." },
      { "mis": "Students think the series ranks metals by 'strength' or hardness — no: a soft alkali metal like sodium is far more reactive than hard iron. It ranks the tendency to LOSE ELECTRONS. Second slip: 'gold is the least reactive substance' — it is merely the least reactive metal in the NCERT series." },
      { "exam": "3-mark bankers: arrange given metals in increasing order of reactivity, and predict whether a given displacement will occur with justification ('Cu + FeSO₄ → no reaction, because copper is less reactive than iron'). 1-mark MCQ: which metal does not react with steam / which reacts violently with cold water. The water-reaction ladder itself (K, Na / Ca / Mg, Al, Zn, Fe / Cu, Ag, Au) is asked as a 2-3 mark comparison table." },
